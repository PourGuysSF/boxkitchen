<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script>
  (function(){
    var raw = localStorage.getItem('boxkitchen_auth');
    var ts = raw ? parseInt(raw, 10) : 0;
    var TTL = 30 * 24 * 60 * 60 * 1000; // 30 days
    if (!ts || isNaN(ts) || (Date.now() - ts) > TTL) {
      window.location.replace('index.html');
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Tempest Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="assets/kitchen.css?v=2026-09-19">
<!-- Shared styling lives in assets/kitchen.css (see docs/page-restyle.md).
     Page-only rules below: the day strip, the crew lists, the week grid and
     how a box reads. Plan: docs/schedule.md. -->
<style>
.sched-week-bar .date-display{white-space:nowrap}
.sched-days{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--hair)}
.sched-day{flex:1;min-width:0;min-height:48px;padding:6px 0;background:var(--paper);border:1px solid var(--edge);border-radius:6px;color:var(--ink);font-family:var(--font-cond);cursor:pointer;line-height:1.15}
.sched-day .dn{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--grey)}
.sched-day .dd{display:block;font-size:1.05rem;font-weight:600}
.sched-day.today{border:2px solid var(--ink)}
.sched-day.today .dd{font-weight:700}
.sched-day.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sched-day.active .dn{color:var(--paper)}
.sched-dayhead{padding:14px 18px 6px;font-family:var(--font-cond);font-size:1.05rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sched-notes{padding:0 18px 10px}
.sched-note{font-size:0.9rem;padding:2px 0}
.sched-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--hair)}
.sched-name{font-weight:500;min-width:0}
.sched-box{text-align:right;flex-shrink:0}
.sched-shift{color:var(--ink);font-weight:600}
.sched-off{color:var(--grey);font-family:var(--font-cond);font-weight:600;letter-spacing:.08em}
.sched-req{background:var(--yellow);color:var(--ink);padding:1px 6px;font-family:var(--font-cond);font-weight:700;letter-spacing:.08em}
.sched-train{display:block;font-family:var(--font-cond);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--grey)}
.sched-empty{color:var(--grey)}
.sched-updated{padding:14px 18px 90px;font-size:0.85rem;color:var(--grey)}
.sched-gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sched-grid{border-collapse:separate;border-spacing:0;font-size:0.85rem;min-width:100%}
.sched-grid th,.sched-grid td{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);padding:7px 8px;text-align:center;vertical-align:middle;min-width:76px}
.sched-grid thead th{font-family:var(--font-cond);font-weight:700;letter-spacing:.06em;line-height:1.2;border-bottom:1px solid var(--ink)}
.sched-grid thead th .es{display:block;font-weight:500;color:var(--grey)}
.sched-grid thead th.today{background:var(--ink);color:var(--paper)}
.sched-grid thead th.today .es{color:var(--paper)}
.sched-grid .sticky{position:sticky;left:0;z-index:1;background:var(--paper);text-align:left;min-width:110px;border-right:1px solid var(--ink)}
.sched-grid tr.crew th{text-align:left;font-family:var(--font-cond);font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--grey);background:var(--press)}
.sched-grid td.note{font-size:0.8rem}
.sched-err{text-align:center;padding:60px 20px;color:var(--ink)}
/* The PIN box: kitchen.css's .pin-input loses to .modal input[type="tel"] (15.2px); as Inventory. */
.modal input[type="tel"].pin-input{font-size:1.4rem}
/* Manager mode (Slice 2): boxes and notes become buttons, built at render time only. */
.sched-mgrcount{padding:10px 18px;border-bottom:1px solid var(--hair);font-weight:600}
.sched-boxbtn{min-height:44px;min-width:96px;padding:6px 10px;background:var(--paper);border:1px solid var(--edge);border-radius:6px;color:var(--ink);font:inherit;cursor:pointer}
.sched-grid td.sched-celltd{padding:2px}
.sched-cellbtn{display:block;width:100%;min-height:44px;padding:4px 6px;background:var(--paper);border:1px solid var(--edge);border-radius:4px;color:var(--ink);font:inherit;cursor:pointer}
.sched-notebtn{display:block;width:100%;min-height:44px;margin-top:4px;padding:8px 10px;text-align:left;background:var(--paper);border:1px solid var(--edge);border-radius:6px;color:var(--ink);font:inherit;font-size:0.9rem;cursor:pointer}
.sched-notebtn .add{color:var(--grey)}
.sched-now{margin:-6px 0 12px;font-size:0.9rem;color:var(--grey)}
.sched-picks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sched-pick{min-height:44px;padding:8px 12px;background:var(--paper);border:1px solid var(--ink);border-radius:6px;color:var(--ink);font-family:var(--font-cond);font-size:1rem;font-weight:600;letter-spacing:.04em;cursor:pointer}
.sched-pick[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sched-pick:disabled{border-color:var(--edge);color:var(--faint);cursor:default}
.sched-trainbtn{margin-bottom:14px}
/* 16px or iOS zooms: qualified, or kitchen.css's .modal input[type="text"] (15.2px) wins (#135). */
.modal input[type="text"].sched-other,.sched-other{font-size:16px}
.modal input[type="text"].sched-note-input,.sched-note-input{font-size:16px}
.sched-err button{margin-top:14px;min-height:44px;padding:8px 18px;background:var(--paper);border:1px solid var(--ink);border-radius:6px;font-family:var(--font-cond);font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <a class="home-link" href="index.html">← Home</a>
    <h1>Tempest <span>Schedule</span></h1>
    <div class="mgr-toggle"><span>Manager</span><div class="mgr-switch" id="mgrSwitch" onclick="toggleMgr()"><div class="knob"></div></div></div>
  </div>
</div>
<div class="date-bar sched-week-bar">
  <div class="date-left">
    <button class="date-arrow" type="button" aria-label="Previous week" onclick="stepWeek(-1)">◀</button>
    <div class="date-info"><div class="date-display" id="weekLabel"></div></div>
    <button class="date-arrow" type="button" aria-label="Next week" onclick="stepWeek(1)">▶</button>
  </div>
  <div class="date-today" id="thisWeekLink" onclick="goThisWeek()">This week</div>
</div>
<div class="view-toggle">
  <button type="button" id="viewDayBtn" onclick="setView('day')">Day</button>
  <button type="button" id="viewWeekBtn" onclick="setView('week')">Week</button>
</div>
<div id="dayStrip" class="sched-days"></div>
<div class="sched-mgrcount" id="mgrCount" style="display:none"></div>
<div id="appBody"><div class="loading"><div class="spinner"></div><p>Loading the schedule…</p></div></div>
<div class="sched-updated" id="updatedLine"></div>

<!-- Box picker (manager) -->
<div class="modal-bg" id="boxModal">
  <div class="modal">
    <h3 id="boxTitle"></h3>
    <div class="sched-now" id="boxNow"></div>
    <div class="sched-picks" id="boxPicks"></div>
    <label for="boxOther">Other</label>
    <input class="sched-other" type="text" id="boxOther" maxlength="20" autocomplete="off" autocapitalize="off" placeholder="e.g. 11am-CL">
    <button type="button" class="sched-pick sched-trainbtn" id="boxTrain" aria-pressed="false" onclick="toggleTrain()">Training</button>
    <div class="modal-err" id="boxErr"></div>
    <div class="modal-btns">
      <button type="button" class="modal-btn cancel" id="boxClear" onclick="clearBox()">Clear</button>
      <button type="button" class="modal-btn cancel" onclick="closeBox()">Cancel</button>
      <button type="button" class="modal-btn save" id="boxSave" onclick="saveBox()">Save</button>
    </div>
  </div>
</div>

<!-- Games & events picker (manager) -->
<div class="modal-bg" id="noteModal">
  <div class="modal">
    <h3 id="noteTitle"></h3>
    <div class="sched-picks" id="notePicks"></div>
    <label for="noteInput">Games &amp; events</label>
    <input class="sched-note-input" type="text" id="noteInput" maxlength="60" autocomplete="off" placeholder="e.g. 49ers home 1:25">
    <div class="modal-err" id="noteErr"></div>
    <div class="modal-btns">
      <button type="button" class="modal-btn cancel" id="noteClear" onclick="clearNote()">Clear</button>
      <button type="button" class="modal-btn cancel" onclick="closeNote()">Cancel</button>
      <button type="button" class="modal-btn save" id="noteSave" onclick="saveNote()">Save</button>
    </div>
  </div>
</div>

<!-- Manager PIN modal -->
<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>Enter Manager PIN</h3>
    <label>4-digit PIN</label>
    <input class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" autocomplete="off">
    <div class="modal-err" id="pinErr">Incorrect PIN</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePin()">Cancel</button>
      <button class="modal-btn save" onclick="submitPin()">Unlock</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
var SB='https://sxppuyarecqkgkrsrefc.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cHB1eWFyZWNxa2drcnNyZWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTA4MzAsImV4cCI6MjA5Mjk2NjgzMH0.GM8OfcR68_JjdPeQ3k7j6L3ulJFaeS1xnSLBcdtYXtU';
var MANAGER_PIN = '4316';
var API_TIMEOUT=15000;
var LOAD_TIMEOUT=60000;
var VIEW_KEY='boxkitchen_schedule_view';
var mgr=false,st=null,loadSeq=0;
var view='day',weekStart=null,dayIdx=0,todayKey='';
var people=[],shifts={},dayNotes={},standing=[],updatedMax=null;
/* Slice 2: the box and note pickers, and the quick buttons' four-week read */
var pick=null,notePick=null,quick={},quickSeq=0;
var QUICK_MAX=8;
var QUICK_DEFAULT={
  day:['9am-3pm','10am-5pm','10am-3pm','10am-4pm','9am-2pm','9:30am-3pm','9:30am-2pm'],
  night:['4pm-CL','6pm-CL','5pm-CL','10am-4pm','4:30pm-CL','4pm-10']
};
var NOTE_WORDS=['49ers home','Giants home','Football','Event'];

var DAY_EN=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
var DAY_ES=['DOMINGO','LUNES','MARTES','MIERCOLES','JUEVES','VIERNES','SABADO'];
var DAY_AB=['SU','MO','TU','WE','TH','FR','SA'];
var DAY_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* api() with a timeout, from tempest_inventory.html: one callback, status 0
   on no answer. This slice only ever sends GET. */
function api(m,t,q,d,cb,ms,pf){var x=new XMLHttpRequest(),fired=false;function fire(r,s){if(fired)return;fired=true;if(cb)cb(r,s);}
  x.open(m,SB+'/rest/v1/'+t+(q?'?'+q:''));x.timeout=ms||(m==='GET'?LOAD_TIMEOUT:API_TIMEOUT);x.setRequestHeader('apikey',SK);x.setRequestHeader('Authorization','Bearer '+SK);if(d){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Prefer',pf||'return=representation');}
  x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}fire(r,x.status);};x.onerror=function(){fire(null,0);};x.ontimeout=function(){fire(null,0);};x.send(d?JSON.stringify(d):null);}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* Dates: local calendar days only. Never toISOString() — it is UTC, and after
   4–5 PM in San Francisco it is already tomorrow. Step with new Date(y,m,d+n). */
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function sundayOf(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay());}
function weekDates(){var a=[];for(var i=0;i<7;i++)a.push(addDays(weekStart,i));return a;}
function weekLabel(s){
  var e=addDays(s,6);
  if(s.getFullYear()!==e.getFullYear())return MON[s.getMonth()]+' '+s.getDate()+', '+s.getFullYear()+' – '+MON[e.getMonth()]+' '+e.getDate()+', '+e.getFullYear();
  if(s.getMonth()!==e.getMonth())return MON[s.getMonth()]+' '+s.getDate()+' – '+MON[e.getMonth()]+' '+e.getDate()+', '+e.getFullYear();
  return MON[s.getMonth()]+' '+s.getDate()+' – '+e.getDate()+', '+e.getFullYear();
}
function md(d){return (d.getMonth()+1)+'/'+d.getDate();}
function fmtUpdated(iso){
  var d=new Date(iso);if(isNaN(d))return '';
  var h=d.getHours(),ap=h<12?'AM':'PM';h=h%12||12;
  return 'Updated '+DAY_SHORT[d.getDay()]+' '+h+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap;
}

function readView(){try{var v=localStorage.getItem(VIEW_KEY);return v==='week'?'week':'day';}catch(e){return 'day';}}
function saveView(v){try{localStorage.setItem(VIEW_KEY,v);}catch(e){}}

function init(){
  var now=new Date();
  todayKey=keyOf(now);
  weekStart=sundayOf(now);
  dayIdx=now.getDay();
  view=readView();
  paintChrome();
  loadWeek();
}

function paintChrome(){
  document.getElementById('weekLabel').textContent=weekLabel(weekStart);
  document.getElementById('viewDayBtn').className=view==='day'?'active':'';
  document.getElementById('viewWeekBtn').className=view==='week'?'active':'';
  var strip=document.getElementById('dayStrip');
  if(view!=='day'){strip.style.display='none';return;}
  strip.style.display='';
  var ds=weekDates(),h='';
  for(var i=0;i<7;i++){
    var k=keyOf(ds[i]),cls='sched-day'+(i===dayIdx?' active':'')+(k===todayKey?' today':'');
    h+='<button type="button" class="'+cls+'" onclick="pickDay('+i+')" aria-pressed="'+(i===dayIdx)+'" aria-label="'+DAY_EN[i]+' '+md(ds[i])+(k===todayKey?', today':'')+'"><span class="dn">'+DAY_AB[i]+'</span><span class="dd">'+ds[i].getDate()+'</span></button>';
  }
  strip.innerHTML=h;
}

function stepWeek(n){weekStart=addDays(weekStart,7*n);paintChrome();loadWeek();}
function goThisWeek(){var now=new Date();todayKey=keyOf(now);weekStart=sundayOf(now);dayIdx=now.getDay();paintChrome();loadWeek();}
function pickDay(i){dayIdx=i;paintChrome();render();}
function setView(v){if(v===view)return;view=v;saveView(v);paintChrome();render();}

/* Four reads. People first (shifts are asked for by person id, retired people
   included so a past week still shows them), then the rest together. Nothing
   is drawn until every read has landed; one failure shows Try again. A newer
   load supersedes an older one still in flight. */
function loadWeek(opt){
  opt=opt||{};
  var seq=++loadSeq,ds=weekDates(),first=keyOf(ds[0]),last=keyOf(ds[6]);
  if(!opt.quiet){document.getElementById('appBody').innerHTML='<div class="loading"><div class="spinner"></div><p>Loading the schedule…</p></div>';document.getElementById('updatedLine').textContent='';}
  var failed=false;
  function fail(){if(failed||seq!==loadSeq)return;failed=true;
    document.getElementById('appBody').innerHTML='<div class="sched-err">Couldn’t load the schedule. Check the wifi.<br><button type="button" onclick="loadWeek()">Try again</button></div>';
    document.getElementById('updatedLine').textContent='';}
  api('GET','schedule_people','select=id,name,crew,sort_order,active&location=eq.Tempest&order=crew.asc,sort_order.asc,id.asc',null,function(pr,s){
    if(seq!==loadSeq)return;
    if(!Array.isArray(pr)){fail();return;}
    var ids=pr.map(function(p){return p.id;}),got={},need=3;
    function done(){
      if(failed||seq!==loadSeq)return;
      if(--need)return;
      people=pr;shifts={};dayNotes={};updatedMax=null;
      got.shifts.forEach(function(r){shifts[r.person_id+'|'+r.work_date]=r;bump(r.updated_at);});
      got.notes.forEach(function(r){dayNotes[r.note_date]=r.note||'';bump(r.updated_at);});
      standing=got.standing;
      render();
    }
    function take(name){return function(r){if(seq!==loadSeq)return;if(!Array.isArray(r)){fail();return;}got[name]=r;done();};}
    if(ids.length)api('GET','schedule_shifts','select=person_id,work_date,kind,shift_text,training,updated_at&person_id=in.('+ids.join(',')+')&work_date=gte.'+first+'&work_date=lte.'+last,null,take('shifts'));
    else take('shifts')([]);
    api('GET','schedule_day_notes','select=note_date,note,updated_at&location=eq.Tempest&note_date=gte.'+first+'&note_date=lte.'+last,null,take('notes'));
    api('GET','schedule_standing','select=id,label,weekdays,sort_order&location=eq.Tempest&active=eq.true&order=sort_order.asc,id.asc',null,take('standing'));
  });
}
function bump(t){if(t&&(!updatedMax||new Date(t)>new Date(updatedMax)))updatedMax=t;}

function boxOf(p,k){var r=shifts[p.id+'|'+k];return r&&r.kind?r:null;}
/* Active people always show; a retired person only in a week where they have a box. */
function shown(crew){
  var ds=weekDates();
  return people.filter(function(p){
    if(p.crew!==crew)return false;
    if(p.active)return true;
    for(var i=0;i<7;i++)if(boxOf(p,keyOf(ds[i])))return true;
    return false;
  });
}
function standingOn(i){return standing.filter(function(s){return (s.weekdays||[]).indexOf(i)>=0;});}

/* How a box reads. Every state is also a word; empty is never OFF. */
function boxHtml(b,inWeek){
  if(!b)return inWeek?'<span class="sched-empty" aria-label="not scheduled yet"></span>':'<span class="sched-empty" aria-label="not scheduled yet">—</span>';
  if(b.kind==='off')return '<span class="sched-off">OFF</span>';
  if(b.kind==='request')return '<span class="sched-req">REQUEST</span>';
  return '<span class="sched-shift">'+esc(b.shift_text)+'</span>'+(b.training?'<span class="sched-train">TRAINING</span>':'');
}

function render(){
  var body=document.getElementById('appBody');
  var day=shown('day'),night=shown('night');
  if(!day.length&&!night.length){body.innerHTML='<div class="empty">No one on the schedule yet.</div>';}
  else body.innerHTML=view==='week'?renderWeek(day,night):renderDay(day,night);
  document.getElementById('updatedLine').textContent=updatedMax?fmtUpdated(updatedMax):'';
  paintCount();
  if(mgr)ensureQuick();
}

/* Manager mode only: how many of this week's boxes (active people × 7 days) are still empty. */
function paintCount(){
  var el=document.getElementById('mgrCount');
  if(!mgr||!people.length){el.style.display='none';el.textContent='';return;}
  var ds=weekDates(),n=0;
  people.forEach(function(p){if(!p.active)return;for(var i=0;i<7;i++)if(!boxOf(p,keyOf(ds[i])))n++;});
  el.textContent=n?n+' box'+(n===1?'':'es')+' not filled yet':'Every box filled';
  el.style.display='';
}
function personById(id){for(var i=0;i<people.length;i++)if(people[i].id===id)return people[i];return null;}
function boxBtnLabel(p,i){return 'Change '+p.name+', '+DAY_EN[i].charAt(0)+DAY_EN[i].slice(1).toLowerCase()+' '+md(weekDates()[i]);}

function renderDay(day,night){
  var d=weekDates()[dayIdx],k=keyOf(d);
  var h='<div class="sched-dayhead">'+DAY_EN[dayIdx]+' · '+DAY_ES[dayIdx]+' · '+md(d)+'</div>';
  var notes=standingOn(dayIdx).map(function(s){return '<div class="sched-note">'+esc(s.label)+'</div>';}).join('');
  var dn=(dayNotes[k]||'').trim();
  if(mgr)notes+='<button type="button" class="sched-notebtn" onclick="openNote('+dayIdx+')" aria-label="Change games and events, '+md(d)+'">'+(dn?'Games &amp; events: '+esc(dn):'<span class="add">+ Add game or event</span>')+'</button>';
  else if(dn)notes+='<div class="sched-note">'+esc(dn)+'</div>';
  if(notes)h+='<div class="sched-notes">'+notes+'</div>';
  function crew(label,list){
    if(!list.length)return '';
    var s='<div class="cat-header"><div class="cat-label">'+label+'</div></div>';
    list.forEach(function(p){
      var box=mgr?'<button type="button" class="sched-box sched-boxbtn" onclick="openBox('+p.id+','+dayIdx+')" aria-label="'+esc(boxBtnLabel(p,dayIdx))+'">'+boxHtml(boxOf(p,k),false)+'</button>'
                 :'<div class="sched-box">'+boxHtml(boxOf(p,k),false)+'</div>';
      s+='<div class="sched-row"><div class="sched-name">'+esc(p.name)+'</div>'+box+'</div>';
    });
    return s;
  }
  return h+crew('DAY CREW',day)+crew('NIGHT CREW',night);
}

function renderWeek(day,night){
  var ds=weekDates(),keys=ds.map(keyOf);
  var h='<div class="sched-gridwrap"><table class="sched-grid"><thead><tr><th class="sticky" scope="col">Name</th>';
  for(var i=0;i<7;i++)h+='<th scope="col"'+(keys[i]===todayKey?' class="today"':'')+'>'+DAY_EN[i]+'<span class="es">'+DAY_ES[i]+'</span>'+md(ds[i])+'</th>';
  h+='</tr></thead><tbody>';
  function crew(label,list){
    if(!list.length)return '';
    var s='<tr class="crew"><th class="sticky" scope="rowgroup">'+label+'</th><th colspan="7"></th></tr>';
    list.forEach(function(p){
      s+='<tr><th class="sticky" scope="row">'+esc(p.name)+'</th>';
      for(var i=0;i<7;i++){
        if(mgr)s+='<td class="sched-celltd"><button type="button" class="sched-cellbtn" onclick="openBox('+p.id+','+i+')" aria-label="'+esc(boxBtnLabel(p,i))+'">'+boxHtml(boxOf(p,keys[i]),true)+'</button></td>';
        else s+='<td>'+boxHtml(boxOf(p,keys[i]),true)+'</td>';
      }
      s+='</tr>';
    });
    return s;
  }
  h+=crew('DAY CREW',day)+crew('NIGHT CREW',night);
  h+='<tr class="crew"><th class="sticky" scope="rowgroup">NOTES</th><th colspan="7"></th></tr>';
  standing.forEach(function(s){
    h+='<tr><th class="sticky" scope="row">'+esc(s.label)+'</th>';
    for(var i=0;i<7;i++)h+='<td class="note">'+((s.weekdays||[]).indexOf(i)>=0?esc(s.label):'')+'</td>';
    h+='</tr>';
  });
  h+='<tr><th class="sticky" scope="row">Games &amp; events</th>';
  for(var i=0;i<7;i++){
    var nt=esc((dayNotes[keys[i]]||'').trim());
    if(mgr)h+='<td class="note sched-celltd"><button type="button" class="sched-cellbtn" onclick="openNote('+i+')" aria-label="Change games and events, '+md(ds[i])+'">'+(nt||'+')+'</button></td>';
    else h+='<td class="note">'+nt+'</td>';
  }
  h+='</tr></tbody></table></div>';
  return h;
}

/* ── MANAGER: CHANGING A BOX (Slice 2) ──────────────────────────────────
   Pick, then Save. The box on the page changes only when the database
   answers with the row. One save at a time. */

/* Quick buttons: the crew's most-used shifts over this week and the three
   before, topped up from the 11/8 tab. One GET, manager mode only, cached per week. */
function ensureQuick(){
  var wk=keyOf(weekStart);
  if(quick[wk]||!people.length)return;
  quick[wk]={loading:true,day:[],night:[]};
  var seq=++quickSeq,ids=people.map(function(p){return p.id;});
  api('GET','schedule_shifts','select=person_id,shift_text&kind=eq.shift&person_id=in.('+ids.join(',')+')&work_date=gte.'+keyOf(addDays(weekStart,-21))+'&work_date=lte.'+keyOf(addDays(weekStart,6)),null,function(r){
    if(seq!==quickSeq||!quick[wk])return;
    if(!Array.isArray(r)){delete quick[wk];return;}   // the defaults stand; asked again next time
    var cnt={day:{},night:{}},order={day:[],night:[]};
    r.forEach(function(x){var p=personById(x.person_id),t=(x.shift_text||'').trim();if(!p||!t||!cnt[p.crew])return;
      if(!cnt[p.crew][t]){cnt[p.crew][t]=0;order[p.crew].push(t);}cnt[p.crew][t]++;});
    ['day','night'].forEach(function(c){
      order[c].sort(function(a,b){return cnt[c][b]-cnt[c][a];});   // stable: ties keep first-seen order
      quick[wk][c]=order[c];
    });
    quick[wk].loading=false;
    if(pick)paintPick();
  });
}
function quickFor(crew){
  var q=(quick[keyOf(weekStart)]||{})[crew]||[],out=[];
  q.concat(QUICK_DEFAULT[crew]||[]).forEach(function(t){if(out.length<QUICK_MAX&&out.indexOf(t)<0)out.push(t);});
  return out;
}

/* Tidy typed shift text: 4 pm-cl -> 4pm-CL, 10 AM - 4 PM -> 10am-4pm. Text, never clock times. */
function tidyShift(s){
  s=String(s||'').replace(/[–—]/g,'-').replace(/\s+/g,' ').trim();
  s=s.replace(/\s*-\s*/g,'-');
  s=s.replace(/(\d)\s*(am|pm)\b/gi,function(m,d,ap){return d+ap.toLowerCase();});
  s=s.replace(/\b(am|pm)\b/gi,function(m){return m.toLowerCase();});
  s=s.replace(/\bcl\b/gi,'CL');
  return s;
}
function tidyNote(s){return String(s||'').replace(/\s+/g,' ').trim();}
function nowText(b){if(!b)return 'empty';if(b.kind==='off')return 'OFF';if(b.kind==='request')return 'REQUEST';return b.shift_text+(b.training?' · Training':'');}

function openBox(pid,i){
  var p=personById(pid);if(!mgr||!p)return;
  var k=keyOf(weekDates()[i]),b=boxOf(p,k);
  pick={pid:pid,crew:p.crew,day:i,key:k,cur:b,sel:null,training:!!(b&&b.training),saving:false};
  var other=document.getElementById('boxOther');other.value='';
  if(b&&b.kind==='off')pick.sel={kind:'off'};
  else if(b&&b.kind==='request')pick.sel={kind:'request'};
  else if(b&&b.kind==='shift'){
    if(quickFor(p.crew).indexOf(b.shift_text)>=0)pick.sel={kind:'shift',text:b.shift_text};
    else{pick.sel={kind:'other'};other.value=b.shift_text;}
  }
  document.getElementById('boxTitle').textContent=p.name+' · '+DAY_EN[i].charAt(0)+DAY_EN[i].slice(1).toLowerCase()+' · '+DAY_ES[i].charAt(0)+DAY_ES[i].slice(1).toLowerCase()+' '+md(weekDates()[i]);
  document.getElementById('boxNow').textContent='Now: '+nowText(b);
  showErr('boxErr','');
  paintPick();
  document.getElementById('boxModal').classList.add('show');
}
function paintPick(){
  if(!pick)return;
  var s=pick.sel,h='';
  function btn(label,kind,text){
    var on=!!s&&s.kind===kind&&(kind!=='shift'||s.text===text);
    return '<button type="button" class="sched-pick" aria-pressed="'+on+'" data-kind="'+kind+'" data-text="'+esc(text||'')+'" onclick="pickChoice(this)">'+esc(label)+'</button>';
  }
  h+=btn('OFF','off')+btn('REQUEST','request');
  quickFor(pick.crew).forEach(function(t){h+=btn(t,'shift',t);});
  document.getElementById('boxPicks').innerHTML=h;
  var isShift=!!s&&(s.kind==='shift'||s.kind==='other');
  if(!isShift)pick.training=false;
  var tb=document.getElementById('boxTrain');
  tb.disabled=!isShift||pick.saving;tb.setAttribute('aria-pressed',String(isShift&&pick.training));
  document.getElementById('boxSave').disabled=pick.saving;
  document.getElementById('boxClear').disabled=pick.saving||!pick.cur;
  all('#boxPicks button').forEach(function(b){b.disabled=pick.saving;});
  document.getElementById('boxOther').disabled=pick.saving;
}
function all(sel){return Array.prototype.slice.call(document.querySelectorAll(sel));}
function pickChoice(el){
  if(!pick||pick.saving)return;
  var kind=el.getAttribute('data-kind');
  pick.sel=kind==='shift'?{kind:'shift',text:el.getAttribute('data-text')}:{kind:kind};
  document.getElementById('boxOther').value='';
  showErr('boxErr','');paintPick();
}
function onOther(){
  if(!pick||pick.saving)return;
  pick.sel=document.getElementById('boxOther').value.trim()?{kind:'other'}:null;
  paintPick();
}
function toggleTrain(){if(!pick||pick.saving)return;pick.training=!pick.training;paintPick();}
function showErr(id,msg){var e=document.getElementById(id);e.textContent=msg;e.classList.toggle('show',!!msg);}
function closeBox(){if(pick&&pick.saving)return;pick=null;document.getElementById('boxModal').classList.remove('show');}

/* What Save would write, or null when nothing is picked. */
function boxTarget(){
  var s=pick.sel;if(!s)return null;
  if(s.kind==='off'||s.kind==='request')return {kind:s.kind,shift_text:null,training:false};
  var t=s.kind==='shift'?s.text:tidyShift(document.getElementById('boxOther').value);
  if(!t)return null;
  if(/^off$/i.test(t))return {kind:'off',shift_text:null,training:false};
  if(/^request$/i.test(t))return {kind:'request',shift_text:null,training:false};
  return {kind:'shift',shift_text:t,training:!!pick.training};
}
function saveBox(){
  if(!pick||pick.saving)return;
  var t=boxTarget(),c=pick.cur;
  if(!t){if(!c){closeBox();return;}showErr('boxErr','Pick a shift, OFF or REQUEST, or press Clear.');return;}
  if(c&&c.kind===t.kind&&(c.shift_text||null)===t.shift_text&&!!c.training===t.training){closeBox();return;}
  writeBox(t);
}
function clearBox(){
  if(!pick||pick.saving||!pick.cur)return;
  writeBox({kind:null,shift_text:null,training:false});
}
function writeBox(t){
  var P=pick;P.saving=true;showErr('boxErr','');paintPick();
  var body={person_id:P.pid,work_date:P.key,kind:t.kind,shift_text:t.shift_text,training:t.training};
  api('POST','schedule_shifts','on_conflict=person_id,work_date',body,function(r,s){
    P.saving=false;
    var row=Array.isArray(r)&&r.length===1?r[0]:null;
    if(s>=200&&s<300&&row&&row.person_id===P.pid&&row.work_date===P.key){
      loadSeq++;   // a quiet reload already in flight holds the old box: drop it
      shifts[P.pid+'|'+P.key]=row;bump(row.updated_at);
      delete quick[keyOf(weekStart)];
      if(pick===P){pick=null;document.getElementById('boxModal').classList.remove('show');}
      render();showToast('Saved','success');
      return;
    }
    if(pick!==P)return;
    showErr('boxErr',s===0?'No answer. Check the wifi and try again.':'Not saved (error '+s+'). Try again.');
    paintPick();
  },null,'resolution=merge-duplicates,return=representation');
}

/* ── MANAGER: GAMES & EVENTS (day notes) ── */
function openNote(i){
  if(!mgr)return;
  var d=weekDates()[i],k=keyOf(d),cur=(dayNotes[k]||'').trim();
  notePick={day:i,key:k,cur:cur,saving:false};
  document.getElementById('noteTitle').textContent='Games & events · '+DAY_EN[i].charAt(0)+DAY_EN[i].slice(1).toLowerCase()+' '+md(d);
  document.getElementById('noteInput').value=cur;
  document.getElementById('notePicks').innerHTML=NOTE_WORDS.map(function(w){return '<button type="button" class="sched-pick" onclick="addWord(this)">'+esc(w)+'</button>';}).join('');
  showErr('noteErr','');paintNote();
  document.getElementById('noteModal').classList.add('show');
}
function paintNote(){
  if(!notePick)return;
  var b=notePick.saving;
  document.getElementById('noteSave').disabled=b;
  document.getElementById('noteClear').disabled=b||!notePick.cur;
  document.getElementById('noteInput').disabled=b;
  all('#notePicks button').forEach(function(x){x.disabled=b;});
}
function addWord(el){
  if(!notePick||notePick.saving)return;
  var inp=document.getElementById('noteInput'),v=inp.value.trim();
  inp.value=(v?v+' ':'')+el.textContent+' ';inp.focus();
  var len=inp.value.length;inp.setSelectionRange(len,len);
}
function closeNote(){if(notePick&&notePick.saving)return;notePick=null;document.getElementById('noteModal').classList.remove('show');}
function saveNote(){
  if(!notePick||notePick.saving)return;
  var t=tidyNote(document.getElementById('noteInput').value);
  if(t===notePick.cur){closeNote();return;}
  writeNote(t);
}
function clearNote(){if(!notePick||notePick.saving||!notePick.cur)return;writeNote('');}
function writeNote(t){
  var P=notePick;P.saving=true;showErr('noteErr','');paintNote();
  api('POST','schedule_day_notes','on_conflict=location,note_date',{location:'Tempest',note_date:P.key,note:t},function(r,s){
    P.saving=false;
    var row=Array.isArray(r)&&r.length===1?r[0]:null;
    if(s>=200&&s<300&&row&&row.note_date===P.key){
      loadSeq++;
      dayNotes[P.key]=row.note||'';bump(row.updated_at);
      if(notePick===P){notePick=null;document.getElementById('noteModal').classList.remove('show');}
      render();showToast('Saved','success');
      return;
    }
    if(notePick!==P)return;
    showErr('noteErr',s===0?'No answer. Check the wifi and try again.':'Not saved (error '+s+'). Try again.');
    paintNote();
  },null,'resolution=merge-duplicates,return=representation');
}

function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=(type==='success'?'✓ ':'⚠ ')+msg;
  t.className='toast show '+(type||'success');
  clearTimeout(st);st=setTimeout(function(){t.className='toast';},1800);
}

/* Coming back to the page: today may have moved, and a manager may have
   saved. Reload this week; keep the view and the chosen day. */
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  todayKey=keyOf(new Date());
  paintChrome();
  loadWeek({quiet:true});
});

// ── MANAGER MODE ── (changes nothing visible in this slice)
function toggleMgr(){
  if(mgr){mgr=false;document.getElementById('mgrSwitch').classList.remove('on');render();return;}
  if(sessionStorage.getItem('boxkitchen_mgr')==='1'){mgr=true;document.getElementById('mgrSwitch').classList.add('on');render();return;}
  openPin();
}
function openPin(){
  var inp=document.getElementById('pinInput');inp.value='';
  document.getElementById('pinErr').classList.remove('show');
  document.getElementById('pinModal').classList.add('show');
  setTimeout(function(){inp.focus();},100);
}
function closePin(){document.getElementById('pinModal').classList.remove('show');}
function submitPin(){
  var v=(document.getElementById('pinInput').value||'').trim();
  if(v===MANAGER_PIN){
    sessionStorage.setItem('boxkitchen_mgr','1');
    closePin();
    mgr=true;document.getElementById('mgrSwitch').classList.add('on');render();
    showToast('Manager mode unlocked','success');
  }else{
    var e=document.getElementById('pinErr');e.classList.add('show');
    var inp=document.getElementById('pinInput');inp.value='';inp.focus();
  }
}
document.getElementById('pinModal').addEventListener('click',function(e){if(e.target===this)closePin();});
document.getElementById('boxModal').addEventListener('click',function(e){if(e.target===this)closeBox();});
document.getElementById('noteModal').addEventListener('click',function(e){if(e.target===this)closeNote();});
document.getElementById('boxOther').addEventListener('input',onOther);
document.getElementById('boxOther').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveBox();}});
document.getElementById('noteInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveNote();}});
document.getElementById('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitPin();}});

init();
</script>

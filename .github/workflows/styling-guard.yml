# The Expo Board look lives in one file now (assets/kitchen.css). Before this
# workflow, nothing stopped a new page - or a new feature on an old one - from
# quietly reintroducing a second palette. The #114 consistency sweep was one
# manual pass, typed into a terminal and saved nowhere. This is that pass,
# saved and runnable.
name: styling guard

on:
  pull_request:
    paths: ['**.html', 'assets/**', 'scripts/check_styling.py']
  push:
    branches: [main]
    paths: ['**.html', 'assets/**', 'scripts/check_styling.py']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_styling.py

<script>
  (function(){
    var raw = localStorage.getItem('boxkitchen_auth');
    var ts = raw ? parseInt(raw, 10) : 0;
    var TTL = 30 * 24 * 60 * 60 * 1000; // 30 days
    if (!ts || isNaN(ts) || (Date.now() - ts) > TTL) {
      window.location.replace('index.html');
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Tempest Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="assets/kitchen.css?v=2026-09-19">
<style>
  /* Inventory Guide — page-level rules only (docs/inventory-guide.md).
     Rows, headers, bars, modals and manager controls are the shared
     components in assets/kitchen.css; only the two-box layout, the
     place picker and the drag states of a .stock-row are new. */

  /* a place heading carries its item count on the right */
  .stock-place-hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .stock-place-n{font-family:var(--font-cond);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);white-space:nowrap}
  .stock-none{padding:12px 18px;font-size:0.85rem;color:var(--grey);font-style:italic;border-bottom:1px solid var(--hair)}

  /* The boxes sit beside the name when they fit, and wrap under it, still
     right-aligned, when they don't — a two-box row on a phone. */
  .count-row.stock-row{flex-wrap:wrap;row-gap:8px}
  .stock-row .count-info{min-width:140px}
  .stock-boxes{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 12px;margin-left:auto}
  .stock-box{display:flex;align-items:center;gap:6px}
  .stock-lbl{font-family:var(--font-cond);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
  /* a floor under the unit keeps the boxes in one column down the page —
     EA, BU, DOZ and BSKT would otherwise each push the box a different
     distance — so an empty box is found by looking down one line */
  .stock-unit{min-width:2.8em;font-size:0.85rem;color:var(--grey);white-space:nowrap}

  /* 16px, and written qualified so it can never lose the cascade to
     kitchen.css's `.modal input[type="text"]` (0.95rem): #135. Not
     .count-input, which is 15.2px and zooms iPhones on Meat and Portion. */
  .modal input[type="text"].stock-input,.stock-input{width:64px;min-height:44px;padding:8px 6px;background:var(--paper);border:1px solid var(--edge);border-radius:6px;color:var(--ink);font-family:var(--font);font-size:16px;font-variant-numeric:tabular-nums;text-align:center;outline:none;-webkit-appearance:none;appearance:none}
  /* No count is open, so a box is locked: dashed edge on the press fill.
     The edge stays --edge (3:1), so the box is still plainly a box. */
  .stock-input:disabled{background:var(--press);border-style:dashed;opacity:1}
  /* The most-scanned state during a count: which boxes are still EMPTY.
     Filled reads by weight and fill, as .count-input.filled does. */
  .stock-input.filled{border:1.5px solid var(--ink);background:var(--press);font-weight:600}
  .stock-input:focus{border-color:var(--tomato);box-shadow:0 0 0 2px rgba(232,93,58,.2)}

  /* A row's save state sits under its name, so the column of boxes never
     shifts. Saved is ink and weight; an error is the danger red and says
     what to do — never a hue standing in for words. */
  .stock-state{font-size:0.78rem;margin-top:3px;color:var(--grey)}
  .stock-state.saved{color:var(--ink);font-weight:600}
  .stock-state.invalid{color:var(--danger);font-weight:600}
  button.stock-state.failed{display:block;width:100%;min-height:44px;margin-top:6px;padding:8px 10px;text-align:left;background:transparent;border:1px solid var(--danger);border-radius:6px;color:var(--danger);font-family:var(--font);font-size:0.85rem;font-weight:600;cursor:pointer}

  /* Who is counting: picked once, shown always, changed in one tap. The
     select is restated at 16px — .name-bar select is 0.95rem (#135). */
  .name-bar select.stock-name{font-size:16px}
  .stock-who{flex:1;font-weight:600}
  .name-bar .mgr-edit-btn{flex-shrink:0}

  /* manager mode: the month's count, at the top of set-up */
  .stock-countbar{padding:12px 18px;border-bottom:1px solid var(--hair);font-size:0.9rem;line-height:1.4}
  .stock-countbar-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

  /* Manager mode is set-up, not counting: the boxes give way to the
     row's controls, and the grip leads the row. */
  .manager-mode .stock-boxes{display:none}
  .manager-mode .stock-row{flex-wrap:nowrap}
  .manager-mode .stock-row .count-info{min-width:0}
  .stock-row .drag-handle{flex-shrink:0;margin-left:-6px}
  /* the gap the row will land in / the row you grabbed / the floating copy —
     outline and inset shadow, so grabbing a row never shifts the layout */
  .stock-row.sortable-ghost{background:var(--press);outline:1px dashed var(--dash);outline-offset:-1px}
  .stock-row.sortable-chosen{background:var(--press);box-shadow:inset 0 0 0 1px var(--ink)}
  .stock-row.sortable-drag{background:var(--paper);box-shadow:0 6px 20px rgba(0,0,0,0.18)}

  /* The PIN box: kitchen.css's .pin-input asks for 1.4rem but loses to
     `.modal input[type="tel"]` (0.95rem). Restated qualified, it wins. */
  .modal input[type="tel"].pin-input{font-size:1.4rem}
  .modal input[type="text"].stock-field,.stock-field{font-size:16px}

  /* the place picker: one full-width button per place */
  .stock-picks{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
  .stock-pick{min-height:48px;padding:10px 14px;background:var(--paper);border:1px solid var(--edge);border-radius:6px;color:var(--ink);font-family:var(--font);font-size:1rem;font-weight:500;text-align:left;cursor:pointer}
  .stock-pick:active{background:var(--press)}
  .stock-pick:disabled{background:var(--press);border-style:dashed;color:var(--grey);cursor:default}
  .stock-sub{font-size:0.85rem;color:var(--grey);margin:-8px 0 14px}
  .stock-modal-toggle{margin-bottom:14px}

  /* the Places list: the name on its own line, its controls under it */
  .stock-plist{margin-bottom:14px}
  .stock-prow{padding:10px 0;border-bottom:1px solid var(--hair)}
  .stock-prow-name{font-weight:600}
  .stock-prow-n{font-size:0.8rem;color:var(--grey);margin-left:6px;font-weight:400}
  .stock-prow-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .stock-prow-note{font-size:0.78rem;color:var(--grey);margin-top:6px}
  /* A control that cannot be used must look it, not merely do nothing:
     kitchen.css gives .mgr-edit-btn / .mgr-retire-btn no disabled state. */
  .stock-prow-btns button:disabled{border-style:dashed;border-color:var(--edge);color:var(--faint);background:transparent;cursor:default}
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <a class="home-link" href="index.html">← Home</a>
    <h1>Tempest <span>Inventory</span></h1>
    <div class="mgr-toggle"><span>Manager</span><div class="mgr-switch" id="mgrSwitch" role="switch" aria-checked="false" aria-label="Manager mode" tabindex="0" onclick="toggleMgr()"><div class="knob"></div></div></div>
  </div>
</div>
<div class="date-bar">
  <div class="date-display" id="sheetTitle">Count sheet</div>
  <div class="date-sub" id="sheetSummary"></div>
</div>
<div class="name-bar" id="nameBar" style="display:none">
  <label for="countedBy" id="whoLabel">Counted by</label>
  <select class="stock-name" id="countedBy" onchange="pickWho(this.value)"><option value="">Pick your name…</option></select>
  <span class="stock-who" id="whoName" style="display:none"></span>
  <button type="button" class="mgr-edit-btn" id="whoChange" style="display:none" onclick="changeWho()">Change</button>
</div>
<div class="intro" id="introBar">Loading…</div>
<div id="appBody"><div class="loading"><div class="spinner"></div><p>Loading the count sheet…</p></div></div>

<!-- Manager PIN modal -->
<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>Enter Manager PIN</h3>
    <label for="pinInput">4-digit PIN</label>
    <input class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" autocomplete="off">
    <div class="modal-err" id="pinErr">Incorrect PIN</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePin()">Cancel</button>
      <button class="modal-btn save" onclick="submitPin()">Unlock</button>
    </div>
  </div>
</div>

<!-- Pick a place: Move, count in a second place, or count a new / left-off item -->
<div class="modal-bg" id="pickModal">
  <div class="modal">
    <h3 id="pickTitle">Move</h3>
    <div class="stock-sub" id="pickSub"></div>
    <div class="mode-toggle stock-modal-toggle" id="pickToggle">
      <button type="button" class="mode-btn" id="pickMoveBtn" onclick="setPickMode('move')">Move it</button>
      <button type="button" class="mode-btn" id="pickAlsoBtn" onclick="setPickMode('also')">Also count it</button>
    </div>
    <div class="stock-picks" id="pickList"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePick()">Cancel</button>
    </div>
  </div>
</div>

<!-- Places: reorder, rename, retire, add -->
<div class="modal-bg" id="placesModal">
  <div class="modal">
    <h3>Places</h3>
    <div class="stock-sub">In walking order. A place can be retired once nothing is counted there.</div>
    <div class="stock-plist" id="placesList"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePlaces()">Done</button>
      <button class="modal-btn save" onclick="openName('add')">+ New place</button>
    </div>
  </div>
</div>

<!-- Name a place (new, or rename) -->
<div class="modal-bg" id="nameModal">
  <div class="modal">
    <h3 id="nameTitle">New place</h3>
    <label for="nameInput">Name</label>
    <input class="stock-field" type="text" id="nameInput" maxlength="40" autocomplete="off" placeholder="e.g. Walk-in freezer">
    <div class="modal-err" id="nameErr"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeName()">Cancel</button>
      <button class="modal-btn save" id="nameSaveBtn" onclick="saveName()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="vendor/sortablejs-1.15.7.min.js"></script>
<script>
var SB='https://sxppuyarecqkgkrsrefc.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cHB1eWFyZWNxa2drcnNyZWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTA4MzAsImV4cCI6MjA5Mjk2NjgzMH0.GM8OfcR68_JjdPeQ3k7j6L3ulJFaeS1xnSLBcdtYXtU';
var LOCATION='Tempest';
var places=[],items=[],packs={},guide=null,leftOff=null,st=null;
var loading=false,loadSeq=0;
/* the month's count: the open one, its saved lines by inventory_item_id, the
   staff list, who is counting on this device, and what has been typed here
   and not yet confirmed (local[id] = {full, loose, state, msg, timer, inflight}) */
var count=null,lines={},staff=[],local={};
var WHO_KEY='boxkitchen_inv_who',SAVE_DELAY=1200;
var who='';try{who=sessionStorage.getItem(WHO_KEY)||'';}catch(e){}
var MANAGER_PIN='4316',mgr=false,busy=false,showLeftOff=false,sortables=[],pick=null,nameCtx=null;
var GRIP='<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/><circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="2" cy="14" r="1.4"/><circle cx="8" cy="14" r="1.4"/></svg>';

/* Ported from tempest_costing.html (its slice 4): a write that has had no
   answer in 15s is given up on — which says nothing about the table, so every
   write here is followed by a fresh read rather than a guess. */
var API_TIMEOUT=15000;
/* A load of the whole sheet gets 60s, so slow-but-working wifi still opens it. */
var LOAD_TIMEOUT=60000;
/* status 0 = no answer at all (network error or timeout). One callback per
   request, whichever of load/error/timeout comes first. `ms` overrides the
   timeout; `pf` the Prefer header (a count line is saved as an upsert). */
function api(m,t,q,d,cb,ms,pf){var x=new XMLHttpRequest(),fired=false;function fire(r,s){if(fired)return;fired=true;if(cb)cb(r,s);}
  x.open(m,SB+'/rest/v1/'+t+(q?'?'+q:''));x.timeout=ms||(m==='GET'?LOAD_TIMEOUT:API_TIMEOUT);x.setRequestHeader('apikey',SK);x.setRequestHeader('Authorization','Bearer '+SK);if(d){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Prefer',pf||'return=representation');}
  x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}fire(r,x.status);};x.onerror=function(){fire(null,0);};x.ontimeout=function(){fire(null,0);};x.send(d?JSON.stringify(d):null);}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function num(v){var n=parseFloat(v);return isFinite(n)?n:null;}

function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=(type==='success'?'✓ ':'⚠ ')+msg;
  t.className='toast show '+(type||'success');
  clearTimeout(st);st=setTimeout(function(){t.className='toast';},1800);
}

/* The sheet is drawn only when every read has landed. The boxes an item gets
   depend on its pack size, so drawing without the price list would give a
   40 lb case one box in order units: a different count, not a smaller one.
   One failure fails the whole sheet. Manager mode adds two reads — the order
   guide and the left-off list — which staff never ask for.
   opt.quiet keeps the sheet on screen while it reloads (after a manager
   write); opt.force supersedes a load already in flight.
   The open count is read with everything else; its lines need its id, so
   they are read once it lands. Nothing is drawn until they have too. */
function loadAll(opt){
  opt=opt||{};
  if(loading&&!opt.force)return;
  var seq=++loadSeq,withSetup=mgr;
  loading=true;
  if(!opt.quiet)document.getElementById('appBody').innerHTML='<div class="loading"><div class="spinner"></div><p>Loading the count sheet…</p></div>';
  var got={},need=withSetup?7:5,failed=false;
  function fail(){failed=true;loading=false;loadFailed();}
  function done(){
    loading=false;
    places=got.places;items=got.items;packs=packMap(got.packs);staff=got.staff;
    if(withSetup){guide=got.guide;leftOff=got.leftOff;}
    var c=got.counts[0]||null;
    if(!count||!c||count.id!==c.id)local={};   // typed values belong to one count
    count=c;lines={};
    var ls=got.lines||[];for(var i=0;i<ls.length;i++)lines[ls[i].inventory_item_id]=ls[i];
    render();
  }
  function land(key){return function(r,s){
    if(seq!==loadSeq||failed)return;
    if(!(s>=200&&s<300)||!Array.isArray(r))return fail();
    got[key]=r;
    if(--need)return;
    if(!got.counts.length)return done();
    api('GET','inventory_count_lines','location=eq.'+LOCATION+'&count_id=eq.'+got.counts[0].id+'&select=id,inventory_item_id,full_qty,loose_qty,pack_qty_snap,pack_unit_snap,counted_by,updated_at',null,function(r2,s2){
      if(seq!==loadSeq||failed)return;
      if(!(s2>=200&&s2<300)||!Array.isArray(r2))return fail();
      got.lines=r2;done();
    });
  };}
  api('GET','inventory_counts','location=eq.'+LOCATION+'&status=eq.open&select=id,period,status',null,land('counts'));
  api('GET','staff','location=eq.'+LOCATION+'&active=eq.true&select=name&order=shift.asc,sort_order.asc.nullslast,name.asc',null,land('staff'));
  api('GET','inventory_places','location=eq.'+LOCATION+'&active=eq.true&select=id,label,sort_order&order=sort_order.asc,id.asc',null,land('places'));
  api('GET','inventory_items','location=eq.'+LOCATION+'&active=eq.true&select=id,order_item_id,place_id,sort_order,order_items(name,vendor,unit,active)&order=sort_order.asc,id.asc',null,land('items'));
  /* Pack sizes only. This page never asks for a price, so no dollar figure
     can reach a staff screen by accident. */
  api('GET','ingredient_costs','location=eq.'+LOCATION+'&active=eq.true&order_item_id=not.is.null&select=order_item_id,pack_qty,pack_unit',null,land('packs'));
  if(withSetup){
    api('GET','order_items','location=eq.'+LOCATION+'&active=eq.true&select=id,name,vendor,category,unit&order=vendor.asc,sort_order.asc,id.asc',null,land('guide'));
    api('GET','inventory_left_off','location=eq.'+LOCATION+'&active=eq.true&select=id,order_item_id',null,land('leftOff'));
  }
}

function loadFailed(){
  destroySortables();
  document.getElementById('sheetSummary').textContent='';
  document.getElementById('appBody').innerHTML='<div class="empty">Could not load the count sheet. Check the signal, then try again.<br><br>'
    +'<button class="link-btn" onclick="loadAll()">Try again</button></div>';
  showToast('Could not load the count sheet','error');
}

/* order_item_id -> {qty, unit}, only for a usable pack: a quantity above
   zero AND a unit. Anything less is "no pack yet", never a guess. */
function packMap(rows){
  var m={};
  for(var i=0;i<rows.length;i++){
    var q=num(rows[i].pack_qty),u=String(rows[i].pack_unit||'').trim();
    if(q>0&&u)m[rows[i].order_item_id]={qty:q,unit:u};
  }
  return m;
}

function placeById(id){for(var i=0;i<places.length;i++)if(places[i].id===id)return places[i];return null;}
function itemById(id){for(var i=0;i<items.length;i++)if(items[i].id===id)return items[i];return null;}
function guideById(id){if(!guide)return null;for(var i=0;i<guide.length;i++)if(guide[i].id===id)return guide[i];return null;}
function itemName(it){return (it.order_items&&it.order_items.name)||'(unknown item)';}

function render(){
  destroySortables();
  var body=document.getElementById('appBody');
  renderWho();
  document.getElementById('sheetTitle').textContent=count?monthLabel(count.period)+' count':'Count sheet';
  if(!mgr&&(!places.length||!items.length)){
    document.getElementById('sheetSummary').textContent='';
    document.getElementById('introBar').textContent='Nothing to count yet.';
    body.innerHTML='<div class="empty">No places or items are set up for the count yet.</div>';
    return;
  }
  var labelOf={},byPlace={},placesOf={},distinct={},nItems=0,nPacked=0,orphans=[];
  for(var i=0;i<places.length;i++){labelOf[places[i].id]=places[i].label;byPlace[places[i].id]=[];}
  for(var i=0;i<items.length;i++){
    var it=items[i],oid=it.order_item_id;
    // an item whose place is retired must still show up, not silently drop off the count
    if(!byPlace[it.place_id]){orphans.push(it);continue;}
    byPlace[it.place_id].push(it);
    (placesOf[oid]=placesOf[oid]||[]).push(labelOf[it.place_id]);
    if(!distinct[oid]){distinct[oid]=1;nItems++;if(packs[oid])nPacked++;}
  }
  var h='';
  if(mgr){
    h+=countBarHtml();
    h+='<div class="mgr-add-bar"><button class="mgr-add-btn" onclick="openPlaces()">Places — reorder, rename, add</button></div>';
    h+=newItemsHtml();
  }
  for(var i=0;i<places.length;i++){
    var p=places[i],rows=byPlace[p.id];
    h+=placeHead(p.label,rows,p.id);
    if(!rows.length)h+='<div class="stock-none">Nothing is stored here yet.</div>';
    h+='<div class="stock-place-body" data-place-id="'+p.id+'">';
    for(var j=0;j<rows.length;j++)h+=rowHtml(rows[j],p.label,placesOf);
    h+='</div>';
  }
  if(orphans.length){
    h+=placeHead('Not in an active place',orphans,'');
    for(var j=0;j<orphans.length;j++)h+=rowHtml(orphans[j],'',placesOf);
  }
  if(mgr)h+=leftOffHtml();
  body.innerHTML=mgr?'<div class="manager-mode">'+h+'</div>':h;
  var packs_=nPacked+' of '+nItems+' items have a pack size in Recipe Costing, so they get Full and Loose boxes; the rest are counted in order-guide units until they have one.';
  document.getElementById('introBar').textContent=mgr
    ?'Manager set-up. Drag the grip to put a place’s items in shelf order. Move sends an item to another place, or counts it in a second one. Remove stops counting it there. Nothing here changes the order guide.'
    :!count?'No count is open yet — a manager starts the month’s count from Manager mode. '+packs_
    :!who?'Pick your name to start counting.'
    :'Count each place in order. A box saves itself a moment after you stop typing, and ✓ means it is saved. Leave a box empty if you have not counted it; type 0 if there is none.';
  updateProgress(nItems);
  if(mgr)initSortables();
  if(document.getElementById('placesModal').classList.contains('show'))renderPlaces();
}

/* A place heading: during a count, how many of its rows are counted (saved,
   not merely typed); otherwise how many items it holds. */
function placeHead(label,rows,pid){
  return '<div class="cat-header stock-place-hd"'+(pid!==''?' data-place-id="'+pid+'"':' data-orphans="1"')+'><div class="cat-label">'+esc(label)+'</div>'
    +'<div class="stock-place-n">'+headCount(rows)+'</div></div>';
}
/* the set-up lists' headings: always a plain count, never "counted" */
function setupHead(label,n){
  return '<div class="cat-header stock-place-hd"><div class="cat-label">'+esc(label)+'</div>'
    +'<div class="stock-place-n">'+n+' item'+(n===1?'':'s')+'</div></div>';
}
function headCount(rows){
  if(!count)return rows.length+' item'+(rows.length===1?'':'s');
  var n=0;for(var i=0;i<rows.length;i++)if(isCounted(rows[i].id))n++;
  return n+' of '+rows.length+' counted';
}
function isCounted(id){var l=lines[id];return !!l&&(l.full_qty!=null||l.loose_qty!=null);}
function updateProgress(nItems){
  var hs=document.querySelectorAll('.stock-place-hd[data-place-id],.stock-place-hd[data-orphans]'),done=0;
  for(var i=0;i<hs.length;i++){
    var pid=hs[i].getAttribute('data-place-id'),rows=[];
    for(var k=0;k<items.length;k++){var it=items[k];
      if(pid?String(it.place_id)===pid:!placeById(it.place_id))rows.push(it);}
    hs[i].querySelector('.stock-place-n').textContent=headCount(rows);
  }
  for(var k=0;k<items.length;k++)if(isCounted(items[k].id))done++;
  if(nItems==null){var d={};nItems=0;for(var k=0;k<items.length;k++)if(!d[items[k].order_item_id]){d[items[k].order_item_id]=1;nItems++;}}
  document.getElementById('sheetSummary').textContent=count?done+' of '+items.length+' counted':nItems+' items · '+places.length+' places';
}

/* Which boxes an item gets (docs/inventory-guide.md, "Which boxes an item gets"):
   a pack of more than 1 -> Full x pack, and Loose in pack units;
   a pack of exactly 1   -> one box in the pack unit;
   no pack yet           -> one box in the order-guide unit.
   A row already counted keeps the boxes it was counted in — the pack it
   was counted against is on the line — so "7 loose" never changes meaning
   because the price list changed mid-count. */
function specFor(it){
  var l=lines[it.id];
  if(l&&(l.full_qty!=null||l.loose_qty!=null)){
    var q=num(l.pack_qty_snap);
    return {two:q>1,snapQty:q,snapUnit:l.pack_unit_snap||null,unit:l.pack_unit_snap||'units'};
  }
  var pk=packs[it.order_item_id],g=it.order_items||{};
  if(pk)return {two:pk.qty>1,snapQty:pk.qty,snapUnit:pk.unit,unit:pk.unit};
  return {two:false,snapQty:null,snapUnit:g.unit||null,unit:g.unit||'units'};
}
function canCount(){return !!count&&!!who&&!mgr;}

function rowHtml(it,here,placesOf){
  var g=it.order_items||{},name=itemName(it),sp=specFor(it);
  var sub=[];
  if(g.vendor)sub.push(esc(g.vendor));
  var also=(placesOf[it.order_item_id]||[]).filter(function(l){return l!==here;});
  if(also.length)sub.push('also in '+esc(also.join(', ')));
  if(g.active===false)sub.push('no longer on the order guide');
  var boxes;
  if(sp.two){
    boxes=box(it,'full','Full','× '+sp.snapQty+' '+sp.unit,'Full packs of '+name)
         +box(it,'loose','Loose',sp.unit,'Loose '+sp.unit+' of '+name);
  }else{
    boxes=box(it,'full','',sp.unit,name+', in '+sp.unit);
  }
  // grips only in manager mode, and only in a real place - an orphan has no list to sort in
  var grip=(mgr&&here)?'<div class="drag-handle" aria-label="Drag to reorder '+esc(name)+'">'+GRIP+'</div>':'';
  var acts=mgr?'<div class="row-mgr-actions">'
      +'<button class="mgr-edit-btn" onclick="openMove('+it.id+')" aria-label="Move '+esc(name)+'">Move</button>'
      +'<button class="mgr-retire-btn" onclick="removeRow('+it.id+')" aria-label="Stop counting '+esc(name)+(here?' in '+esc(here):'')+'">Remove</button></div>':'';
  return '<div class="count-row stock-row" data-id="'+it.id+'">'+grip
    +'<div class="count-info"><div class="count-name">'+esc(name)+'</div>'
    +(sub.length?'<div class="count-par">'+sub.join(' · ')+'</div>':'')
    +'<div class="stock-state-slot">'+stateHtml(it.id)+'</div></div>'
    +'<div class="stock-boxes">'+boxes+'</div>'+acts+'</div>';
}

/* A box shows what was typed here and not yet confirmed, else what is saved. */
function boxValue(id,part){
  var L=local[id];if(L)return L[part]||'';
  var l=lines[id];if(!l)return '';
  return fmtQty(part==='full'?l.full_qty:l.loose_qty);
}
function box(it,part,label,unit,aria){
  var v=count?boxValue(it.id,part):'';
  return '<label class="stock-box">'+(label?'<span class="stock-lbl">'+label+'</span>':'')
    +'<input class="stock-input'+(v!==''?' filled':'')+'" type="text" inputmode="decimal" autocomplete="off"'+(canCount()?'':' disabled')
    +' value="'+esc(v)+'" data-item-id="'+it.id+'" data-part="'+part+'" aria-label="'+esc(aria)+'"'
    +' oninput="onBox(this)" onchange="saveSoon('+it.id+',0)">'
    +'<span class="stock-unit">'+esc(unit)+'</span></label>';
}

/* A row's state, in words: saved (and by whom), saving, not saved (and what
   to do), or not a number. Nothing at all for a row nobody has counted. */
function stateHtml(id){
  if(!count)return '';
  var L=local[id];
  if(L&&L.state==='saving')return '<div class="stock-state">Saving…</div>';
  if(L&&L.state==='invalid')return '<div class="stock-state invalid">Numbers only — like 2 or 1.5</div>';
  if(L&&L.state==='failed')return '<button type="button" class="stock-state failed" onclick="saveRow('+id+')">Not saved — '+esc(L.msg)+'. Tap to try again</button>';
  if(L&&L.state==='dirty')return '<div class="stock-state">Not saved yet</div>';
  var l=lines[id];
  if(l&&(l.full_qty!=null||l.loose_qty!=null))return '<div class="stock-state saved">✓ Counted'+(l.counted_by?' by '+esc(l.counted_by):'')+'</div>';
  return '';
}
function rowEl(id){return document.querySelector('.stock-row[data-id="'+id+'"]');}
function paintRow(id){
  var r=rowEl(id);if(!r)return;
  var slot=r.querySelector('.stock-state-slot');if(slot)slot.innerHTML=stateHtml(id);
  var ins=r.querySelectorAll('.stock-input');
  for(var i=0;i<ins.length;i++){
    // a saved value comes back from the table: show it, unless someone is typing in that box
    if(!local[id]&&document.activeElement!==ins[i])ins[i].value=boxValue(id,ins[i].getAttribute('data-part'));
    ins[i].classList.toggle('filled',ins[i].value!=='');
  }
}

/* ── COUNTING ──
   A row saves itself a moment after typing stops (or at once when the box
   loses focus), as an UPSERT on (count_id, inventory_item_id): a retry after
   a lost answer updates the same line and can never add a second. One
   request per row at a time; an edit made while one is in flight is sent
   when it lands. ✓ appears only when the table has answered with the row. */
function fmtQty(n){return n==null?'':String(+n);}
/* '' -> null (blank); a non-negative number -> it; anything else -> undefined */
function parseQty(v){
  var t=String(v==null?'':v).trim().replace(',','.');
  if(t==='')return null;
  if(!/^(\d+\.?\d*|\.\d+)$/.test(t))return undefined;
  return parseFloat(t);
}
function numEq(a,b){return (a==null&&b==null)||(a!=null&&b!=null&&Number(a)===Number(b));}

function onBox(el){
  var id=parseInt(el.getAttribute('data-item-id'),10),r=rowEl(id),L=local[id];
  if(!L){
    L=local[id]={full:'',loose:''};
    var ins=r?r.querySelectorAll('.stock-input'):[];
    for(var i=0;i<ins.length;i++)L[ins[i].getAttribute('data-part')]=ins[i].value;
  }
  L[el.getAttribute('data-part')]=el.value;
  L.by=who;L.state='dirty';
  el.classList.toggle('filled',el.value!=='');
  var slot=r&&r.querySelector('.stock-state-slot');if(slot)slot.innerHTML=stateHtml(id);
  saveSoon(id,SAVE_DELAY);
}
function saveSoon(id,ms){
  var L=local[id];if(!L||L.state!=='dirty')return;
  clearTimeout(L.timer);L.timer=setTimeout(function(){saveRow(id);},ms);
}
function saveRow(id){
  var L=local[id];if(!L||!count)return;
  clearTimeout(L.timer);L.timer=null;
  if(L.inflight)return;                 // sent again when this one lands
  var by=L.by||who;if(!by)return;
  var it=itemById(id);if(!it)return;
  var sp=specFor(it),f=parseQty(L.full),l=sp.two?parseQty(L.loose):null;
  if(f===undefined||l===undefined){L.state='invalid';paintRow(id);return;}
  // blank vs zero: both blank = not counted; one blank beside a filled box = 0
  if(sp.two&&(f!==null||l!==null)){if(f===null)f=0;if(l===null)l=0;}
  var line=lines[id];
  if(!line&&f===null&&l===null){delete local[id];paintRow(id);return;}   // nothing to save, nothing to clear
  if(line&&numEq(line.full_qty,f)&&numEq(line.loose_qty,l)){delete local[id];paintRow(id);return;}
  L.inflight=true;L.state='saving';paintRow(id);
  var cid=count.id;
  var body={location:LOCATION,count_id:cid,inventory_item_id:id,full_qty:f,loose_qty:l,
            pack_qty_snap:sp.snapQty,pack_unit_snap:sp.snapUnit,counted_by:by,updated_at:new Date().toISOString()};
  api('POST','inventory_count_lines','on_conflict=count_id,inventory_item_id',body,function(r,s){
    L.inflight=false;
    var row=Array.isArray(r)&&r.length===1?r[0]:null;
    if(s>=200&&s<300&&row&&row.inventory_item_id===id&&row.count_id===cid&&numEq(row.full_qty,f)&&numEq(row.loose_qty,l)){
      if(count&&count.id===cid)lines[id]=row;
      var nf=parseQty(L.full),nl=sp.two?parseQty(L.loose):null;
      if(sp.two&&(nf!==null||nl!==null)){if(nf===null)nf=0;if(nl===null)nl=0;}
      if(local[id]===L&&numEq(nf,f)&&numEq(nl,l))delete local[id];   // nothing typed since: the table has it
      else if(local[id]===L){L.state='dirty';saveRow(id);}           // typed while it was saving: send that too
    }else{
      L.state='failed';
      L.msg=s===0?'no answer from the server':(s===401||s===403)?'the count may have been closed':(s>=200&&s<300)?'the server did not confirm it':'the server refused it';
      if(s===401||s===403)loadAll({quiet:true,force:true});
    }
    paintRow(id);updateProgress();
  },null,'resolution=merge-duplicates,return=representation');
}

/* ── who is counting: picked once, kept while the page is open ── */
function renderWho(){
  var bar=document.getElementById('nameBar'),show=!!count||mgr;
  bar.style.display=show?'':'none';
  if(!show)return;
  var sel=document.getElementById('countedBy'),h='<option value="">Pick your name…</option>',seen={};
  for(var i=0;i<staff.length;i++){
    var n=staff[i].name;
    if(!n||seen[n])continue;              // one entry per person, not one per shift
    seen[n]=1;h+='<option value="'+esc(n)+'">'+esc(n)+'</option>';
  }
  sel.innerHTML=h;sel.value='';
  var has=!!who;
  sel.style.display=has?'none':'';
  document.getElementById('whoLabel').textContent=has?'Counting as':'Counted by';
  var nm=document.getElementById('whoName');nm.style.display=has?'':'none';nm.textContent=who;
  document.getElementById('whoChange').style.display=has?'':'none';
}
function pickWho(v){
  who=v||'';
  try{if(who)sessionStorage.setItem(WHO_KEY,who);else sessionStorage.removeItem(WHO_KEY);}catch(e){}
  render();
}
/* Anything typed under the old name is sent under it before the name changes. */
function changeWho(){
  for(var id in local)if(local[id].state==='dirty')saveRow(parseInt(id,10));
  pickWho('');
  setTimeout(function(){var s=document.getElementById('countedBy');if(s)s.focus();},50);
}

/* ── MANAGER: what the count does not cover yet ──
   New = an active guide item that is neither counted anywhere nor left off
   on purpose. It stays here until a manager decides, so a new order-guide
   item can never silently miss every count after it. */
function counted(){var c={};for(var i=0;i<items.length;i++)c[items[i].order_item_id]=1;return c;}
function newItemsHtml(){
  if(!guide||!leftOff)return '';
  var c=counted(),lo={},list=[];
  for(var i=0;i<leftOff.length;i++)lo[leftOff[i].order_item_id]=1;
  for(var i=0;i<guide.length;i++)if(!c[guide[i].id]&&!lo[guide[i].id])list.push(guide[i]);
  var h=setupHead('New on the order guide',list.length);
  if(!list.length)return h+'<div class="stock-none">Nothing new — every order-guide item is counted or left off on purpose.</div>';
  h+='<div class="stock-new">';
  for(var i=0;i<list.length;i++){
    var g=list[i];
    h+='<div class="count-row stock-row" data-oid="'+g.id+'"><div class="count-info"><div class="count-name">'+esc(g.name)+'</div>'
      +'<div class="count-par">'+esc([g.vendor,g.category,g.unit].filter(Boolean).join(' · '))+'</div></div>'
      +'<div class="row-mgr-actions"><button class="mgr-edit-btn" onclick="openAddTo('+g.id+',null)" aria-label="Count '+esc(g.name)+'">Add</button>'
      +'<button class="mgr-retire-btn" onclick="leaveOff('+g.id+')" aria-label="Don’t count '+esc(g.name)+'">Don’t count</button></div></div>';
  }
  return h+'</div>';
}

/* Left off on purpose: undoable, so it is listed — collapsed, since it is
   long and mostly paper and cleaning. Only items still on the guide and not
   counted anywhere; a lingering row for a counted item is harmless and hidden. */
function leftOffHtml(){
  if(!guide||!leftOff)return '';
  var c=counted(),list=[];
  for(var i=0;i<leftOff.length;i++){var g=guideById(leftOff[i].order_item_id);if(g&&!c[g.id])list.push({lo:leftOff[i],g:g});}
  list.sort(function(a,b){return (a.g.vendor+a.g.category+a.g.name).localeCompare(b.g.vendor+b.g.category+b.g.name);});
  var h=setupHead('Left off on purpose',list.length)
    +'<div class="stock-none"><button class="link-btn" id="leftOffBtn" onclick="toggleLeftOff()" aria-expanded="'+showLeftOff+'">'+(showLeftOff?'Hide':'Show')+' the list</button></div>';
  if(!showLeftOff)return h;
  h+='<div class="stock-left">';
  for(var i=0;i<list.length;i++){
    var g=list[i].g;
    h+='<div class="count-row stock-row" data-oid="'+g.id+'"><div class="count-info"><div class="count-name">'+esc(g.name)+'</div>'
      +'<div class="count-par">'+esc([g.vendor,g.category].filter(Boolean).join(' · '))+'</div></div>'
      +'<div class="row-mgr-actions"><button class="mgr-edit-btn" onclick="openAddTo('+g.id+','+list[i].lo.id+')" aria-label="Count '+esc(g.name)+' after all">Count it</button></div></div>';
  }
  return h+'</div>';
}
function toggleLeftOff(){showLeftOff=!showLeftOff;render();}

/* ── MANAGER: writes ──
   One write at a time. Every write ends in a fresh read of the sheet, so the
   screen shows what the table holds, not what the page hoped it would. */
function setBusy(b){
  busy=b;
  for(var i=0;i<sortables.length;i++){try{sortables[i].option('disabled',b);}catch(e){}}
  var sb=document.getElementById('nameSaveBtn');if(sb)sb.disabled=b;
}
function stillSaving(){showToast('Still saving — one moment','error');}
function outcome(r,s){
  if(s>=200&&s<300&&Array.isArray(r)&&r.length)return 'ok';
  if(s===409)return 'conflict';   // a unique key said it is already so
  if(s===0)return 'unknown';      // no answer: it may or may not have landed
  return 'fail';
}
function finish(o,okMsg){
  setBusy(false);
  if(o==='ok')showToast(okMsg,'success');
  else if(o==='conflict')showToast('Already done — showing what is saved','success');
  else if(o==='unknown')showToast('No answer — showing what is saved','error');
  else showToast('Could not save — showing what is saved','error');
  loadAll({quiet:true,force:true});
}
function nextSort(pid){var m=0;for(var i=0;i<items.length;i++)if(items[i].place_id===pid&&items[i].sort_order>m)m=items[i].sort_order;return m+10;}

/* ── the place picker ── */
function openMove(id){
  if(busy)return stillSaving();
  var it=itemById(id);if(!it)return;
  pick={kind:'row',mode:'move',it:it,oid:it.order_item_id,name:itemName(it)};
  showPick();
}
function openAddTo(oid,loId){
  if(busy)return stillSaving();
  var g=guideById(oid);if(!g)return;
  pick={kind:'add',oid:oid,loId:loId,name:g.name};
  showPick();
}
function setPickMode(m){if(pick){pick.mode=m;showPick();}}
function showPick(){
  var here=pick.kind==='row'?placeById(pick.it.place_id):null,inPlace={};
  for(var i=0;i<items.length;i++)if(items[i].order_item_id===pick.oid)inPlace[items[i].place_id]=1;
  document.getElementById('pickTitle').textContent=pick.kind==='add'?'Count '+pick.name+' in…'
    :(pick.mode==='move'?'Move '+pick.name+' to…':'Also count '+pick.name+' in…');
  document.getElementById('pickSub').textContent=pick.kind==='add'?'Pick the place it is stored.'
    :(here?'Counted now in '+here.label+'.':'Not in an active place.');
  document.getElementById('pickToggle').style.display=pick.kind==='row'?'':'none';
  document.getElementById('pickMoveBtn').className='mode-btn'+(pick.mode==='move'?' active':'');
  document.getElementById('pickAlsoBtn').className='mode-btn'+(pick.mode==='also'?' active':'');
  var h='';
  for(var i=0;i<places.length;i++){
    var p=places[i],taken=!!inPlace[p.id];
    h+='<button type="button" class="stock-pick" data-place-id="'+p.id+'"'+(taken?' disabled':'')+' onclick="choosePlace('+p.id+')">'
      +esc(p.label)+(taken?' — counted here already':'')+'</button>';
  }
  document.getElementById('pickList').innerHTML=h;
  document.getElementById('pickModal').classList.add('show');
}
function closePick(){document.getElementById('pickModal').classList.remove('show');pick=null;}
function choosePlace(pid){
  if(busy)return stillSaving();
  var p=pick;if(!p)return;
  closePick();
  var label=(placeById(pid)||{}).label||'';
  setBusy(true);
  if(p.kind==='row'&&p.mode==='move'){
    // one write: the row changes place, and lands at the bottom of it
    api('PATCH','inventory_items','id=eq.'+p.it.id,{place_id:pid,sort_order:nextSort(pid)},function(r,s){finish(outcome(r,s),'Moved to '+label);});
    return;
  }
  api('POST','inventory_items',null,{location:LOCATION,order_item_id:p.oid,place_id:pid,sort_order:nextSort(pid)},function(r,s){
    var o=outcome(r,s);
    // from the left-off list: it is counted now, so the decision is undone.
    // Only after the count row exists - an item must never be in neither.
    if(p.loId&&(o==='ok'||o==='conflict')){
      api('PATCH','inventory_left_off','id=eq.'+p.loId,{active:false},function(){finish(o,'Counted in '+label);});
      return;
    }
    finish(o,'Counted in '+label);
  });
}

/* Remove: stop counting an item in this place. In its last place, it is
   recorded as left off first, then removed - so it is never in neither. */
function removeRow(id){
  if(busy)return stillSaving();
  var it=itemById(id);if(!it)return;
  var name=itemName(it),here=placeById(it.place_id),others=[];
  for(var i=0;i<items.length;i++){var o=items[i];if(o.id!==id&&o.order_item_id===it.order_item_id){var op=placeById(o.place_id);others.push(op?op.label:'a retired place');}}
  if(others.length){
    if(!confirm('Stop counting '+name+(here?' in '+here.label:'')+'? It is still counted in '+others.join(', ')+'.'))return;
    setBusy(true);
    api('PATCH','inventory_items','id=eq.'+id,{active:false},function(r,s){finish(outcome(r,s),'Removed'+(here?' from '+here.label:''));});
    return;
  }
  if(!confirm('Stop counting '+name+'? It moves to "Left off on purpose", where you can bring it back.'))return;
  setBusy(true);
  api('POST','inventory_left_off',null,{location:LOCATION,order_item_id:it.order_item_id},function(r,s){
    var o=outcome(r,s);
    if(o!=='ok'&&o!=='conflict'){finish(o,'');return;}   // not recorded: keep counting it
    api('PATCH','inventory_items','id=eq.'+id,{active:false},function(r2,s2){finish(outcome(r2,s2),'Left off the count');});
  });
}

function leaveOff(oid){
  if(busy)return stillSaving();
  setBusy(true);
  api('POST','inventory_left_off',null,{location:LOCATION,order_item_id:oid},function(r,s){finish(outcome(r,s),'Left off the count');});
}

/* ── MANAGER: the month's count ── */
function monthLabel(period){
  var p=String(period).split('-'),mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return mn[parseInt(p[1],10)-1]+' '+p[0];
}
function monthIso(offset){
  var d=new Date(),m=new Date(d.getFullYear(),d.getMonth()+offset,1);
  return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-01';
}
function nCounted(){var n=0;for(var k=0;k<items.length;k++)if(isCounted(items[k].id))n++;return n;}
function countBarHtml(){
  if(count){
    var n=nCounted(),h='<div class="stock-countbar"><strong>'+esc(monthLabel(count.period))+' count</strong> is open — '+n+' of '+items.length+' counted. Closing a month comes in a later update.';
    if(!n){
      var other=count.period===monthIso(0)?monthIso(-1):monthIso(0);
      h+='<div class="stock-countbar-btns"><button class="mgr-edit-btn" onclick="switchMonth(\''+other+'\')">Wrong month? Make it '+esc(monthLabel(other))+'</button></div>';
    }
    return h+'</div>';
  }
  var a=monthIso(0),b=monthIso(-1);
  return '<div class="stock-countbar">No count is open. Start the month’s count when you are ready — staff can count as soon as it starts.'
    +'<div class="stock-countbar-btns"><button class="mgr-edit-btn" onclick="startCount(\''+a+'\')">Start '+esc(monthLabel(a))+'</button>'
    +'<button class="mgr-edit-btn" onclick="startCount(\''+b+'\')">Start '+esc(monthLabel(b))+'</button></div></div>';
}
/* One open count at a time, and one count per month - both are unique keys
   on the table, so a second phone starting one at the same moment gets a
   409 and is told, never a second count. */
function startCount(period){
  if(busy)return stillSaving();
  if(!who){showToast('Pick your name first','error');return;}
  if(!confirm('Start the '+monthLabel(period)+' count? Staff can count as soon as it is open.'))return;
  setBusy(true);
  api('POST','inventory_counts',null,{location:LOCATION,period:period},function(r,s){
    var o=outcome(r,s);
    if(o==='conflict'){setBusy(false);showToast('There is already a '+monthLabel(period)+' count, or another count is open','error');loadAll({quiet:true,force:true});return;}
    if(o!=='ok')return finish(o,'');
    api('POST','inventory_count_log',null,{location:LOCATION,count_id:r[0].id,action:'start',by_name:who},function(){finish('ok',monthLabel(period)+' count started');});
  });
}
/* A count started under the wrong month can be moved - but only before
   anything has been counted in it. */
function switchMonth(period){
  if(busy)return stillSaving();
  if(!count||nCounted())return;
  if(!confirm('Make this the '+monthLabel(period)+' count instead?'))return;
  setBusy(true);
  api('PATCH','inventory_counts','id=eq.'+count.id,{period:period},function(r,s){
    var o=outcome(r,s);
    if(o==='conflict'){setBusy(false);showToast('There is already a '+monthLabel(period)+' count','error');loadAll({quiet:true,force:true});return;}
    finish(o,'Now the '+monthLabel(period)+' count');
  });
}

/* ── drag to reorder (manager mode), as on Orders, Prep and Line ──
   One Sortable per place, so an item can never be dropped into another
   place by accident; Move does that, deliberately. */
function destroySortables(){for(var i=0;i<sortables.length;i++){try{sortables[i].destroy();}catch(e){}}sortables=[];}
function initSortables(){
  destroySortables();
  if(!mgr)return;
  if(typeof Sortable==='undefined'){showToast('Drag unavailable — reload page','error');return;}
  var lists=document.querySelectorAll('.stock-place-body');
  for(var i=0;i<lists.length;i++){
    (function(listEl){
      sortables.push(Sortable.create(listEl,{
        handle:'.drag-handle',
        draggable:'.stock-row',
        animation:150,
        disabled:busy,
        ghostClass:'sortable-ghost',
        chosenClass:'sortable-chosen',
        dragClass:'sortable-drag',
        onEnd:function(evt){persistOrder(listEl,evt);}
      }));
    })(lists[i]);
  }
}
/* Renumber the place as it now stands on screen - 10, 20, 30 - and PATCH only
   the rows whose number changed. Any failure re-reads the sheet: some PATCHes
   may have landed, and no local snapshot can describe that. */
function persistOrder(listEl,evt){
  if(evt.oldIndex===evt.newIndex)return;
  var rows=listEl.querySelectorAll('.stock-row'),changed=[];
  for(var i=0;i<rows.length;i++){
    var it=itemById(parseInt(rows[i].getAttribute('data-id'),10));
    // Sortable has already moved the row; a row we cannot place means the
    // screen and the data disagree, so re-read rather than save a guess.
    if(!it){setBusy(true);finish('fail','');return;}
    var nv=(i+1)*10;
    if(it.sort_order!==nv){it.sort_order=nv;changed.push(it);}
  }
  items.sort(function(a,b){return a.sort_order-b.sort_order||a.id-b.id;});
  if(!changed.length)return;
  setBusy(true);
  var pending=changed.length,worst='ok';
  changed.forEach(function(it){
    api('PATCH','inventory_items','id=eq.'+it.id,{sort_order:it.sort_order},function(r,s){
      var o=outcome(r,s);if(o!=='ok')worst=o;
      if(--pending)return;
      if(worst==='ok'){setBusy(false);showToast('Order saved','success');}
      else finish(worst,'');
    });
  });
}

/* ── Places: reorder, rename, retire, add ── */
function openPlaces(){if(busy)return stillSaving();renderPlaces();document.getElementById('placesModal').classList.add('show');}
function closePlaces(){document.getElementById('placesModal').classList.remove('show');}
function renderPlaces(){
  var n={},h='';
  for(var i=0;i<items.length;i++)n[items[i].place_id]=(n[items[i].place_id]||0)+1;
  for(var i=0;i<places.length;i++){
    var p=places[i],k=n[p.id]||0;
    h+='<div class="stock-prow" data-place-id="'+p.id+'"><div><span class="stock-prow-name">'+esc(p.label)+'</span><span class="stock-prow-n">'+k+' item'+(k===1?'':'s')+'</span></div>'
      +'<div class="stock-prow-btns">'
      +'<button class="mgr-edit-btn" onclick="movePlace('+p.id+',-1)"'+(i===0?' disabled':'')+' aria-label="Move '+esc(p.label)+' earlier">▲</button>'
      +'<button class="mgr-edit-btn" onclick="movePlace('+p.id+',1)"'+(i===places.length-1?' disabled':'')+' aria-label="Move '+esc(p.label)+' later">▼</button>'
      +'<button class="mgr-edit-btn" onclick="openName(\'rename\','+p.id+')">Rename</button>'
      +'<button class="mgr-retire-btn" onclick="retirePlace('+p.id+')"'+(k?' disabled':'')+'>Retire</button></div>'
      +(k?'<div class="stock-prow-note">Move its items out to retire it.</div>':'')+'</div>';
  }
  document.getElementById('placesList').innerHTML=h||'<div class="stock-none">No places yet.</div>';
}
function movePlace(id,dir){
  if(busy)return stillSaving();
  var order=places.slice(),i=-1;
  for(var k=0;k<order.length;k++)if(order[k].id===id)i=k;
  var j=i+dir;if(i<0||j<0||j>=order.length)return;
  var t=order[i];order[i]=order[j];order[j]=t;
  var changed=[];
  for(var k=0;k<order.length;k++){var nv=(k+1)*10;if(order[k].sort_order!==nv)changed.push({id:order[k].id,sort_order:nv});}
  if(!changed.length)return;
  setBusy(true);
  var pending=changed.length,worst='ok';
  changed.forEach(function(c){
    api('PATCH','inventory_places','id=eq.'+c.id,{sort_order:c.sort_order},function(r,s){
      var o=outcome(r,s);if(o!=='ok')worst=o;
      if(--pending)return;
      finish(worst,'Places reordered');
    });
  });
}
function retirePlace(id){
  if(busy)return stillSaving();
  var p=placeById(id);if(!p)return;
  for(var i=0;i<items.length;i++)if(items[i].place_id===id)return;   // the button says why
  if(!confirm('Retire '+p.label+'? It will no longer appear on the count sheet.'))return;
  setBusy(true);
  api('PATCH','inventory_places','id=eq.'+id,{active:false},function(r,s){finish(outcome(r,s),p.label+' retired');});
}
function openName(mode,id){
  if(busy)return stillSaving();
  nameCtx={mode:mode,id:id||null};
  var p=id?placeById(id):null,inp=document.getElementById('nameInput');
  document.getElementById('nameTitle').textContent=mode==='add'?'New place':'Rename '+(p?p.label:'place');
  inp.value=p?p.label:'';
  document.getElementById('nameErr').classList.remove('show');
  document.getElementById('nameModal').classList.add('show');
  setTimeout(function(){inp.focus();},100);
}
function closeName(){document.getElementById('nameModal').classList.remove('show');nameCtx=null;}
function nameErr(msg){var e=document.getElementById('nameErr');e.textContent=msg;e.classList.add('show');}
function saveName(){
  if(busy)return stillSaving();
  var c=nameCtx;if(!c)return;
  var v=(document.getElementById('nameInput').value||'').replace(/\s+/g,' ').trim();
  if(!v)return nameErr('Give the place a name');
  for(var i=0;i<places.length;i++)if(places[i].id!==c.id&&places[i].label.toLowerCase()===v.toLowerCase())return nameErr('There is already a place called '+places[i].label);
  var p=c.id?placeById(c.id):null;
  if(p&&p.label===v){closeName();return;}
  setBusy(true);
  function done(r,s){
    var o=outcome(r,s);
    // the table keeps retired places' names too, so a 409 is a name used before
    if(o==='conflict'){setBusy(false);nameErr('That name belonged to a retired place — pick another');return;}
    closeName();
    finish(o,c.mode==='add'?v+' added':'Renamed to '+v);
  }
  if(c.mode==='add'){
    var m=0;for(var i=0;i<places.length;i++)if(places[i].sort_order>m)m=places[i].sort_order;
    api('POST','inventory_places',null,{location:LOCATION,label:v,sort_order:m+10},done);
  }else{
    api('PATCH','inventory_places','id=eq.'+c.id,{label:v},done);
  }
}

/* ── MANAGER MODE ── */
function setMgr(on){
  mgr=on;
  var sw=document.getElementById('mgrSwitch');
  sw.classList.toggle('on',on);sw.setAttribute('aria-checked',on?'true':'false');
  // the order guide and left-off list are manager-only reads; fetch them on the way in
  if(on&&(!guide||!leftOff))loadAll({quiet:true,force:true});
  else render();
}
function toggleMgr(){
  if(mgr){closePick();closePlaces();closeName();setMgr(false);return;}
  if(sessionStorage.getItem('boxkitchen_mgr')==='1'){setMgr(true);return;}
  openPin();
}
function openPin(){
  var inp=document.getElementById('pinInput');inp.value='';
  document.getElementById('pinErr').classList.remove('show');
  document.getElementById('pinModal').classList.add('show');
  setTimeout(function(){inp.focus();},100);
}
function closePin(){document.getElementById('pinModal').classList.remove('show');}
function submitPin(){
  var v=(document.getElementById('pinInput').value||'').trim();
  if(v===MANAGER_PIN){
    sessionStorage.setItem('boxkitchen_mgr','1');
    closePin();setMgr(true);
    showToast('Manager mode unlocked','success');
  }else{
    document.getElementById('pinErr').classList.add('show');
    var inp=document.getElementById('pinInput');inp.value='';inp.focus();
  }
}
document.getElementById('mgrSwitch').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMgr();}});
document.getElementById('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitPin();}});
document.getElementById('nameInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveName();}});
['pinModal','pickModal','placesModal','nameModal'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(e){
    if(e.target!==this)return;
    if(id==='pinModal')closePin();else if(id==='pickModal')closePick();else if(id==='placesModal')closePlaces();else closeName();
  });
});

/* A phone or tablet that comes back to the page picks up what others have
   counted meanwhile - unless someone is typing in a box right now. */
document.addEventListener('visibilitychange',function(){
  if(document.hidden||loading||busy)return;
  var a=document.activeElement;if(a&&a.classList&&a.classList.contains('stock-input'))return;
  loadAll({quiet:true,force:true});
});

loadAll();
</script>

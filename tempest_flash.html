<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script>
  // Site-password gate (same as every inner page): bounce to hub if not authed.
  (function(){
    var raw = localStorage.getItem('boxkitchen_auth');
    var ts = raw ? parseInt(raw, 10) : 0;
    var TTL = 30 * 24 * 60 * 60 * 1000; // 30 days
    if (!ts || isNaN(ts) || (Date.now() - ts) > TTL) {
      window.location.replace('index.html');
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf6">
<title>Tempest Flash Report</title>
<link rel="stylesheet" href="assets/kitchen.css">
<style>
  /* Flash Reports — page-level overrides only. Every component lives
     in assets/kitchen.css. */

  /* the vendor list needs more room than the default modal */
  .modal{max-width:420px}
  .modal-btns{margin-top:16px}
  /* the "add a vendor" field sits in a flex row, so it must not carry
     the stacked-field bottom margin the shared modal input has */
  #newVendorName{margin-bottom:0}
</style>
</head>
<body>

<!-- PIN gate — shown until unlocked; hides all financials -->
<div class="gate" id="gate">
  <h2>Flash Report</h2>
  <p>Manager PIN required — this page shows sales &amp; food cost.</p>
  <input class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="gateInput" autocomplete="off">
  <div class="gate-err" id="gateErr">Incorrect PIN</div>
  <div class="gate-btns">
    <a class="gate-btn back" href="index.html">← Home</a>
    <button class="gate-btn go" onclick="submitGate()">Unlock</button>
  </div>
</div>

<div class="header">
  <div class="header-row">
    <a class="home-link" href="index.html">← Home</a>
    <h1>Flash <span>Report</span></h1>
    <div class="lock-tag">🔒 Manager</div>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="mEntry" onclick="switchMode('entry')">Entry</button>
    <button class="mode-btn" id="mReport" onclick="switchMode('report')">Month</button>
    <button class="mode-btn" id="mYtd" onclick="switchMode('ytd')">YTD</button>
  </div>
  <button class="manage-btn" onclick="openVendors()">⚙ Manage vendors</button>
</div>

<div id="entryView">
<div class="date-bar">
  <div class="date-left">
    <button class="date-arrow" onclick="changeDate(-1)">◀</button>
    <div class="date-info">
      <div class="date-display" id="dateDisplay"></div>
      <div class="day-display" id="dayDisplay"></div>
    </div>
    <button class="date-arrow" onclick="changeDate(1)">▶</button>
  </div>
  <div class="date-today" id="todayLink" onclick="goToday()" style="display:none">↩ Back to today</div>
</div>

<div class="summary">
  <div class="stat"><div class="stat-label">Gross Cost</div><div class="stat-val" id="sGross">$0</div><div class="stat-sub">purchases today</div></div>
  <div class="stat"><div class="stat-label">Daily %</div><div class="stat-val pct" id="sDaily">—</div><div class="stat-sub">cost ÷ sales</div></div>
  <div class="stat"><div class="stat-label">Running %</div><div class="stat-val run" id="sRun">—</div><div class="stat-sub" id="sRunSub">month to date</div></div>
</div>

<div class="entered-bar">
  <label for="enteredBy">Entered by</label>
  <input type="text" id="enteredBy" placeholder="Your name (optional)" autocomplete="off">
</div>

<div id="appBody"><div class="loading"><div class="spinner"></div><p>Loading…</p></div></div>
</div><!-- /entryView -->

<div id="reportView" style="display:none">
  <div class="date-bar">
    <div class="date-left">
      <button class="date-arrow" onclick="changeMonth(-1)">◀</button>
      <div class="date-info">
        <div class="date-display" id="monthDisplay"></div>
        <div class="day-display" id="reportKind">Month report</div>
      </div>
      <button class="date-arrow" onclick="changeMonth(1)">▶</button>
    </div>
    <button class="manage-btn" id="exportBtn" style="margin:0" onclick="exportMonth()">⬇ Excel</button>
  </div>
  <div id="reportBody"></div>
</div>

<div class="save-bar">
  <div class="save-summary" id="saveSummary">—</div>
  <button class="save-btn" id="saveBtn" onclick="saveDay()">Save day</button>
</div>

<!-- Manage Vendors modal -->
<div class="modal-bg" id="vendorsModal">
  <div class="modal">
    <h3>Manage Vendors</h3>
    <div id="vendorList"></div>
    <div class="nb-label">Add a vendor</div>
    <div style="display:flex;gap:8px">
      <input type="text" id="newVendorName" placeholder="New vendor name" autocomplete="off">
      <button class="modal-btn save" style="flex:0 0 auto;padding:11px 16px" onclick="addVendor()">Add</button>
    </div>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeVendors()">Done</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script>
var SB='https://sxppuyarecqkgkrsrefc.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cHB1eWFyZWNxa2drcnNyZWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTA4MzAsImV4cCI6MjA5Mjk2NjgzMH0.GM8OfcR68_JjdPeQ3k7j6L3ulJFaeS1xnSLBcdtYXtU';
var MANAGER_PIN='4316';
var LOCATION='Tempest';

var currentDate=new Date(),realToday=new Date();
var vendors=[];               // active flash_vendors, sorted
var daysByDate={};            // dateStr -> flash_days row (for the loaded month)
var loadedMonthKey='';        // 'YYYY-MM' currently loaded
var st=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(m,t,q,d,cb){var x=new XMLHttpRequest();x.open(m,SB+'/rest/v1/'+t+(q?'?'+q:''));x.setRequestHeader('apikey',SK);x.setRequestHeader('Authorization','Bearer '+SK);if(d){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Prefer','return=representation');}x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}if(cb)cb(r,x.status);};x.onerror=function(){if(cb)cb(null);};x.send(d?JSON.stringify(d):null);}

function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function money(n){var v=Number(n)||0;return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pct(n){return (Number(n)*100).toFixed(1)+'%';}
function num(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}

/* ---- PIN gate (whole page) ---- */
function revealApp(){document.getElementById('gate').classList.add('hide');init();}
function submitGate(){
  var v=(document.getElementById('gateInput').value||'').trim();
  if(v===MANAGER_PIN){
    try{sessionStorage.setItem('boxkitchen_mgr','1');}catch(e){}
    revealApp();
  }else{
    document.getElementById('gateErr').classList.add('show');
    var inp=document.getElementById('gateInput');inp.value='';inp.focus();
  }
}
document.getElementById('gateInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitGate();}});

/* ---- Boot ---- */
function boot(){
  var already=false;try{already=sessionStorage.getItem('boxkitchen_mgr')==='1';}catch(e){}
  if(already){revealApp();}
  else{document.getElementById('gate').classList.remove('hide');setTimeout(function(){document.getElementById('gateInput').focus();},120);}
}
function init(){updateDateDisplay();loadVendors(function(){loadMonth(render);});}

function loadVendors(cb){
  api('GET','flash_vendors','location=eq.'+encodeURIComponent(LOCATION)+'&order=sort_order.asc',null,function(r){
    vendors=Array.isArray(r)?r:[];   // all vendors; active filtered per view
    if(cb)cb();
  });
}
function activeVendors(){var a=[];for(var i=0;i<vendors.length;i++)if(vendors[i].active)a.push(vendors[i]);return a;}
function loadMonth(cb){
  var d=currentDate,start=new Date(d.getFullYear(),d.getMonth(),1),end=new Date(d.getFullYear(),d.getMonth()+1,0);
  api('GET','flash_days','location=eq.'+encodeURIComponent(LOCATION)+'&report_date=gte.'+fmtDate(start)+'&report_date=lte.'+fmtDate(end),null,function(r){
    daysByDate={};
    if(Array.isArray(r))for(var i=0;i<r.length;i++)daysByDate[r[i].report_date]=r[i];
    loadedMonthKey=monthKey(currentDate);
    if(cb)cb();
  });
}

function updateDateDisplay(){
  var mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('dateDisplay').textContent=mn[currentDate.getMonth()]+' '+currentDate.getDate()+', '+currentDate.getFullYear();
  document.getElementById('dayDisplay').textContent=dn[currentDate.getDay()];
  document.getElementById('todayLink').style.display=(fmtDate(currentDate)===fmtDate(realToday))?'none':'block';
}
function changeDate(dir){
  currentDate=new Date(currentDate.getTime()+dir*86400000);
  updateDateDisplay();
  if(monthKey(currentDate)!==loadedMonthKey)loadMonth(render);else render();
}
function goToday(){currentDate=new Date();updateDateDisplay();if(monthKey(currentDate)!==loadedMonthKey)loadMonth(render);else render();}

/* ---- Render the day's entry rows ---- */
function render(){
  var row=daysByDate[fmtDate(currentDate)]||{},pur=row.purchases||{};
  var h='<div class="intro">Enter each vendor’s invoice total for this day, then food sales.</div>';
  var av=activeVendors();
  for(var i=0;i<av.length;i++){
    var v=av[i],amt=pur[v.id];
    var val=(amt==null||amt==='')?'':String(amt);
    h+='<div class="flash-row">'+
         '<div class="vname">'+esc(v.name)+'</div>'+
         '<div class="money-wrap'+(val!==''?' filled':'')+'"><span class="dollar">$</span>'+
           '<input class="money-input" type="text" inputmode="decimal" autocomplete="off" data-vid="'+v.id+'" value="'+esc(val)+'" placeholder="0.00" oninput="onInput(this)">'+
         '</div>'+
       '</div>';
  }
  var sales=(row.food_sales==null||row.food_sales==='')?'':String(row.food_sales);
  h+='<div class="flash-row sales">'+
       '<div class="vname">FOOD SALES</div>'+
       '<div class="money-wrap'+(sales!==''?' filled':'')+'"><span class="dollar">$</span>'+
         '<input class="money-input" id="foodSales" type="text" inputmode="decimal" autocomplete="off" value="'+esc(sales)+'" placeholder="0.00" oninput="onInput(this)">'+
       '</div>'+
     '</div>';
  document.getElementById('appBody').innerHTML=h;
  document.getElementById('enteredBy').value=row.entered_by||document.getElementById('enteredBy').value||'';
  recalc();
}

function onInput(el){
  var w=el.parentElement;
  if(el.value.trim()!=='')w.classList.add('filled');else w.classList.remove('filled');
  recalc();
}

/* Sum today's purchases from the live inputs. */
function liveGrossToday(){
  var g=0,ins=document.querySelectorAll('.money-input[data-vid]');
  for(var i=0;i<ins.length;i++)g+=num(ins[i].value);
  return g;
}
function liveSales(){var el=document.getElementById('foodSales');return el?num(el.value):0;}

function grossOf(row){var p=row&&row.purchases||{},g=0;for(var k in p)if(p.hasOwnProperty(k))g+=num(p[k]);return g;}

function recalc(){
  var gToday=liveGrossToday(),sToday=liveSales();
  document.getElementById('sGross').textContent=money(gToday);
  document.getElementById('sDaily').textContent=sToday>0?pct(gToday/sToday):'—';
  // Running: cumulative cost & sales for the month up to & including current date.
  var cutoff=fmtDate(currentDate),cumC=0,cumS=0;
  for(var ds in daysByDate){
    if(!daysByDate.hasOwnProperty(ds))continue;
    if(ds>cutoff)continue;
    if(ds===cutoff)continue; // use live values for the current day instead
    cumC+=grossOf(daysByDate[ds]);
    cumS+=num(daysByDate[ds].food_sales);
  }
  cumC+=gToday;cumS+=sToday;
  document.getElementById('sRun').textContent=cumS>0?pct(cumC/cumS):'—';
  document.getElementById('sRunSub').textContent='thru '+(currentDate.getMonth()+1)+'/'+currentDate.getDate();
  document.getElementById('saveSummary').innerHTML='Gross <b>'+money(gToday)+'</b> · Sales <b>'+money(sToday)+'</b>';
}

/* ---- Save (upsert one flash_days row) ---- */
function saveDay(){
  var purchases={},ins=document.querySelectorAll('.money-input[data-vid]');
  for(var i=0;i<ins.length;i++){var vid=ins[i].getAttribute('data-vid'),val=ins[i].value.trim();if(val!=='')purchases[vid]=num(val);}
  var salesEl=document.getElementById('foodSales'),foodSales=(salesEl&&salesEl.value.trim()!=='')?num(salesEl.value):null;
  var enteredBy=document.getElementById('enteredBy').value.trim()||null;
  var dateStr=fmtDate(currentDate),existing=daysByDate[dateStr];
  // Preserve amounts for vendors NOT rendered on this screen (e.g. retired vendors
  // with history on this day) — only a rendered field can change or clear its amount.
  // Without this, re-saving a past day would silently erase a retired vendor's spend.
  var prev=(existing&&existing.purchases)||{},shown={};
  for(var i=0;i<ins.length;i++)shown[ins[i].getAttribute('data-vid')]=true;
  for(var k in prev)if(!shown[k])purchases[k]=prev[k];
  var payload={purchases:purchases,food_sales:foodSales,entered_by:enteredBy};
  var btn=document.getElementById('saveBtn');btn.disabled=true;
  function done(r){
    btn.disabled=false;
    if(r&&r.length){daysByDate[dateStr]=r[0];showToast('Saved',false);recalc();}
    else{showToast('Save failed — try again',true);}
  }
  if(existing&&existing.id){api('PATCH','flash_days','id=eq.'+existing.id,payload,done);}
  else{
    payload.location=LOCATION;payload.report_date=dateStr;
    api('POST','flash_days',null,payload,function(r,status){
      if(r&&r.length){done(r);return;}
      if(status!==409){done(null);return;}
      // 409: another device/person already created this day's row while this page
      // was open. Adopt their row, keep their amounts for vendors not shown here,
      // and re-save as a PATCH — otherwise "Save failed" loops until a reload.
      api('GET','flash_days','location=eq.'+encodeURIComponent(LOCATION)+'&report_date=eq.'+dateStr,null,function(rows){
        if(!rows||!rows.length){done(null);return;}
        var row=rows[0];daysByDate[dateStr]=row;
        var pv=row.purchases||{};
        for(var k in pv)if(!shown[k]&&payload.purchases[k]==null)payload.purchases[k]=pv[k];
        api('PATCH','flash_days','id=eq.'+row.id,payload,done);
      });
    });
  }
}

function showToast(msg,isErr){var t=document.getElementById('toast');t.textContent=(isErr?'⚠ ':'✓ ')+msg;t.classList.toggle('err',!!isErr);t.classList.add('show');clearTimeout(st);st=setTimeout(function(){t.classList.remove('show');},1600);}

/* ---- Month report + YTD ---- */
var mode='entry',yearDays=[];
function switchMode(m){
  mode=m;
  document.getElementById('mEntry').classList.toggle('active',m==='entry');
  document.getElementById('mReport').classList.toggle('active',m==='report');
  document.getElementById('mYtd').classList.toggle('active',m==='ytd');
  document.getElementById('entryView').style.display=(m==='entry')?'':'none';
  document.getElementById('reportView').style.display=(m==='entry')?'none':'';
  var sb=document.querySelector('.save-bar');if(sb)sb.style.display=(m==='entry')?'':'none';
  document.getElementById('exportBtn').style.display=(m==='report')?'':'none';
  document.getElementById('reportKind').textContent=(m==='ytd')?'Year to date':'Month report';
  if(m==='entry'){updateDateDisplay();render();}
  else if(m==='report'){updateMonthDisplay();if(monthKey(currentDate)!==loadedMonthKey)loadMonth(renderReport);else renderReport();}
  else{updateMonthDisplay();loadYear(renderYTD);}
}
function updateMonthDisplay(){
  var mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('monthDisplay').textContent=(mode==='ytd')?(''+currentDate.getFullYear()):(mn[currentDate.getMonth()]+' '+currentDate.getFullYear());
}
function changeMonth(dir){
  if(mode==='ytd'){currentDate=new Date(currentDate.getFullYear()+dir,currentDate.getMonth(),1);updateMonthDisplay();loadYear(renderYTD);}
  else{currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+dir,1);updateMonthDisplay();loadMonth(renderReport);}
}
function loadYear(cb){
  var y=currentDate.getFullYear();
  api('GET','flash_days','location=eq.'+encodeURIComponent(LOCATION)+'&report_date=gte.'+y+'-01-01&report_date=lte.'+y+'-12-31&order=report_date.asc',null,function(r){
    yearDays=Array.isArray(r)?r:[];if(cb)cb();
  });
}
function renderYTD(){
  var mnFull=['January','February','March','April','May','June','July','August','September','October','November','December'],i,y=currentDate.getFullYear();
  var months={},vtot={},totP=0,totS=0,daysWithSales=0;
  for(i=0;i<vendors.length;i++)vtot[vendors[i].id]={sum:0,deliv:0};
  for(var k=0;k<yearDays.length;k++){
    var row=yearDays[k],pur=row.purchases||{},g=0,vid,a;
    for(vid in pur){if(!pur.hasOwnProperty(vid))continue;a=num(pur[vid]);g+=a;if(a>0){if(!vtot[vid])vtot[vid]={sum:0,deliv:0};vtot[vid].sum+=a;vtot[vid].deliv++;}}
    var s=num(row.food_sales),mo=parseInt(row.report_date.slice(5,7),10)-1;
    if(!months[mo])months[mo]={p:0,s:0};months[mo].p+=g;months[mo].s+=s;
    totP+=g;totS+=s;if(s>0)daysWithSales++;
  }
  var moKeys=[];for(var mk in months)if(months.hasOwnProperty(mk))moKeys.push(parseInt(mk,10));moKeys.sort(function(a,b){return a-b;});
  var nMonths=moKeys.length,body=document.getElementById('reportBody');
  if(nMonths===0){body.innerHTML='<div class="rempty">No entries for '+y+' yet.</div>';return;}
  var h='<div class="rmonth-kpi">'+
    '<div class="stat"><div class="stat-label">YTD Purchases</div><div class="stat-val">'+money0(totP)+'</div></div>'+
    '<div class="stat"><div class="stat-label">YTD Sales</div><div class="stat-val">'+money0(totS)+'</div></div>'+
    '<div class="stat"><div class="stat-label">YTD Food Cost %</div><div class="stat-val run">'+(totS>0?pct(totP/totS):'—')+'</div></div>'+
    '</div>';
  h+='<div class="rmonth-kpi">'+
    '<div class="stat"><div class="stat-label">Avg Mo. Sales</div><div class="stat-val">'+money0(totS/nMonths)+'</div></div>'+
    '<div class="stat"><div class="stat-label">Avg Mo. Purch</div><div class="stat-val">'+money0(totP/nMonths)+'</div></div>'+
    '<div class="stat"><div class="stat-label">Avg Daily Sales</div><div class="stat-val">'+(daysWithSales>0?money0(totS/daysWithSales):'—')+'</div></div>'+
    '</div>';
  h+='<div class="rsection"><div class="rsection-title">By month</div><div class="rscroll"><table class="rtable"><thead><tr><th class="l">Month</th><th>Purchases</th><th>Food Sales</th><th>Food Cost %</th></tr></thead><tbody>';
  for(i=0;i<moKeys.length;i++){var mo=moKeys[i],m=months[mo];h+='<tr><td class="l">'+mnFull[mo]+'</td><td>'+money0(m.p)+'</td><td>'+money0(m.s)+'</td><td>'+(m.s>0?pct(m.p/m.s):'—')+'</td></tr>';}
  h+='<tr class="total"><td class="l">YTD</td><td>'+money0(totP)+'</td><td>'+money0(totS)+'</td><td>'+(totS>0?pct(totP/totS):'—')+'</td></tr></tbody></table></div></div>';
  var shown=[];for(i=0;i<vendors.length;i++){if(vendors[i].active||(vtot[vendors[i].id]&&vtot[vendors[i].id].sum>0))shown.push(vendors[i]);}
  h+='<div class="rsection"><div class="rsection-title">Vendor spend — year to date</div><div class="rscroll"><table class="rtable"><thead><tr><th class="l">Vendor</th><th>Total Spend</th><th>% of Purch</th><th>Deliveries</th><th>Avg Delivery</th></tr></thead><tbody>';
  for(i=0;i<shown.length;i++){var t=vtot[shown[i].id].sum,dv=vtot[shown[i].id].deliv;h+='<tr><td class="l">'+esc(shown[i].name)+(shown[i].active?'':' <span style="color:var(--grey)">(retired)</span>')+'</td><td>'+money0(t)+'</td><td>'+(totP>0?pct(t/totP):'—')+'</td><td>'+dv+'</td><td>'+(dv>0?money0(t/dv):'—')+'</td></tr>';}
  h+='</tbody></table></div></div>';
  body.innerHTML=h;
}
function money0(v){return '$'+Math.round(Number(v)||0).toLocaleString('en-US');}
function computeMonth(){
  var y=currentDate.getFullYear(),m=currentDate.getMonth(),N=new Date(y,m+1,0).getDate();
  var days=[],cumC=0,cumS=0,vtot={},monthPurch=0,monthSales=0,i,d;
  for(i=0;i<vendors.length;i++)vtot[vendors[i].id]={sum:0,deliv:0};
  for(d=1;d<=N;d++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var row=daysByDate[ds]||{},pur=row.purchases||{},gross=0;
    for(i=0;i<vendors.length;i++){var vid=vendors[i].id,a=num(pur[vid]);gross+=a;if(a>0){vtot[vid].sum+=a;vtot[vid].deliv++;}}
    var sales=num(row.food_sales);
    cumC+=gross;cumS+=sales;monthPurch+=gross;monthSales+=sales;
    days.push({d:d,pur:pur,gross:gross,sales:sales,cumC:cumC,cumS:cumS});
  }
  return {y:y,m:m,N:N,days:days,vtot:vtot,monthPurch:monthPurch,monthSales:monthSales};
}
function renderReport(){
  var mm=computeMonth(),i,d;
  // Columns: active vendors + any retired vendor that still has spend this month.
  var shown=[];for(i=0;i<vendors.length;i++){if(vendors[i].active||(mm.vtot[vendors[i].id]&&mm.vtot[vendors[i].id].sum>0))shown.push(vendors[i]);}
  var h='<div class="rmonth-kpi">'+
    '<div class="stat"><div class="stat-label">Purchases</div><div class="stat-val">'+money0(mm.monthPurch)+'</div></div>'+
    '<div class="stat"><div class="stat-label">Food Sales</div><div class="stat-val">'+money0(mm.monthSales)+'</div></div>'+
    '<div class="stat"><div class="stat-label">Food Cost %</div><div class="stat-val run">'+(mm.monthSales>0?pct(mm.monthPurch/mm.monthSales):'—')+'</div></div>'+
    '</div>';
  if(mm.monthPurch===0&&mm.monthSales===0){
    document.getElementById('reportBody').innerHTML=h+'<div class="rempty">No entries for this month yet.</div>';return;
  }
  // Daily detail (full per-vendor grid)
  h+='<div class="rsection"><div class="rsection-title">Daily detail</div><div class="rscroll"><table class="rtable"><thead><tr><th class="l">Date</th>';
  for(i=0;i<shown.length;i++)h+='<th>'+esc(shown[i].name)+'</th>';
  h+='<th>Gross</th><th>Sales</th><th>Cum Cost</th><th>Cum Sales</th><th>Daily%</th><th>Run%</th></tr></thead><tbody>';
  for(d=0;d<mm.days.length;d++){
    var day=mm.days[d];
    h+='<tr><td class="l">'+(mm.m+1)+'/'+day.d+'</td>';
    for(i=0;i<shown.length;i++){var a=num(day.pur[shown[i].id]);h+='<td>'+(a>0?money0(a):'')+'</td>';}
    h+='<td>'+(day.gross>0?money0(day.gross):'')+'</td><td>'+(day.sales>0?money0(day.sales):'')+'</td>'+
       '<td>'+(day.cumC>0?money0(day.cumC):'')+'</td><td>'+(day.cumS>0?money0(day.cumS):'')+'</td>'+
       '<td>'+(day.sales>0?pct(day.gross/day.sales):'')+'</td><td>'+(day.cumS>0?pct(day.cumC/day.cumS):'')+'</td></tr>';
  }
  h+='<tr class="total"><td class="l">TOTAL</td>';
  for(i=0;i<shown.length;i++){var vs=mm.vtot[shown[i].id].sum;h+='<td>'+(vs>0?money0(vs):'')+'</td>';}
  h+='<td>'+money0(mm.monthPurch)+'</td><td>'+money0(mm.monthSales)+'</td><td></td><td></td><td></td><td>'+(mm.monthSales>0?pct(mm.monthPurch/mm.monthSales):'—')+'</td></tr>';
  h+='</tbody></table></div></div>';
  // Weekly period summary
  h+='<div class="rsection"><div class="rsection-title">Weekly period summary</div><div class="rscroll"><table class="rtable"><thead><tr><th class="l">Wk</th><th class="l">Dates</th><th>Purchases</th><th>Sales</th><th>Cost%</th><th>Avg Day Purch</th><th>Avg Day Sales</th><th class="l">Top Vendor</th><th>Top $</th></tr></thead><tbody>';
  var periods=[[1,7],[8,14],[15,21],[22,28],[29,mm.N]],pi,md=String(mm.m+1).padStart(2,'0');
  for(pi=0;pi<periods.length;pi++){
    var a=periods[pi][0],b=Math.min(periods[pi][1],mm.N);
    if(a>mm.N)continue;
    var pPur=0,pSales=0,cnt=b-a+1,best='—',bestV=0,s;
    for(d=a;d<=b;d++){pPur+=mm.days[d-1].gross;pSales+=mm.days[d-1].sales;}
    for(i=0;i<shown.length;i++){s=0;for(d=a;d<=b;d++)s+=num(mm.days[d-1].pur[shown[i].id]);if(s>bestV){bestV=s;best=shown[i].name;}}
    h+='<tr><td class="l">'+(pi+1)+'</td><td class="l">'+md+'/'+String(a).padStart(2,'0')+'–'+md+'/'+String(b).padStart(2,'0')+'</td>'+
       '<td>'+money0(pPur)+'</td><td>'+money0(pSales)+'</td><td>'+(pSales>0?pct(pPur/pSales):'—')+'</td>'+
       '<td>'+money0(pPur/cnt)+'</td><td>'+money0(pSales/cnt)+'</td><td class="l">'+esc(best)+'</td><td>'+(bestV>0?money0(bestV):'—')+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  // Vendor spend breakdown
  h+='<div class="rsection"><div class="rsection-title">Vendor spend breakdown</div><div class="rscroll"><table class="rtable"><thead><tr><th class="l">Vendor</th><th>Total Spend</th><th>% of Purch</th><th>Deliveries</th><th>Avg Delivery</th></tr></thead><tbody>';
  for(i=0;i<shown.length;i++){
    var t=mm.vtot[shown[i].id].sum,dv=mm.vtot[shown[i].id].deliv;
    h+='<tr><td class="l">'+esc(shown[i].name)+(shown[i].active?'':' <span style="color:var(--grey);font-size:0.85em">(retired)</span>')+'</td><td>'+money0(t)+'</td><td>'+(mm.monthPurch>0?pct(t/mm.monthPurch):'—')+'</td><td>'+dv+'</td><td>'+(dv>0?money0(t/dv):'—')+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  document.getElementById('reportBody').innerHTML=h;
}

/* ---- Manage vendors (manager) ---- */
function findVendor(id){for(var i=0;i<vendors.length;i++)if(vendors[i].id===id)return vendors[i];return null;}
function idxOf(id){for(var i=0;i<vendors.length;i++)if(vendors[i].id===id)return i;return -1;}
function refreshViews(){if(mode==='report')renderReport();else render();}
function openVendors(){renderVendorList();document.getElementById('vendorsModal').classList.add('show');}
function closeVendors(){document.getElementById('vendorsModal').classList.remove('show');}
function renderVendorList(){
  var h='',i;
  for(i=0;i<vendors.length;i++){
    var v=vendors[i];
    h+='<div class="vrow'+(v.active?'':' retired')+'">'+
         '<div class="vmove"><button class="vmini" onclick="moveVendor('+v.id+',-1)">▲</button><button class="vmini" onclick="moveVendor('+v.id+',1)">▼</button></div>'+
         '<input class="vname-input" value="'+esc(v.name)+'" onchange="renameVendor('+v.id+',this)">'+
         '<button class="vretire'+(v.active?'':' restore')+'" onclick="setVendorActive('+v.id+','+(v.active?'false':'true')+')">'+(v.active?'Retire':'Restore')+'</button>'+
       '</div>';
  }
  document.getElementById('vendorList').innerHTML=h;
}
function moveVendor(id,dir){
  var i=idxOf(id);if(i<0)return;var j=i+dir;if(j<0||j>=vendors.length)return;
  var a=vendors[i],b=vendors[j],sa=a.sort_order,sb=b.sort_order;
  a.sort_order=sb;b.sort_order=sa;
  vendors.sort(function(x,y){return x.sort_order-y.sort_order;});
  renderVendorList();refreshViews();
  api('PATCH','flash_vendors','id=eq.'+a.id,{sort_order:a.sort_order},null);
  api('PATCH','flash_vendors','id=eq.'+b.id,{sort_order:b.sort_order},null);
}
function renameVendor(id,inp){
  var v=inp.value.trim(),o=findVendor(id);if(!o)return;
  if(!v){inp.value=o.name;return;}
  for(var i=0;i<vendors.length;i++){if(vendors[i].id!==id&&vendors[i].name.toLowerCase()===v.toLowerCase()){showToast('That vendor already exists',true);inp.value=o.name;return;}}
  o.name=v;refreshViews();
  api('PATCH','flash_vendors','id=eq.'+id,{name:v},function(r){if(!(r&&r.length))showToast('Rename failed — try again',true);});
}
function addVendor(){
  var el=document.getElementById('newVendorName'),v=el.value.trim(),i;if(!v){el.focus();return;}
  for(i=0;i<vendors.length;i++){if(vendors[i].name.toLowerCase()===v.toLowerCase()){showToast('That vendor already exists',true);return;}}
  var mx=0;for(i=0;i<vendors.length;i++)if(vendors[i].sort_order>mx)mx=vendors[i].sort_order;
  api('POST','flash_vendors',null,{location:LOCATION,name:v,sort_order:mx+10,active:true},function(r){
    if(r&&r.length){vendors.push(r[0]);vendors.sort(function(x,y){return x.sort_order-y.sort_order;});el.value='';renderVendorList();refreshViews();showToast('Vendor added',false);}
    else showToast('Add failed — try again',true);
  });
}
function setVendorActive(id,val){
  if(!val&&!confirm('Retire this vendor? It stays in past reports but won’t show for new daily entry.'))return;
  var o=findVendor(id);if(!o)return;o.active=val;
  renderVendorList();refreshViews();
  api('PATCH','flash_vendors','id=eq.'+id,{active:val},function(r){if(!(r&&r.length))showToast('Update failed — try again',true);});
}
document.getElementById('vendorsModal').addEventListener('click',function(e){if(e.target===this)closeVendors();});

/* ---- Excel export (vendored SheetJS) ---- */
function exportMonth(){
  if(typeof XLSX==='undefined'){showToast('Export not available — reload',true);return;}
  var mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var mm=computeMonth(),i,d;
  var shown=[];for(i=0;i<vendors.length;i++){if(vendors[i].active||(mm.vtot[vendors[i].id]&&mm.vtot[vendors[i].id].sum>0))shown.push(vendors[i]);}
  var sl=shown.length,MONEY='$#,##0.00',PCT='0.0%',aoa=[],money=[],pcts=[],gi=1+sl;
  aoa.push(['DAILY FLASH FOOD COST REPORT — TEMPEST']);
  aoa.push([mn[mm.m]+' '+mm.y]);
  var hdr=['DATE'];for(i=0;i<sl;i++)hdr.push(shown[i].name);hdr.push('GROSS COST','FOOD SALES','CUMUL COST','CUMUL SALES','DAILY %','RUNNING %');
  aoa.push(hdr);
  for(d=0;d<mm.days.length;d++){
    var day=mm.days[d],R=aoa.length,row=[(mm.m+1)+'/'+day.d];
    for(i=0;i<sl;i++){var a=num(day.pur[shown[i].id]);row.push(a>0?a:null);if(a>0)money.push([R,1+i]);}
    row.push(day.gross||null,day.sales||null,day.cumC||null,day.cumS||null,day.sales>0?day.gross/day.sales:null,day.cumS>0?day.cumC/day.cumS:null);
    if(day.gross)money.push([R,gi]);if(day.sales)money.push([R,gi+1]);if(day.cumC)money.push([R,gi+2]);if(day.cumS)money.push([R,gi+3]);
    if(day.sales>0)pcts.push([R,gi+4]);if(day.cumS>0)pcts.push([R,gi+5]);
    aoa.push(row);
  }
  var TR=aoa.length,trow=['TOTAL'];
  for(i=0;i<sl;i++){var vs=mm.vtot[shown[i].id].sum;trow.push(vs>0?vs:null);if(vs>0)money.push([TR,1+i]);}
  trow.push(mm.monthPurch,mm.monthSales,null,null,null,mm.monthSales>0?mm.monthPurch/mm.monthSales:null);
  money.push([TR,gi],[TR,gi+1]);if(mm.monthSales>0)pcts.push([TR,gi+5]);
  aoa.push(trow);aoa.push([]);
  aoa.push(['WEEKLY PERIOD SUMMARY']);
  aoa.push(['PERIOD','DATES','PURCHASES','FOOD SALES','FOOD COST %','AVG DAILY PURCH','AVG DAILY SALES','TOP VENDOR','TOP VENDOR $']);
  var periods=[[1,7],[8,14],[15,21],[22,28],[29,mm.N]],pi,md=String(mm.m+1).padStart(2,'0');
  for(pi=0;pi<periods.length;pi++){
    var a=periods[pi][0],b=Math.min(periods[pi][1],mm.N);if(a>mm.N)continue;
    var pPur=0,pSales=0,cnt=b-a+1,best='N/A',bestV=0,s;
    for(d=a;d<=b;d++){pPur+=mm.days[d-1].gross;pSales+=mm.days[d-1].sales;}
    for(i=0;i<sl;i++){s=0;for(d=a;d<=b;d++)s+=num(mm.days[d-1].pur[shown[i].id]);if(s>bestV){bestV=s;best=shown[i].name;}}
    var WR=aoa.length;
    aoa.push([pi+1,md+'/'+String(a).padStart(2,'0')+'-'+md+'/'+String(b).padStart(2,'0'),pPur,pSales,pSales>0?pPur/pSales:0,pPur/cnt,pSales/cnt,best,bestV]);
    money.push([WR,2],[WR,3],[WR,5],[WR,6],[WR,8]);pcts.push([WR,4]);
  }
  aoa.push([]);
  aoa.push(['VENDOR SPEND BREAKDOWN']);
  aoa.push(['VENDOR','TOTAL SPEND','% OF PURCHASES','DELIVERY COUNT','AVG DELIVERY $']);
  for(i=0;i<sl;i++){var t=mm.vtot[shown[i].id].sum,dv=mm.vtot[shown[i].id].deliv,VR=aoa.length;
    aoa.push([shown[i].name+(shown[i].active?'':' (retired)'),t,mm.monthPurch>0?t/mm.monthPurch:0,dv,dv>0?t/dv:0]);
    money.push([VR,1],[VR,4]);pcts.push([VR,2]);
  }
  var ws=XLSX.utils.aoa_to_sheet(aoa),enc=XLSX.utils.encode_cell,c;
  for(i=0;i<money.length;i++){c=ws[enc({r:money[i][0],c:money[i][1]})];if(c&&c.t==='n')c.z=MONEY;}
  for(i=0;i<pcts.length;i++){c=ws[enc({r:pcts[i][0],c:pcts[i][1]})];if(c&&c.t==='n')c.z=PCT;}
  var cols=[{wch:9}];for(i=0;i<sl;i++)cols.push({wch:11});for(i=0;i<6;i++)cols.push({wch:12});ws['!cols']=cols;
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,(mn[mm.m]+' '+mm.y).slice(0,31));
  XLSX.writeFile(wb,'Tempest_Flash_'+mn[mm.m]+'_'+mm.y+'.xlsx');
  showToast('Excel downloaded',false);
}

boot();
</script>

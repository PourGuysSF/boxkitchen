<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script>
  (function(){
    var raw = localStorage.getItem('boxkitchen_auth');
    var ts = raw ? parseInt(raw, 10) : 0;
    var TTL = 30 * 24 * 60 * 60 * 1000; // 30 days
    if (!ts || isNaN(ts) || (Date.now() - ts) > TTL) {
      window.location.replace('index.html');
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf6">
<title>Tempest Portion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="assets/kitchen.css?v=2026-08-22">
<!-- All styling lives in assets/kitchen.css (see docs/page-restyle.md).
     Portion Counts adds no page-specific rules. -->
</head>
<body>
<div class="header">
  <div class="header-row">
    <a class="home-link" href="index.html">← Home</a>
    <h1>Tempest <span>Portion</span></h1>
    <div class="mgr-toggle"><span>Manager</span><div class="mgr-switch" id="mgrSwitch" onclick="toggleMgr()"><div class="knob"></div></div></div>
  </div>
</div>
<div class="date-bar">
  <div class="date-display" id="dateDisplay"></div>
  <div class="date-sub">Daily portion count</div>
</div>
<div class="view-toggle">
  <button type="button" id="viewTodayBtn" class="active" onclick="setView('today')">Today</button>
  <button type="button" id="viewPrevBtn" onclick="setView('previous')">Previous</button>
</div>
<div class="name-bar" id="nameBar">
  <label>Counted by:</label>
  <select id="countedBy"><option value="">Select…</option></select>
</div>
<div class="prev-date-label" id="prevDateLabel"></div>
<div class="intro" id="introBar">Count on-hand portions against par, then save. Today's saved counts are pre-filled.</div>
<div id="appBody"><div class="loading"><div class="spinner"></div><p>Loading portion list...</p></div></div>
<div class="submit-bar">
  <div class="submit-summary" id="submitSummary">Enter counts and save</div>
  <button class="submit-btn" id="saveBtn" onclick="saveCounts()">Save Counts</button>
</div>
<!-- Manager PIN modal -->
<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>Enter Manager PIN</h3>
    <label>4-digit PIN</label>
    <input class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" autocomplete="off">
    <div class="modal-err" id="pinErr">Incorrect PIN</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePin()">Cancel</button>
      <button class="modal-btn save" onclick="submitPin()">Unlock</button>
    </div>
  </div>
</div>

<!-- Add/Edit Item modal -->
<div class="modal-bg" id="itemModal">
  <div class="modal">
    <h3 id="itemModalTitle">Edit Item</h3>
    <label>Name</label>
    <input type="text" id="itemName" autocomplete="off">
    <label>Station</label>
    <select id="itemStation" onchange="onStationChange()"></select>
    <input type="text" id="itemStationNew" style="display:none;margin-top:8px" placeholder="New station name" autocomplete="off">
    <label>Par (optional)</label>
    <input type="text" id="itemPar" autocomplete="off" placeholder="e.g. 4 pans, 2 lbs">
    <div class="modal-err" id="itemErr"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeItem()">Cancel</button>
      <button class="modal-btn save" id="itemSaveBtn" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
var SB='https://sxppuyarecqkgkrsrefc.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cHB1eWFyZWNxa2drcnNyZWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTA4MzAsImV4cCI6MjA5Mjk2NjgzMH0.GM8OfcR68_JjdPeQ3k7j6L3ulJFaeS1xnSLBcdtYXtU';
var items=[],staff=[],byItem={},prevByItem={},todayStr='',prevDate='',viewMode='today',itemsLoaded=false,st=null;
var MANAGER_PIN='4316',mgr=false,editId=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function api(m,t,q,d,cb){var x=new XMLHttpRequest();x.open(m,SB+'/rest/v1/'+t+(q?'?'+q:''));x.setRequestHeader('apikey',SK);x.setRequestHeader('Authorization','Bearer '+SK);if(d){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Prefer','return=representation');}x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}if(cb)cb(r,x.status);};x.onerror=function(){if(cb)cb(null);};x.send(d?JSON.stringify(d):null);}

function curDateStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function init(){
  var d=new Date(),mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  todayStr=curDateStr();
  document.getElementById('dateDisplay').textContent=dn[d.getDay()]+', '+mn[d.getMonth()]+' '+d.getDate();
  loadData();
}

// Always-on kitchen tablets: when the page wakes on a NEW day, reload as a
// fresh sheet so counts can't silently land on yesterday's date.
document.addEventListener('visibilitychange',function(){if(!document.hidden&&curDateStr()!==todayStr)init();});

function loadData(){
  api('GET','portion_items','location=eq.Tempest&active=eq.true&order=sort_order.asc',null,function(r){
    items=r||[];
    itemsLoaded=true;
    api('GET','staff','location=eq.Tempest&active=eq.true&order=shift.asc,sort_order.asc.nullslast,name.asc',null,function(r2){
      staff=r2||[];
      fillStaff();
      loadToday();
    });
  });
}

function loadToday(){
  document.getElementById('appBody').innerHTML='<div class="loading"><div class="spinner"></div><p>Loading…</p></div>';
  api('GET','portion_counts','location=eq.Tempest&count_date=eq.'+todayStr,null,function(r){
    byItem={};
    var rows=r||[];
    for(var i=0;i<rows.length;i++){byItem[rows[i].portion_item_id]={id:rows[i].id,on_hand_text:rows[i].on_hand_text||''};}
    render();
  });
}

function loadPrevious(){
  document.getElementById('appBody').innerHTML='<div class="loading"><div class="spinner"></div><p>Loading…</p></div>';
  api('GET','portion_counts','select=count_date&location=eq.Tempest&count_date=lt.'+todayStr+'&order=count_date.desc&limit=1',null,function(r){
    var rows=r||[];
    if(!rows.length){
      prevDate='';prevByItem={};
      document.getElementById('prevDateLabel').className='prev-date-label';
      document.getElementById('appBody').innerHTML='<div class="empty">No previous counts recorded yet.</div>';
      return;
    }
    prevDate=rows[0].count_date;
    api('GET','portion_counts','location=eq.Tempest&count_date=eq.'+prevDate,null,function(r2){
      prevByItem={};
      var prows=r2||[];
      for(var i=0;i<prows.length;i++){prevByItem[prows[i].portion_item_id]={on_hand_text:prows[i].on_hand_text||'',counted_by:prows[i].counted_by||''};}
      render();
    });
  });
}

function fmtPrevDate(s){
  var p=s.split('-');
  var d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}

function setView(mode){
  if(mode===viewMode)return;
  viewMode=mode;
  document.getElementById('viewTodayBtn').className=(mode==='today'?'active':'');
  document.getElementById('viewPrevBtn').className=(mode==='previous'?'active':'');
  var isToday=(mode==='today');
  document.getElementById('nameBar').style.display=isToday?'':'none';
  document.querySelector('.submit-bar').style.display=isToday?'':'none';
  document.getElementById('introBar').style.display=isToday?'':'none';
  document.getElementById('prevDateLabel').className='prev-date-label';
  if(isToday){loadToday();}else{loadPrevious();}
}

function fillStaff(){
  var sel=document.getElementById('countedBy'),h='<option value="">Select…</option>',seen={};
  for(var i=0;i<staff.length;i++){
    var n=staff[i].name;
    if(!n||seen[n])continue;              // one entry per person, not one per shift
    seen[n]=1;
    h+='<option value="'+esc(n)+'">'+esc(n)+'</option>';
  }
  sel.innerHTML=h;
}

function render(){
  var body=document.getElementById('appBody');
  if(!items.length){body.innerHTML='<div class="empty">No portion items found.</div>';return;}
  var isPrev=(viewMode==='previous');
  if(isPrev){
    var lbl=document.getElementById('prevDateLabel');
    var commonBy='';
    for(var k in prevByItem){if(prevByItem[k].counted_by){commonBy=prevByItem[k].counted_by;break;}}
    lbl.innerHTML='Showing: <strong>'+esc(fmtPrevDate(prevDate))+'</strong>'+(commonBy?'<span class="by">· Counted by '+esc(commonBy)+'</span>':'');
    lbl.className='prev-date-label show';
  }
  var groups=[],seen={};
  for(var i=0;i<items.length;i++){var s=items[i].station||'Other';if(!seen[s]){seen[s]=true;groups.push(s);}}
  var h='';
  for(var g=0;g<groups.length;g++){
    var grp=groups[g];
    h+='<div class="cat-header"><div class="cat-label">'+esc(grp.toUpperCase())+'</div></div>';
    for(var i=0;i<items.length;i++){
      var it=items[i];
      if((it.station||'Other')!==grp)continue;
      var hasPar=it.par_text!=null&&String(it.par_text).trim()!=='';
      var par=hasPar?'<div class="count-par">Par: '+esc(it.par_text)+'</div>':'';
      var mgrActions='<div class="row-mgr-actions"><button class="mgr-edit-btn" onclick="openItem(\'edit\','+it.id+')">Edit</button><button class="mgr-retire-btn" onclick="retireItem('+it.id+')">Retire</button></div>';
      if(isPrev){
        var p=prevByItem[it.id],pv=p?(p.on_hand_text||'').trim():'';
        var by=(p&&p.counted_by)?'<div class="count-by">Counted by '+esc(p.counted_by)+'</div>':'';
        h+='<div class="count-row readonly">'
          +'<div class="count-info"><div class="count-name">'+esc(it.name)+'</div>'+par+by+'</div>'
          +'<div class="count-value'+(pv?'':' blank')+'">'+(pv?esc(pv):'—')+'</div>'
          +mgrActions
          +'</div>';
      }else{
        var saved=byItem[it.id]?byItem[it.id].on_hand_text:'';
        h+='<div class="count-row">'
          +'<div class="count-info"><div class="count-name">'+esc(it.name)+'</div>'+par+'</div>'
          +'<input class="count-input'+(saved?' filled':'')+'" type="text" inputmode="text" autocomplete="off" data-item-id="'+it.id+'" data-orig="'+esc(saved)+'" value="'+esc(saved)+'" placeholder="count" oninput="onInput(this)">'
          +mgrActions
          +'</div>';
      }
    }
  }
  h+='<div class="mgr-add-bar"><button class="mgr-add-btn" onclick="openItem(\'add\')">+ Add new item</button></div>';
  if(mgr)h='<div class="manager-mode">'+h+'</div>';
  body.innerHTML=h;
}

function onInput(el){
  if(el.value.trim()!==''){el.classList.add('filled');}else{el.classList.remove('filled');}
}

function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=(type==='success'?'✓ ':'⚠ ')+msg;
  t.className='toast show '+(type||'success');
  clearTimeout(st);st=setTimeout(function(){t.className='toast';},1800);
}

function saveCounts(){
  var name=document.getElementById('countedBy').value;
  if(!name){showToast('Select who is counting','error');return;}
  // Midnight guard: if the date rolled while this sheet was open, these counts
  // belong to the NEW day — never patch yesterday's rows.
  if(curDateStr()!==todayStr){todayStr=curDateStr();byItem={};}
  var inputs=document.querySelectorAll('.count-input'),changed=[];
  for(var i=0;i<inputs.length;i++){
    var el=inputs[i],val=el.value.trim(),orig=(el.getAttribute('data-orig')||'').trim();
    if(val===orig)continue;
    var itemId=parseInt(el.getAttribute('data-item-id'),10),existing=byItem[itemId];
    if(!existing&&val==='')continue;
    changed.push({el:el,itemId:itemId,val:val,existingId:existing?existing.id:null});
  }
  if(!changed.length){showToast('No changes to save','success');return;}
  var btn=document.getElementById('saveBtn');btn.disabled=true;
  var pending=changed.length,done=0,fails=0;
  changed.forEach(function(c){
    var cb=function(r){
      // Success ONLY when a row actually came back — a PATCH that matched 0
      // rows returns [] with a 2xx and must count as a failure, not a save.
      if(Array.isArray(r)&&r.length){
        byItem[c.itemId]={id:r[0].id,on_hand_text:r[0].on_hand_text||''};
        c.el.setAttribute('data-orig',c.val);
      }else{fails++;}
      done++;
      if(done===pending){
        btn.disabled=false;
        if(fails>0)showToast(fails+' count'+(fails>1?'s':'')+' failed to save','error');
        else showToast('Counts saved','success');
      }
    };
    if(c.existingId){api('PATCH','portion_counts','id=eq.'+c.existingId,{on_hand_text:c.val,counted_by:name},cb);}
    else{api('POST','portion_counts',null,{portion_item_id:c.itemId,count_date:todayStr,on_hand_text:c.val,counted_by:name,location:'Tempest'},function(r,status){
      if(Array.isArray(r)&&r.length){cb(r);return;}
      if(status!==409){cb(null);return;}
      // 409: another device already created this item's row today — adopt + PATCH.
      api('GET','portion_counts','location=eq.Tempest&count_date=eq.'+todayStr+'&portion_item_id=eq.'+c.itemId,null,function(rows){
        if(!rows||!rows.length){cb(null);return;}
        api('PATCH','portion_counts','id=eq.'+rows[0].id,{on_hand_text:c.val,counted_by:name},cb);
      });
    });}
  });
}

// ── MANAGER MODE ──
function toggleMgr(){
  if(mgr){mgr=false;document.getElementById('mgrSwitch').classList.remove('on');render();return;}
  if(sessionStorage.getItem('boxkitchen_mgr')==='1'){mgr=true;document.getElementById('mgrSwitch').classList.add('on');render();return;}
  openPin();
}
function openPin(){
  var inp=document.getElementById('pinInput');inp.value='';
  document.getElementById('pinErr').classList.remove('show');
  document.getElementById('pinModal').classList.add('show');
  setTimeout(function(){inp.focus();},100);
}
function closePin(){document.getElementById('pinModal').classList.remove('show');}
function submitPin(){
  var v=(document.getElementById('pinInput').value||'').trim();
  if(v===MANAGER_PIN){
    sessionStorage.setItem('boxkitchen_mgr','1');
    closePin();
    mgr=true;document.getElementById('mgrSwitch').classList.add('on');render();
    showToast('Manager mode unlocked','success');
  }else{
    var e=document.getElementById('pinErr');e.classList.add('show');
    var inp=document.getElementById('pinInput');inp.value='';inp.focus();
  }
}
function openItem(mode,id){
  editId=null;
  document.getElementById('itemErr').classList.remove('show');
  var stations=[],seen={};
  for(var i=0;i<items.length;i++){var s=items[i].station||'Other';if(!seen[s]){seen[s]=true;stations.push(s);}}
  var sel=document.getElementById('itemStation');
  var h='';
  for(var i=0;i<stations.length;i++)h+='<option value="'+esc(stations[i])+'">'+esc(stations[i])+'</option>';
  h+='<option value="__other__">+ Other (type new)…</option>';
  sel.innerHTML=h;
  var nw=document.getElementById('itemStationNew');
  nw.style.display='none';nw.value='';
  if(mode==='edit'){
    var it=null;for(var i=0;i<items.length;i++)if(items[i].id===id){it=items[i];break;}
    if(!it)return;
    editId=id;
    document.getElementById('itemModalTitle').textContent='Edit Item';
    document.getElementById('itemName').value=it.name||'';
    var stn=it.station||'Other',found=false;
    for(var i=0;i<sel.options.length;i++)if(sel.options[i].value===stn){sel.value=stn;found=true;break;}
    if(!found){sel.value='__other__';nw.style.display='block';nw.value=stn;}
    document.getElementById('itemPar').value=it.par_text||'';
  }else{
    document.getElementById('itemModalTitle').textContent='Add Item';
    document.getElementById('itemName').value='';
    document.getElementById('itemPar').value='';
    if(stations.length){sel.value=stations[0];}else{sel.value='__other__';nw.style.display='block';}
  }
  document.getElementById('itemModal').classList.add('show');
}
function onStationChange(){
  var sel=document.getElementById('itemStation'),nw=document.getElementById('itemStationNew');
  if(sel.value==='__other__'){nw.style.display='block';setTimeout(function(){nw.focus();},50);}else{nw.style.display='none';}
}
function closeItem(){document.getElementById('itemModal').classList.remove('show');editId=null;}
function saveItem(){
  var name=(document.getElementById('itemName').value||'').trim();
  var sel=document.getElementById('itemStation'),stn=sel.value;
  if(stn==='__other__')stn=(document.getElementById('itemStationNew').value||'').trim();
  var par=(document.getElementById('itemPar').value||'').trim();
  var err=document.getElementById('itemErr');
  if(!name){err.textContent='Name is required';err.classList.add('show');return;}
  if(!stn){err.textContent='Station is required';err.classList.add('show');return;}
  err.classList.remove('show');
  var payload={name:name,station:stn,par_text:par||null};
  var btn=document.getElementById('itemSaveBtn');btn.disabled=true;
  if(editId){
    api('PATCH','portion_items','id=eq.'+editId,payload,function(r){
      btn.disabled=false;
      if(r&&r.length){closeItem();showToast('Item saved','success');loadData();}
      else{err.textContent='Save failed — try again';err.classList.add('show');}
    });
  }else{
    var maxS=0;for(var i=0;i<items.length;i++){var s=items[i].sort_order||0;if(s>maxS)maxS=s;}
    payload.location='Tempest';payload.active=true;payload.sort_order=maxS+10;
    api('POST','portion_items',null,payload,function(r){
      btn.disabled=false;
      if(r&&r.length){closeItem();showToast('Item added','success');loadData();}
      else{err.textContent='Add failed — try again';err.classList.add('show');}
    });
  }
}
function retireItem(id){
  if(!confirm('Retire this item? It will no longer appear in the count.'))return;
  api('PATCH','portion_items','id=eq.'+id,{active:false},function(r){
    if(r&&r.length){showToast('Item retired','success');loadData();}
    else{showToast('Retire failed — try again','error');}
  });
}
document.getElementById('pinModal').addEventListener('click',function(e){if(e.target===this)closePin();});
document.getElementById('itemModal').addEventListener('click',function(e){if(e.target===this)closeItem();});
document.getElementById('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitPin();}});

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script>
  (function(){
    var raw = localStorage.getItem('boxkitchen_auth');
    var ts = raw ? parseInt(raw, 10) : 0;
    var TTL = 30 * 24 * 60 * 60 * 1000; // 30 days
    if (!ts || isNaN(ts) || (Date.now() - ts) > TTL) {
      window.location.replace('index.html');
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf6">
<title>Tempest Notes</title>
<link rel="stylesheet" href="assets/kitchen.css">
<style>
  /* Kitchen Notes — note-card rules only. Everything else lives in
     assets/kitchen.css. */

  /* Category hues, retuned for paper. The originals (#ef4444 #f59e0b
     #3b82f6 #e85d3a #8a8a8a) were picked against a near-black background
     and read thin and shrill on cream, so each is darkened/desaturated to
     hold its weight. Recipe moves off tomato so the accent keeps meaning
     one thing. Urgent is the darkest red and gets a wider spine. */
  :root{--cat-urgent:#b42318;--cat-equipment:#a25c00;--cat-supplies:#22457f;--cat-recipe:#5f4589;--cat-other:#6a6a6a}

  .feed{padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto}

  .note-card{background:var(--paper);border:1px solid var(--ink);border-left:5px solid var(--hair);border-radius:6px;padding:14px 16px}
  .note-card.cat-urgent{border-left:7px solid var(--cat-urgent)}
  .note-card.cat-urgent .note-cat{color:var(--cat-urgent)}
  .note-card.cat-equipment{border-left-color:var(--cat-equipment)}
  .note-card.cat-supplies{border-left-color:var(--cat-supplies)}
  .note-card.cat-recipe{border-left-color:var(--cat-recipe)}
  .note-card.cat-other{border-left-color:var(--cat-other)}

  .note-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .note-cat{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink)}
  .note-time{font-size:0.75rem;color:var(--grey);white-space:nowrap}
  .note-body{font-size:0.95rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .note-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
  .note-by{font-size:0.8rem;color:var(--grey)}

  /* Resolved: filed, not faded — press fill and a hairline instead of the
     old 55% opacity, which washes out on paper. */
  .note-card.resolved{background:var(--press);border-color:var(--hair);border-left-color:var(--faint)}
  .note-card.resolved.cat-urgent{border-left-color:var(--faint)}
  .note-card.resolved .note-cat{color:var(--faint)}
  .note-card.resolved .note-time,.note-card.resolved .note-by{color:var(--faint)}
  .note-card.resolved .note-body{text-decoration:line-through;color:var(--grey)}

  /* Done is solid ink, not green */
  .resolve-btn{padding:8px 14px;min-height:40px;background:transparent;border:1px solid var(--ink);border-radius:6px;color:var(--ink);font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;flex-shrink:0}
  .resolve-btn:active{background:var(--ink);color:var(--paper)}
  .resolved-tag{text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .resolved-tag span{display:block;font-family:'Barlow',sans-serif;font-size:0.72rem;font-weight:400;letter-spacing:0;text-transform:none;color:var(--grey);margin-top:2px}

  .note-mgr-actions{display:none;gap:6px;margin-left:auto}
  .manager-mode .note-mgr-actions{display:flex}
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <a class="home-link" href="index.html">← Home</a>
    <h1>Tempest <span>Notes</span></h1>
    <button class="new-btn" onclick="openNote()">+ New Note</button>
  </div>
  <div class="filter-toggle">
    <button class="filter-btn active" onclick="setFilter('open')">Open</button>
    <button class="filter-btn" onclick="setFilter('resolved')">Resolved</button>
    <button class="filter-btn" onclick="setFilter('all')">All</button>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-top:8px">
    <div class="mgr-toggle"><span>Manager</span><div class="mgr-switch" id="mgrSwitch" onclick="toggleMgr()"><div class="knob"></div></div></div>
  </div>
</div>

<div id="appBody"><div class="loading"><div class="spinner"></div><p>Loading notes...</p></div></div>

<!-- New Note Modal -->
<div class="modal-bg" id="noteModal">
  <div class="modal">
    <h3>New Note</h3>
    <label>Category</label>
    <div class="cat-picker" id="catPicker"></div>
    <label>Note</label>
    <textarea id="noteBody" placeholder="What's going on? (e.g. Lowboy #2 is down, 86 the salmon...)"></textarea>
    <label>Posted by</label>
    <select id="noteBy"><option value="">— Select name —</option></select>
    <div class="modal-err" id="noteErr"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeNote()">Cancel</button>
      <button class="modal-btn save" id="noteSaveBtn" onclick="saveNote()">Save Note</button>
    </div>
  </div>
</div>

<!-- Manager PIN modal -->
<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>Enter Manager PIN</h3>
    <label>4-digit PIN</label>
    <input class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" autocomplete="off">
    <div class="modal-err" id="pinErr">Incorrect PIN</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePin()">Cancel</button>
      <button class="modal-btn save" onclick="submitPin()">Unlock</button>
    </div>
  </div>
</div>

<!-- Edit Note Modal -->
<div class="modal-bg" id="editNoteModal">
  <div class="modal">
    <h3>Edit Note</h3>
    <label>Category</label>
    <div class="cat-picker" id="editCatPicker"></div>
    <label>Note</label>
    <textarea id="editNoteBody"></textarea>
    <div class="modal-err" id="editNoteErr"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeEditNote()">Cancel</button>
      <button class="modal-btn save" id="editNoteSaveBtn" onclick="saveEditNote()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓ Saved</div>

<script>
var SB='https://sxppuyarecqkgkrsrefc.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cHB1eWFyZWNxa2drcnNyZWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTA4MzAsImV4cCI6MjA5Mjk2NjgzMH0.GM8OfcR68_JjdPeQ3k7j6L3ulJFaeS1xnSLBcdtYXtU';
var CATS=[
  {key:'urgent',emoji:'🚨',label:'Urgent'},
  {key:'equipment',emoji:'🔧',label:'Equipment'},
  {key:'supplies',emoji:'📋',label:"Supplies & 86'd"},
  {key:'recipe',emoji:'🍳',label:'Recipe issue'},
  {key:'other',emoji:'💬',label:'Other'}
];
var notes=[],staffNames=[],filter='open',selCat='other',st=null;
var MANAGER_PIN='4316',mgr=false,editSelCat='other',editingNoteId=null;

function api(m,t,q,d,cb){var x=new XMLHttpRequest();x.open(m,SB+'/rest/v1/'+t+(q?'?'+q:''));x.setRequestHeader('apikey',SK);x.setRequestHeader('Authorization','Bearer '+SK);if(d){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Prefer','return=representation');}x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}if(cb)cb(r);};x.onerror=function(){if(cb)cb(null);};x.send(d?JSON.stringify(d):null);}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}

function catInfo(k){for(var i=0;i<CATS.length;i++)if(CATS[i].key===k)return CATS[i];return CATS[CATS.length-1];}

function timeAgo(iso){
  if(!iso)return '';
  var then=new Date(iso),now=new Date(),diff=(now-then)/1000;
  if(diff<60)return 'just now';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  var d1=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var d2=new Date(then.getFullYear(),then.getMonth(),then.getDate());
  var days=Math.round((d1-d2)/86400000);
  if(days===1)return 'yesterday';
  if(days<7)return days+'d ago';
  var mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mn[then.getMonth()]+' '+then.getDate();
}

function init(){buildCatPicker();loadStaff();loadNotes();}

function loadStaff(){
  api('GET','staff','location=eq.Tempest&active=eq.true&order=shift.asc,sort_order.asc.nullslast,name.asc',null,function(r){
    var seen={};staffNames=[];
    if(r&&r.length)for(var i=0;i<r.length;i++){var n=r[i].name;if(n&&!seen[n]){seen[n]=true;staffNames.push(n);}}
    var sel=document.getElementById('noteBy');
    for(var i=0;i<staffNames.length;i++){var o=document.createElement('option');o.value=staffNames[i];o.textContent=staffNames[i];sel.appendChild(o);}
  });
}

function loadNotes(){
  api('GET','notes','location=eq.Tempest&order=created_at.desc',null,function(r){
    notes=r&&r.length?r:[];render();
  });
}

function setFilter(f){
  filter=f;
  var b=document.querySelectorAll('.filter-btn'),idx={open:0,resolved:1,all:2}[f];
  for(var i=0;i<b.length;i++)b[i].classList.toggle('active',i===idx);
  render();
}

function render(){
  var list=notes.filter(function(n){
    if(filter==='open')return n.status!=='resolved';
    if(filter==='resolved')return n.status==='resolved';
    return true;
  });
  if(!list.length){
    var word=filter==='all'?'':filter+' ';
    document.getElementById('appBody').innerHTML='<div class="empty">No '+word+'notes yet.</div>';
    return;
  }
  var h='<div class="feed">';
  for(var i=0;i<list.length;i++)h+=card(list[i]);
  h+='</div>';
  if(mgr)h='<div class="manager-mode">'+h+'</div>';
  document.getElementById('appBody').innerHTML=h;
}

function card(n){
  var c=catInfo(n.category),resolved=n.status==='resolved';
  var h='<div class="note-card cat-'+c.key+(resolved?' resolved':'')+'">';
  h+='<div class="note-top"><span class="note-cat">'+c.emoji+' '+esc(c.label)+'</span><span class="note-time">'+esc(timeAgo(n.created_at))+'</span></div>';
  h+='<div class="note-body">'+esc(n.body)+'</div>';
  h+='<div class="note-meta">';
  h+='<span class="note-by">'+(n.posted_by?('— '+esc(n.posted_by)):'— Anonymous')+'</span>';
  if(resolved){
    h+='<span class="resolved-tag">✓ Resolved'+(n.resolved_by?'<span>by '+esc(n.resolved_by)+'</span>':'')+'</span>';
  }else{
    h+='<button class="resolve-btn" onclick="resolveNote('+n.id+')">Mark resolved</button>';
  }
  h+='<div class="note-mgr-actions"><button class="mgr-edit-btn" onclick="openEditNote('+n.id+')">Edit</button><button class="mgr-delete-btn" onclick="deleteNote('+n.id+')">Delete</button></div>';
  h+='</div></div>';
  return h;
}

function resolveNote(id){
  var name=prompt("Who's resolving this note?","");
  if(name===null)return;
  name=name.trim();
  api('PATCH','notes','id=eq.'+id,{status:'resolved',resolved_at:new Date().toISOString(),resolved_by:name||null},function(r){
    if(r&&r.length){
      for(var i=0;i<notes.length;i++)if(notes[i].id===id)notes[i]=r[0];
      toast('Note resolved');render();
    }else{
      toast('Could not resolve — try again');
    }
  });
}

// ── NEW NOTE MODAL ──
function buildCatPicker(){
  var p=document.getElementById('catPicker'),h='';
  for(var i=0;i<CATS.length;i++){
    h+='<div class="cat-opt'+(CATS[i].key===selCat?' sel':'')+'" data-cat="'+CATS[i].key+'" onclick="pickCat(\''+CATS[i].key+'\')">'+CATS[i].emoji+' '+esc(CATS[i].label)+'</div>';
  }
  p.innerHTML=h;
}
function pickCat(k){
  selCat=k;
  var o=document.querySelectorAll('.cat-opt');
  for(var i=0;i<o.length;i++)o[i].classList.toggle('sel',o[i].getAttribute('data-cat')===k);
}
function openNote(){
  selCat='other';buildCatPicker();
  document.getElementById('noteBody').value='';
  document.getElementById('noteBy').value='';
  hideErr();
  document.getElementById('noteModal').classList.add('show');
  setTimeout(function(){document.getElementById('noteBody').focus();},100);
}
function closeNote(){document.getElementById('noteModal').classList.remove('show');}
function showErr(m){var e=document.getElementById('noteErr');e.textContent=m;e.classList.add('show');}
function hideErr(){document.getElementById('noteErr').classList.remove('show');}

function saveNote(){
  var body=document.getElementById('noteBody').value.trim();
  var by=document.getElementById('noteBy').value;
  if(!body){showErr('Please enter a note.');document.getElementById('noteBody').focus();return;}
  hideErr();
  var btn=document.getElementById('noteSaveBtn');btn.disabled=true;
  api('POST','notes',null,{location:'Tempest',category:selCat,body:body,posted_by:by||null,status:'open'},function(r){
    btn.disabled=false;
    if(r&&r.length){
      notes.unshift(r[0]);
      closeNote();
      if(filter==='resolved')setFilter('open');else render();
      toast('Note posted');
    }else{
      showErr('Could not save note. Please try again.');
    }
  });
}

function toast(msg){var t=document.getElementById('toast');t.textContent='✓ '+msg;t.classList.add('show');clearTimeout(st);st=setTimeout(function(){t.classList.remove('show');},1500);}

document.getElementById('noteModal').addEventListener('click',function(e){if(e.target===this)closeNote();});

// ── MANAGER MODE ──
function toggleMgr(){
  if(mgr){mgr=false;document.getElementById('mgrSwitch').classList.remove('on');render();return;}
  if(sessionStorage.getItem('boxkitchen_mgr')==='1'){mgr=true;document.getElementById('mgrSwitch').classList.add('on');render();return;}
  openPin();
}
function openPin(){
  var inp=document.getElementById('pinInput');inp.value='';
  document.getElementById('pinErr').classList.remove('show');
  document.getElementById('pinModal').classList.add('show');
  setTimeout(function(){inp.focus();},100);
}
function closePin(){document.getElementById('pinModal').classList.remove('show');}
function submitPin(){
  var v=(document.getElementById('pinInput').value||'').trim();
  if(v===MANAGER_PIN){
    sessionStorage.setItem('boxkitchen_mgr','1');
    closePin();
    mgr=true;document.getElementById('mgrSwitch').classList.add('on');render();
    toast('Manager mode unlocked');
  }else{
    var e=document.getElementById('pinErr');e.classList.add('show');
    var inp=document.getElementById('pinInput');inp.value='';inp.focus();
  }
}
function buildEditCatPicker(){
  var p=document.getElementById('editCatPicker'),h='';
  for(var i=0;i<CATS.length;i++){
    h+='<div class="cat-opt'+(CATS[i].key===editSelCat?' sel':'')+'" data-cat="'+CATS[i].key+'" onclick="pickEditCat(\''+CATS[i].key+'\')">'+CATS[i].emoji+' '+esc(CATS[i].label)+'</div>';
  }
  p.innerHTML=h;
}
function pickEditCat(k){
  editSelCat=k;
  var o=document.querySelectorAll('#editCatPicker .cat-opt');
  for(var i=0;i<o.length;i++)o[i].classList.toggle('sel',o[i].getAttribute('data-cat')===k);
}
function openEditNote(id){
  var n=null;for(var i=0;i<notes.length;i++)if(notes[i].id===id){n=notes[i];break;}
  if(!n)return;
  editingNoteId=id;
  editSelCat=n.category||'other';
  buildEditCatPicker();
  document.getElementById('editNoteBody').value=n.body||'';
  document.getElementById('editNoteErr').classList.remove('show');
  document.getElementById('editNoteModal').classList.add('show');
  setTimeout(function(){document.getElementById('editNoteBody').focus();},100);
}
function closeEditNote(){document.getElementById('editNoteModal').classList.remove('show');editingNoteId=null;}
function saveEditNote(){
  if(!editingNoteId)return;
  var body=(document.getElementById('editNoteBody').value||'').trim();
  var err=document.getElementById('editNoteErr');
  if(!body){err.textContent='Please enter a note.';err.classList.add('show');return;}
  err.classList.remove('show');
  var btn=document.getElementById('editNoteSaveBtn');btn.disabled=true;
  api('PATCH','notes','id=eq.'+editingNoteId,{body:body,category:editSelCat},function(r){
    btn.disabled=false;
    if(r&&r.length){
      for(var i=0;i<notes.length;i++)if(notes[i].id===editingNoteId){notes[i]=r[0];break;}
      closeEditNote();render();toast('Note saved');
    }else{
      err.textContent='Save failed — try again';err.classList.add('show');
    }
  });
}
function deleteNote(id){
  if(!confirm('Delete this note permanently?'))return;
  api('DELETE','notes','id=eq.'+id,null,function(r){
    if(r && r.code){toast('Delete failed — try again');return;}
    // Confirm the row is actually gone before claiming success. A blocked
    // delete (e.g. a missing RLS delete policy) returns no error but changes
    // nothing, which used to show a false "deleted" that reappeared on reload.
    api('GET','notes','id=eq.'+id+'&select=id',null,function(chk){
      if(chk && chk.length){toast("Delete didn't save — check permissions");return;}
      notes=notes.filter(function(n){return n.id!==id;});
      render();toast('Note deleted');
    });
  });
}
document.getElementById('pinModal').addEventListener('click',function(e){if(e.target===this)closePin();});
document.getElementById('editNoteModal').addEventListener('click',function(e){if(e.target===this)closeEditNote();});
document.getElementById('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitPin();}});

init();
</script>
</body>
</html>

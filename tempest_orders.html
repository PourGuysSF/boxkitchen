<!DOCTYPE html>
<html lang="en">
<head>

<script>
  (function(){
    var raw = localStorage.getItem('boxkitchen_auth');
    var ts = raw ? parseInt(raw, 10) : 0;
    var TTL = 30 * 24 * 60 * 60 * 1000; // 30 days
    if (!ts || isNaN(ts) || (Date.now() - ts) > TTL) {
      window.location.replace('index.html');
    }
  })();
</script>

<style>
  /* ═══════════════════════════════════════════════════════════
     Tempest Orders — page-level overrides only.

     Converted in two passes: 7a took everything visible at rest,
     7b the manager and modal surfaces. Both are done — every
     component now lives in assets/kitchen.css and the rules kept
     here are genuine page-level overrides.
     ═══════════════════════════════════════════════════════════ */

  /* ── 7a: CONVERTED ─────────────────────────────────────────── */

  /* clears the fixed submit bar plus the note FAB stacked above it */
  body{padding-bottom:144px}
  /* "Tempest Orders" is the longest title in the app; at the shared 1.4rem
     it wraps to two lines between the home link and the manager toggle.
     The old page fit it on one line, so it keeps one here too. */
  .header h1{font-size:1.2rem;white-space:nowrap}
  .name-bar input{flex:1;min-width:0;min-height:44px;padding:8px 12px;background:var(--paper);border:1px solid var(--ink);border-radius:6px;color:var(--ink);font-family:var(--font);font-size:0.9rem;outline:none;-webkit-appearance:none;appearance:none}
  .name-bar input:focus{border-color:var(--tomato);box-shadow:0 0 0 2px rgba(232,93,58,.2)}
  .name-bar input::placeholder{color:var(--faint)}
  /* delivery day reads better as a highlighter than as yellow text */
  .delivery-info{font-family:var(--font-cond);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--yellow);color:var(--ink);padding:2px 6px}

  /* VENDOR SECTION — same voice as prep's .section-header */
  .vendor-section{border-bottom:1px solid var(--hair)}
  .vendor-header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--press);cursor:pointer}
  .vendor-header:active{background:var(--hair)}
  .vendor-name{font-family:var(--font-cond);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  /* Vendor hues retuned for cream, reusing the values already proven on
     Notes and Prep. Purple had no equivalent in the new palette; it takes
     the same plum those pages use. */
  .vendor-name.birite{color:#22457f}
  .vendor-name.dairy{color:#5f4589}
  .vendor-name.schmitz{color:var(--tomato)}
  .vendor-name.asia{color:#a25c00}
  .vendor-name.cooks{color:#2d6a4f}
  .vendor-right{display:flex;align-items:center;gap:8px}
  .vendor-count{font-family:var(--font-cond);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--grey);background:var(--paper);border:1px solid var(--hair);padding:2px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
  /* "this vendor has items on the order" — weight and border, not hue */
  .vendor-count.has{color:var(--ink);font-weight:700;border-color:var(--ink)}
  .vendor-section.open .chevron{transform:rotate(180deg)}
  .vendor-body{display:none}
  .vendor-section.open .vendor-body{display:block}

  /* ITEM HEADER STRIP — .ih-* widths must stay identical to the .item-*
     widths below or the columns stop lining up */
  .item-header{display:flex;align-items:center;padding:6px 18px;background:var(--press);border-bottom:1px solid var(--hair)}
  .item-header span{font-family:var(--font-cond);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
  .ih-name{flex:1}
  .ih-par{width:50px;text-align:center}
  .ih-unit{width:42px;text-align:center}
  .ih-qty{width:58px;text-align:center}

  /* ITEM ROW */
  .item-row{display:flex;align-items:center;padding:8px 18px;border-bottom:1px solid var(--hair)}
  /* subtle — a whole tinted row gets loud fast on paper */
  .item-row.has-qty{background:var(--press)}
  .item-name{flex:1;min-width:0;font-size:0.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-par{width:50px;text-align:center;font-size:0.78rem;font-weight:600;color:var(--grey);font-variant-numeric:tabular-nums}
  .item-unit{width:42px;text-align:center;font-size:0.72rem;color:var(--grey)}
  .item-qty{width:58px}
  .qty-input{width:100%;padding:5px;background:var(--paper);border:1px solid var(--hair);border-radius:6px;color:var(--ink);font-family:var(--font);font-size:0.85rem;font-variant-numeric:tabular-nums;text-align:center;outline:none;-webkit-appearance:none;appearance:none}
  .qty-input:focus{border-color:var(--tomato);box-shadow:0 0 0 2px rgba(232,93,58,.2)}
  /* the same reading as .count-input.filled and .money-wrap.filled */
  .qty-input.filled{border:1.5px solid var(--ink);background:var(--press);font-weight:600}
  /* locked: faint on paper rather than 55% opacity, which washes out */
  .qty-input.locked{background:var(--paper);border-color:var(--hair);color:var(--faint);cursor:not-allowed}
  .qty-input.locked.filled{border:1px solid var(--hair);background:var(--paper);font-weight:400}
  /* information, not an error — ink, never tomato */
  .lock-banner{margin:10px 18px;padding:10px 14px;background:var(--paper);border:1px solid var(--ink);border-radius:6px;color:var(--ink);font-size:0.85rem;font-weight:600;line-height:1.4}

  /* PREVIOUS ORDER CARDS */
  .prev-card{margin:14px 18px;background:var(--paper);border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .prev-card-head{padding:10px 14px;background:var(--press);border-bottom:1px solid var(--ink);font-size:0.85rem;font-weight:600;color:var(--ink)}
  .prev-card-head .by{display:block;margin-top:2px;color:var(--grey);font-size:0.75rem;font-weight:400}
  .prev-vendor{padding:8px 14px 4px;font-family:var(--font-cond);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
  .prev-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;border-top:1px solid var(--hair);font-size:0.85rem}
  .prev-item .pi-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prev-item .pi-unit{color:var(--grey);font-size:0.72rem}
  /* the number that matters on a previous order */
  .prev-item .pi-qty{min-width:42px;text-align:right;font-weight:700;color:var(--tomato);font-variant-numeric:tabular-nums}
  .prev-empty{padding:60px 20px;text-align:center;color:var(--grey);font-size:0.9rem;font-style:italic}

  /* the FAB stacks above the fixed submit bar on this page */
  .nb-fab{bottom:84px}

  /* ── 7b: page-level overrides ──────────────────────────────── */

  /* Orders is the only page with BOTH a fixed submit bar and the note
     FAB stacked above it (hence body padding-bottom:144px). The shared
     .nb-toast sits at 90px, which is behind that bar here. */
  .nb-toast{bottom:160px}
  /* the row's move buttons need clearance from the item name */
  .mgr-controls{margin-right:6px}
</style>
<script src="vendor/sortablejs-1.15.7.min.js"></script>
</head>
<body>
<div class="header">
  <div class="header-row">
    <a class="home-link" href="index.html">← Home</a>
    <h1>Tempest <span>Orders</span></h1>
    <div class="mgr-toggle"><span>Manager</span><div class="mgr-switch" id="mgrSwitch" onclick="toggleMgr()"><div class="knob"></div></div></div>
  </div>
  <div class="header-row" style="justify-content:flex-end;gap:8px;margin-bottom:0"><button class="manage-units-btn" id="manageShelvesBtn" onclick="openShelvesModal()" style="margin-top:6px">⚙ Manage shelves</button><button class="manage-units-btn" id="manageUnitsBtn" onclick="openUnitsModal()" style="margin-top:6px">⚙ Manage units</button></div>
  <div class="guide-toggle">
    <button class="guide-btn active" onclick="setGuide('birite')">BIRITE & DAIRY</button>
    <button class="guide-btn" onclick="setGuide('produce')">PRODUCE & PROTEIN</button>
  </div>
</div>
<div class="view-toggle">
  <button type="button" id="viewTodayBtn" class="active" onclick="setView('today')">Today</button>
  <button type="button" id="viewPrevBtn" onclick="setView('previous')">Previous</button>
</div>
<div class="date-bar">
  <div class="date-display" id="dateDisplay"></div>
  <div class="delivery-info" id="deliveryInfo"></div>
</div>
<div class="prev-date-label" id="prevDateLabel"></div>
<div class="name-bar" id="nameBar">
  <label>Filled by:</label>
  <input type="text" id="filledBy" placeholder="Your name">
</div>
<div id="appBody"><div class="loading"><div class="spinner"></div><p>Loading order guide...</p></div></div>
<div class="submit-bar">

  <button class="submit-btn" id="submitBtn" onclick="onSubmitClick()" disabled>Submit Order</button>
</div>
<!-- Manager PIN Modal -->
<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>Enter Manager PIN</h3>
    <input class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" autocomplete="off">
    <div class="modal-err" id="pinErr">Incorrect PIN</div>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closePin()">Cancel</button><button class="modal-btn save" onclick="submitPin()">Unlock</button></div>
  </div>
</div>

<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>Add Order Item</h3>
    <input type="text" id="addItemName" placeholder="Item name">
    <select id="addItemUnit" onchange="onAddUnitChange()"></select>
    <input type="text" id="addItemPar" placeholder="Par level">
    <select id="addItemCat"><option value="">Select category...</option></select>
    <select id="addItemVendor" onchange="refreshCatDropdown()"></select>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeAdd()">Cancel</button><button class="modal-btn save" onclick="saveAdd()">Add</button></div>
  </div>
</div>

<div class="modal-bg" id="moveModal">
  <div class="modal">
    <h3>Move Item to Shelf</h3>
    <div id="moveItemName" style="color:var(--grey);font-size:0.85rem;margin-bottom:10px"></div>
    <select id="moveShelf"></select>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeMove()">Cancel</button><button class="modal-btn save" onclick="saveMove()">Move</button></div>
  </div>
</div>
<div class="modal-bg" id="unitsModal">
  <div class="modal">
    <h3>Manage Units</h3>
    <div class="unit-add-row"><input type="text" id="newUnitName" placeholder="New unit name" autocomplete="off"><button onclick="addUnit()">Add</button></div>
    <div class="unit-list" id="unitList"></div>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeUnitsModal()">Done</button></div>
  </div>
</div>
<div class="modal-bg" id="shelvesModal">
  <div class="modal">
    <h3>Manage Shelves</h3>
    <div class="unit-add-row"><select id="newShelfVendor" style="flex:0 0 auto;width:auto;min-width:104px;margin:0"></select><input type="text" id="newShelfName" placeholder="New shelf name" autocomplete="off"><button onclick="addShelf()">Add</button></div>
    <div class="unit-list" id="shelfList"></div>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeShelvesModal()">Done</button></div>
  </div>
</div>
<div class="modal-bg" id="unitAddModal">
  <div class="modal">
    <h3>New Unit</h3>
    <input type="text" id="otherUnitName" placeholder="Unit name (e.g. flat, sleeve)" autocomplete="off">
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeOtherUnit()">Cancel</button><button class="modal-btn save" onclick="saveOtherUnit()">Add</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var SB='https://sxppuyarecqkgkrsrefc.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cHB1eWFyZWNxa2drcnNyZWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTA4MzAsImV4cCI6MjA5Mjk2NjgzMH0.GM8OfcR68_JjdPeQ3k7j6L3ulJFaeS1xnSLBcdtYXtU';
var guide='birite',items=[],mgr=false,todayStr='',st=null,quantities={};
var MGR_KEY='boxkitchen.mgr';
var MANAGER_PIN='4316';
var units=[],unitMap={},otherUnitTarget=null;
var curOrder={birite:null,produce:null},prevOrders={birite:[],produce:[]};
var viewMode='today';
var submitting={birite:false,produce:false},creatingDraft={birite:false,produce:false},saveTimer={birite:null,produce:null},pendingSave={birite:false,produce:false};
var biriteVendors=['Birite','Dairy'];
var produceVendors=['Schmitz Ranch','Asia Intl','Cooks Produce'];
var vendorColors={'Birite':'birite','Dairy':'dairy','Schmitz Ranch':'schmitz','Asia Intl':'asia','Cooks Produce':'cooks'};
var catByVendor={},catRegistryLoaded=false;

function itemsInGuide(g){var vs=g==='birite'?biriteVendors:produceVendors;return items.filter(function(it){return vs.indexOf(it.vendor)!==-1;});}
function guideLabel(g){return g==='birite'?'Birite & Dairy':'Produce & Protein';}
function guideDbName(g){return g==='birite'?'birite_dairy':'produce_protein';}
function fmtTime(iso){var d=new Date(iso),h=d.getHours(),m=d.getMinutes(),ap=h>=12?'pm':'am';h=h%12;if(h===0)h=12;return h+':'+String(m).padStart(2,'0')+ap;}
function fmtDateTime(iso){var d=new Date(iso),mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return dn[d.getDay()]+', '+mn[d.getMonth()]+' '+d.getDate()+' · '+fmtTime(iso);}
function isSubmitted(g){return !!(curOrder[g]&&curOrder[g].status==='submitted');}

function init(){
  var d=new Date(),mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  todayStr=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  document.getElementById('dateDisplay').textContent=dn[d.getDay()]+', '+mn[d.getMonth()]+' '+d.getDate();
  updateDelivery();loadData();
}

function updateDelivery(){
  var d=new Date().getDay();
  if(guide==='birite'){
    if(d===1||d===4)document.getElementById('deliveryInfo').textContent='📦 Birite & Dairy delivery today';
    else if(d===0||d===3)document.getElementById('deliveryInfo').textContent='⚠️ Order due today for tomorrow delivery';
    else document.getElementById('deliveryInfo').textContent='Mon & Thu delivery';
  }else{document.getElementById('deliveryInfo').textContent='Daily ordering — 6 days/week';}
}

function api(m,t,q,d,cb){var x=new XMLHttpRequest();x.open(m,SB+'/rest/v1/'+t+(q?'?'+q:''));x.setRequestHeader('apikey',SK);x.setRequestHeader('Authorization','Bearer '+SK);if(d){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Prefer','return=representation');}x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}if(cb)cb(r,x.status);};x.onerror=function(){if(cb)cb(null,0);};x.send(d?JSON.stringify(d):null);}

function loadUnits(cb){
  api('GET','order_units','order=retired.asc,sort_order.asc,label.asc',null,function(ru){
    units=ru||[];unitMap={};for(var i=0;i<units.length;i++)unitMap[units[i].id]=units[i];
    if(cb)cb();
  });
}
// Managed "shelf" registry (order_categories). Drives section order + the add-item
// shelf picker. Loaded before the first render; if it fails, the guide falls back to
// today's first-seen grouping so ordering never breaks.
function loadCategories(cb){
  api('GET','order_categories','location=eq.Tempest&order=vendor.asc,sort_order.asc',null,function(rc){
    catByVendor={};catRegistryLoaded=false;
    if(Array.isArray(rc)){
      catRegistryLoaded=true;
      for(var i=0;i<rc.length;i++){var c=rc[i];if(!catByVendor[c.vendor])catByVendor[c.vendor]=[];catByVendor[c.vendor].push(c);}
    }
    if(cb)cb();
  });
}
function loadData(){
  loadUnits(function(){
  loadCategories(function(){
  api('GET','order_items','location=eq.Tempest&active=eq.true&order=sort_order.asc',null,function(r){
    items=r||[];
    // Load the one OPEN order per guide (not date-scoped — survives midnight & reloads).
    api('GET','orders','location=eq.Tempest&status=eq.open',null,function(r2){
      var openByGuide={birite:null,produce:null};
      if(r2)for(var i=0;i<r2.length;i++){
        var g=r2[i].guide_name==='birite_dairy'?'birite':'produce';
        openByGuide[g]=r2[i];
      }
      // Also load today's SUBMITTED order per guide (by local submit_date) so the
      // post-submit view persists across reloads.
      api('GET','orders','location=eq.Tempest&status=eq.submitted&order=submitted_at.desc',null,function(r3){
        var subByGuide={birite:null,produce:null};
        if(r3)for(var j=0;j<r3.length;j++){
          var g2=r3[j].guide_name==='birite_dairy'?'birite':'produce';
          if(!subByGuide[g2]&&r3[j].submit_date===todayStr)subByGuide[g2]=r3[j];
        }
        // An open row is the live working draft; otherwise fall back to today's submitted.
        curOrder={birite:null,produce:null};quantities={};
        ['birite','produce'].forEach(function(g){
          var row=openByGuide[g]||subByGuide[g];
          if(!row)return;
          curOrder[g]=row;
          var qs=row.quantities||{};
          for(var k in qs){if(qs[k]!==''&&qs[k]!=null)quantities[k]=qs[k];}
        });
        render();
      });
    });
  });
  });
  });
}

// Re-fetch the existing open order for a guide (after a shared-device create conflict).
function fetchOpenOrder(g,cb){
  api('GET','orders','location=eq.Tempest&guide_name=eq.'+guideDbName(g)+'&status=eq.open&order=created_at.desc&limit=1',null,function(r){
    if(Array.isArray(r)&&r.length){
      curOrder[g]=r[0];
      var qs=r[0].quantities||{};
      for(var k in qs){if(!quantities[k]&&qs[k])quantities[k]=qs[k];}
      if(viewMode==='today'&&guide===g)render();
    }
    if(cb)cb();
  });
}

function getVendors(){return guide==='birite'?biriteVendors:produceVendors;}

function render(){
  if(viewMode==='previous'){renderPrevious();return;}
  var vendors=getVendors(),cls=mgr?'manager-mode':'',h='';
  if(isSubmitted(guide)){
    var co=curOrder[guide];
    h+='<div class="lock-banner">🔒 Submitted by '+esc(co.submitted_by||'—')+(co.submitted_at?' at '+fmtTime(co.submitted_at):'')+' — tap “Unlock to edit” below to change it.</div>';
  }
  h+='<div class="'+cls+'">';
  for(var vi=0;vi<vendors.length;vi++){
    var v=vendors[vi];
    var vItems=items.filter(function(it){return it.vendor===v;});
    if(vItems.length===0&&!mgr)continue;
    var filled=0;for(var i=0;i<vItems.length;i++)if(quantities[vItems[i].id])filled++;
    var colorCls=vendorColors[v]||'birite';

    // Bucket items by their category text, then order the sections from the managed
    // shelf registry (active shelves first, in their order); anything left over
    // (unregistered / retired-but-still-populated / 'Other') falls in first-seen order
    // at the end. If the registry didn't load, this degrades to today's first-seen order.
    var catMap={},seenCat={},catOrder=[];
    for(var i=0;i<vItems.length;i++){
      var c=vItems[i].category||'Other';
      if(!catMap[c])catMap[c]=[];
      catMap[c].push(vItems[i]);
    }
    var regList=(catRegistryLoaded&&catByVendor[v])?catByVendor[v]:[];
    for(var ri=0;ri<regList.length;ri++){
      var rl=regList[ri];if(!rl.active)continue;
      if(catMap[rl.label]&&!seenCat[rl.label]){catOrder.push(rl.label);seenCat[rl.label]=true;}
    }
    for(var i=0;i<vItems.length;i++){
      var c2=vItems[i].category||'Other';
      if(!seenCat[c2]){catOrder.push(c2);seenCat[c2]=true;}
    }

    h+='<div class="vendor-section open">';
    h+='<div class="vendor-header" onclick="togV(this)">';
    h+='<span class="vendor-name '+colorCls+'">'+v+'</span>';
    h+='<div class="vendor-right">';
    if(filled>0)h+='<span class="vendor-count has">'+filled+' to order</span>';
    h+='<span class="vendor-count">'+vItems.length+' items</span>';
    h+='<span class="chevron">▼</span></div></div>';
    h+='<div class="vendor-body">';

    for(var ci=0;ci<catOrder.length;ci++){
      var cat=catOrder[ci],catItems=catMap[cat];
      h+='<div class="cat-header"><span class="cat-label">'+esc(cat)+'</span></div>';
      h+='<div class="item-header"><span class="ih-name">Item</span><span class="ih-par">Par</span><span class="ih-unit">Unit</span><span class="ih-qty">Need</span></div>';
      h+='<div class="shelf-body" data-vendor="'+esc(v)+'" data-cat="'+esc(cat)+'">';
      for(var i=0;i<catItems.length;i++)h+=buildItem(catItems[i]);
      h+='</div>';
    }

    h+='<button class="add-btn" onclick="openAdd(\''+v.replace(/'/g,"\\'")+'\')">+ Add item</button>';
    h+='</div></div>';
  }
  h+='</div>';
  document.getElementById('appBody').innerHTML=h;
  initSortables();
  syncNameBar();
  updateSummary();
}

// Filled-by field: read-only (showing the submitter) when submitted, editable otherwise.
function syncNameBar(){
  var inp=document.getElementById('filledBy');if(!inp)return;
  if(isSubmitted(guide)){
    inp.value=(curOrder[guide]&&curOrder[guide].submitted_by)||'';
    inp.readOnly=true;
  }else{
    inp.readOnly=false;
  }

function fillCatSelect(vendor,selected){
  var catSel=document.getElementById('addItemCat');
  catSel.innerHTML='<option value="">Select shelf...</option>';
  var list=(catByVendor[vendor]||[]).filter(function(c){return c.active;});
  if(list.length){
    for(var i=0;i<list.length;i++){
      var o=document.createElement('option');o.value=list[i].label;o.textContent=list[i].label;
      if(selected&&selected===list[i].label)o.selected=true;
      catSel.appendChild(o);
    }
    return;
  }
  // Fallback (registry empty/failed): offer existing item categories for this vendor.
  var seen={};
  for(var i=0;i<items.length;i++){
    if(items[i].vendor===vendor&&items[i].category&&!seen[items[i].category]){
      seen[items[i].category]=true;
      var o=document.createElement('option');o.value=items[i].category;o.textContent=items[i].category;
      if(selected&&selected===items[i].category)o.selected=true;
      catSel.appendChild(o);
    }

}

function moveShelf(cid,dir){
  var c=findShelf(cid);if(!c)return;
  var list=catByVendor[c.vendor]||[];
  var ci=-1;for(var i=0;i<list.length;i++)if(list[i].id===cid){ci=i;break;}
  var si=ci+dir;if(si<0||si>=list.length)return;
  var other=list[si],tmp=c.sort_order;
  c.sort_order=other.sort_order;other.sort_order=tmp;
  api('PATCH','order_categories','id=eq.'+c.id,{sort_order:c.sort_order},null);
  api('PATCH','order_categories','id=eq.'+other.id,{sort_order:other.sort_order},null);
  list.sort(function(a,b){return a.sort_order-b.sort_order;});
  renderShelfList();render();
}
function renameShelf(cid,inp){
  var c=findShelf(cid);if(!c)return;
  var v=inp.value.trim();
  if(!v||v===c.label){inp.value=c.label;return;}
  var list=catByVendor[c.vendor]||[];
  for(var i=0;i<list.length;i++)if(list[i].id!==cid&&list[i].label.toLowerCase()===v.toLowerCase()){showToast('Shelf name already in use','error');inp.value=c.label;return;}
  if(!confirm('Rename shelf "'+c.label+'" to "'+v+'"? Every item on it moves to the new name.')){inp.value=c.label;return;}
  var old=c.label;
  api('PATCH','order_categories','id=eq.'+cid,{label:v},function(r){
    if(!(r&&r.length)){showToast('Rename failed','error');inp.value=old;return;}
    c.label=v;
    // Cascade the new label onto every item on this (vendor, old-label) shelf.
    // encodeURIComponent is required — vendor names have spaces and labels may contain '&'.
    api('PATCH','order_items','vendor=eq.'+encodeURIComponent(c.vendor)+'&category=eq.'+encodeURIComponent(old),{category:v},function(r2){
      for(var i=0;i<items.length;i++)if(items[i].vendor===c.vendor&&items[i].category===old)items[i].category=v;
      showToast('Shelf renamed','success');renderShelfList();render();

}

function scheduleSave(g){
  if(submitting[g]||isSubmitted(g))return;
  if(saveTimer[g])clearTimeout(saveTimer[g]);
  saveTimer[g]=setTimeout(function(){saveTimer[g]=null;saveDraft(g);},400);
}

// Persist the guide's in-progress quantities to its single OPEN order row.
function saveDraft(g){
  if(submitting[g]||isSubmitted(g))return;
  var gi=itemsInGuide(g),qs={},cnt=0;
  for(var i=0;i<gi.length;i++){var id=gi[i].id;if(quantities[id]){qs[String(id)]=quantities[id];cnt++;}}
  var body={quantities:qs,item_count:cnt,updated_at:new Date().toISOString()};
  if(curOrder[g]&&curOrder[g].id){
    api('PATCH','orders','id=eq.'+curOrder[g].id,body,function(r){
      if(Array.isArray(r)&&r.length)curOrder[g]=r[0];
    });
  }else{
    if(creatingDraft[g]){pendingSave[g]=true;return;}
    creatingDraft[g]=true;
    api('POST','orders',null,{guide_name:guideDbName(g),location:'Tempest',status:'open',quantities:qs,item_count:cnt},function(r,status){
      creatingDraft[g]=false;
      if(Array.isArray(r)&&r.length){curOrder[g]=r[0];if(pendingSave[g]){pendingSave[g]=false;saveDraft(g);}return;}
      // Another device already opened one — adopt it silently, then re-save our edits onto it.
      if(status===409){fetchOpenOrder(g,function(){pendingSave[g]=false;if(!submitting[g])saveDraft(g);});return;}
    });
  }
}

function updateSummary(){
  var gi=itemsInGuide(guide),c=0;
  for(var i=0;i<gi.length;i++)if(quantities[gi[i].id])c++;
  var sum=document.getElementById('submitSummary'),btn=document.getElementById('submitBtn');
  if(isSubmitted(guide)){
    sum.innerHTML='<strong>'+guideLabel(guide)+'</strong> order submitted';
    btn.textContent='🔓 Unlock to edit';
    btn.disabled=false;
  }else{
    sum.innerHTML='<strong>'+c+'</strong> item'+(c!==1?'s':'')+' to order';
    btn.textContent='Submit Order';
    btn.disabled=c===0;
  }
}

function unlockGuide(){
  var g=guide,co=curOrder[g];
  if(!co||co.status!=='submitted')return;
  co.status='open';render();
  api('PATCH','orders','id=eq.'+co.id,{status:'open',updated_at:new Date().toISOString()},function(r,status){
    if(Array.isArray(r)&&r.length){curOrder[g]=r[0];}
    else if(status===409){fetchOpenOrder(g);}
  });
}

function submitOrder(){
  var g=guide;
  if(submitting[g])return;
  var name=document.getElementById('filledBy').value.trim();
  if(!name){showToast('Enter your name first','error');document.getElementById('filledBy').focus();return;}
  var gi=itemsInGuide(g),qs={},cnt=0;
  for(var i=0;i<gi.length;i++){var id=gi[i].id;if(quantities[id]){qs[String(id)]=quantities[id];cnt++;}}
  if(!cnt)return;
  if(!confirm('Submit order with '+cnt+' items?'))return;
  // Lock out autosave so a late debounced save can't write into the fresh order.
  submitting[g]=true;
  if(saveTimer[g]){clearTimeout(saveTimer[g]);saveTimer[g]=null;}
  pendingSave[g]=false;
  var btn=document.getElementById('submitBtn');btn.disabled=true;
  var now=new Date();
  var submitDate=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var payload={status:'submitted',submitted_by:name,submitted_at:now.toISOString(),submit_date:submitDate,item_count:cnt,quantities:qs};
  function fail(){submitting[g]=false;btn.disabled=false;showToast('Could not submit. Try again.','error');}
  function doPatch(){
    api('PATCH','orders','id=eq.'+curOrder[g].id,payload,function(r){
      if(!(Array.isArray(r)&&r.length)){fail();return;}
      // Keep the submitted order on screen: same row, now status=submitted.
      curOrder[g]=r[0];submitting[g]=false;
      showToast('Order submitted — '+cnt+' items','success');
      render();
    });
  }
  if(curOrder[g]&&curOrder[g].id){doPatch();}
  else{
    // No open row yet (autosave hadn't created one) — create, then submit it.
    api('POST','orders',null,{guide_name:guideDbName(g),location:'Tempest',status:'open',quantities:qs,item_count:cnt},function(r,status){
      if(Array.isArray(r)&&r.length){curOrder[g]=r[0];doPatch();}
      else if(status===409){fetchOpenOrder(g,function(){if(curOrder[g]&&curOrder[g].id)doPatch();else fail();});}
      else fail();
    });
  }
}

function delItem(id){
  if(!confirm('Delete this item?'))return;
  api('DELETE','order_items','id=eq.'+id,null,function(){
    // Confirm the row is actually gone before claiming success (a blocked
    // delete returns no error but deletes 0 rows — see the old notes bug).
    api('GET','order_items','id=eq.'+id+'&select=id',null,function(chk){
      if(!chk){showToast("Couldn't confirm delete — reload to check",'error');return;}
      if(chk.length){showToast("Delete didn't save — check permissions",'error');return;}
      items=items.filter(function(x){return x.id!==id;});delete quantities[id];
      scheduleSave(guide);
      showToast('Deleted','success');render();
    });

// ── DRAG-TO-REORDER (manager mode, replaces up/down arrows) ──
// One Sortable per shelf (.shelf-body = one vendor + one category), so items can
// never be dragged across shelves or vendors. Mirrors tempest_prep/line.
var sortables=[];
function initSortables(){
  for(var i=0;i<sortables.length;i++){try{sortables[i].destroy();}catch(e){}}
  sortables=[];
  if(!mgr)return;
  if(typeof Sortable==='undefined'){showToast('Drag unavailable — reload page','error');return;}
  var lists=document.querySelectorAll('.shelf-body');
  for(var i=0;i<lists.length;i++){
    (function(listEl){
      sortables.push(Sortable.create(listEl,{
        handle:'.drag-handle',
        draggable:'.item-row',
        animation:150,
        delay:0,
        ghostClass:'sortable-ghost',
        chosenClass:'sortable-chosen',
        dragClass:'sortable-drag',
        onEnd:function(evt){persistOrder(listEl,evt);}
      }));
    })(lists[i]);
  }
}

// Persist a drag: renumber the dragged shelf (one vendor + one category) with clean,
// unique, increasing sort_order values (10,20,30,...) so the reload order
// (order=sort_order.asc, then bucketed by category) is deterministic even if legacy
// rows carried duplicate/zero/tied values. PATCH only the changed order_items rows.
function persistOrder(listEl,evt){
  if(evt.oldIndex===evt.newIndex)return;
  var draggedId=parseInt(evt.item.getAttribute('data-id'),10);
  var dragItem=null;for(var i=0;i<items.length;i++)if(items[i].id===draggedId){dragItem=items[i];break;}
  // Sortable has already moved the row, so returning quietly would leave a
  // reorder on screen that was never saved. Fail loudly instead.
  if(!dragItem){refetchItems(1);return;}
  var vend=dragItem.vendor,cat=dragItem.category||'Other';
  var rows=listEl.querySelectorAll('.item-row'),visIds=[];
  for(var i=0;i<rows.length;i++)visIds.push(parseInt(rows[i].getAttribute('data-id'),10));
  // FULL shelf = every item with this vendor+category, kept in the rendered order
  // (items[] order). Do NOT re-sort on raw sort_order: legacy ties/NULLs would
  // disagree with what's on screen and scramble the result.
  var group=[];for(var i=0;i<items.length;i++){var gi=items[i];if(gi.vendor!==vend)continue;if((gi.category||'Other')!==cat)continue;group.push(gi);}
  var dragged=null,rest=[];
  for(var i=0;i<group.length;i++){if(group[i].id===draggedId)dragged=group[i];else rest.push(group[i]);}
  // Sortable has already moved the row, so returning quietly would leave a
  // reorder on screen that was never saved. Fail loudly instead.
  if(!dragged){refetchItems(1);return;}
  function idxOf(arr,id){for(var k=0;k<arr.length;k++)if(arr[k].id===id)return k;return -1;}
  var vi=visIds.indexOf(draggedId),at,newGroup;
  if(vi<=0){
    var nextId=visIds[1];
    at=nextId!=null?idxOf(rest,nextId):rest.length;if(at<0)at=rest.length;
  }else{
    var prevId=visIds[vi-1];at=idxOf(rest,prevId);at=at<0?rest.length:at+1;
  }
  newGroup=rest.slice(0,at).concat([dragged]).concat(rest.slice(at));
  var changed=[];
  for(var i=0;i<newGroup.length;i++){
    var nv=(i+1)*10;
    if(newGroup[i].sort_order!==nv){newGroup[i].sort_order=nv;changed.push(newGroup[i]);}
  }
  items.sort(function(a,b){return a.sort_order-b.sort_order;});
  render(); // optimistic
  if(changed.length===0)return;
  var pending=changed.length,failed=false;
  changed.forEach(function(it){
    api('PATCH','order_items','id=eq.'+it.id,{sort_order:it.sort_order},function(r){
      if(!r||!r.length)failed=true;
      if(--pending===0){
        // Any failure means some PATCHes may already be committed, so a local
        // snapshot cannot describe the database. Re-read the server instead of
        // guessing — the screen then matches what a reload would show.
        if(failed){
          refetchItems(1);
        }else{showToast('Moved','success');}
      }
    });
  });
}

// Re-read the item list from the server and re-render. Used whenever a reorder
// fails: a partial write leaves the DB in a state no local snapshot can describe.
function refetchItems(msg){
  api('GET','order_items','location=eq.Tempest&active=eq.true&order=sort_order.asc',null,function(r){
    if(Array.isArray(r)){
      items=r;render();
      if(msg)showToast('Could not save order','error');
    }else{
      // Couldn't reach the server either. Don't wipe items[] — say so instead.
      showToast('Could not save order — reload the page','error');
    }
  });
}

function openAdd(vendor){
  document.getElementById('addItemName').value='';fillAddUnitSelect(null);
  document.getElementById('addItemPar').value='';
  // Populate vendor dropdown
  var sel=document.getElementById('addItemVendor'),vs=getVendors();sel.innerHTML='';
  for(var i=0;i<vs.length;i++){var o=document.createElement('option');o.value=vs[i];o.textContent=vs[i];if(vs[i]===vendor)o.selected=true;sel.appendChild(o);}
  // Populate the shelf dropdown from the managed shelf registry for this vendor
  fillCatSelect(vendor);
  document.getElementById('addModal').classList.add('show');
  setTimeout(function(){document.getElementById('addItemName').focus();},100);
}
function refreshCatDropdown(){fillCatSelect(document.getElementById('addItemVendor').value);}
function closeAdd(){document.getElementById('addModal').classList.remove('show')}

// ── MOVE ITEM TO ANOTHER SHELF (manager mode) ──
var moveItemId=null;
function openMove(id){
  var item=null;for(var i=0;i<items.length;i++)if(items[i].id===id){item=items[i];break;}
  if(!item)return;
  moveItemId=id;
  var cur=item.category||'Other';
  document.getElementById('moveItemName').textContent=item.name+' — now on "'+cur+'"';
  var sel=document.getElementById('moveShelf');sel.innerHTML='<option value="">Select shelf...</option>';
  var list=(catByVendor[item.vendor]||[]).filter(function(c){return c.active&&c.label!==cur;});
  if(list.length){
    for(var i=0;i<list.length;i++){var o=document.createElement('option');o.value=list[i].label;o.textContent=list[i].label;sel.appendChild(o);}
  }else{
    // Fallback (registry empty/failed): offer this vendor's other existing shelves.
    var seen={};
    for(var i=0;i<items.length;i++){
      if(items[i].vendor!==item.vendor)continue;
      var c=items[i].category||'Other';
      if(c===cur||seen[c])continue;
      seen[c]=true;var o2=document.createElement('option');o2.value=c;o2.textContent=c;sel.appendChild(o2);
    }
  }
  document.getElementById('moveModal').classList.add('show');
}
function closeMove(){document.getElementById('moveModal').classList.remove('show');moveItemId=null;}
function saveMove(){
  var id=moveItemId,cat=document.getElementById('moveShelf').value;
  if(!id||!cat)return;
  var item=null;for(var i=0;i<items.length;i++)if(items[i].id===id){item=items[i];break;}
  if(!item){closeMove();return;}
  // land at the end of the target shelf
  var mx=0;for(var i=0;i<items.length;i++){var t=items[i];if(t.vendor===item.vendor&&(t.category||'Other')===cat&&t.sort_order>mx)mx=t.sort_order;}
  api('PATCH','order_items','id=eq.'+id,{category:cat,sort_order:mx+10},function(r){
    if(r&&r.length){
      item.category=r[0].category;item.sort_order=r[0].sort_order;
      items.sort(function(a,b){return a.sort_order-b.sort_order;});
      showToast('Moved to '+cat,'success');render();
    }else{showToast('Move failed','error');}
    closeMove();
  });
}
function saveAdd(){
  var name=document.getElementById('addItemName').value.trim();
  var unitVal=document.getElementById('addItemUnit').value;
  var unitId=(unitVal&&unitVal!=='__other__')?Number(unitVal):null;
  var unitStr=unitId&&unitMap[unitId]?unitMap[unitId].label:null;
  var par=document.getElementById('addItemPar').value.trim();
  var cat=document.getElementById('addItemCat').value.trim();
  var vendor=document.getElementById('addItemVendor').value;
  if(!name)return;
  var mx=0;for(var i=0;i<items.length;i++)if(items[i].vendor===vendor&&items[i].sort_order>mx)mx=items[i].sort_order;
  api('POST','order_items',null,{name:name,vendor:vendor,location:'Tempest',unit_id:unitId,unit:unitStr,par_level:par||null,category:cat||null,sort_order:mx+1},function(r){
    if(r&&r.length){items.push(r[0]);showToast('Added','success');render();}
    closeAdd();
  });
}

function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=(type==='success'?'✓ ':'⚠ ')+msg;
  t.className='toast show '+(type||'success');
  clearTimeout(st);st=setTimeout(function(){t.className='toast';},1800);
}

try{if(localStorage.getItem(MGR_KEY)==='1'){mgr=true;document.getElementById('mgrSwitch').classList.add('on');syncMgrBtns();}}catch(e){}
init();
</script>

<!-- Staff Note FAB + modal -->
<button class="nb-fab" id="nbFab" aria-label="New note" title="New note">+</button>
<div class="modal-bg" id="nbModal">
  <div class="modal">
    <h3>New Note</h3>
    <div class="nb-label">Category</div>
    <div class="nb-cats" id="nbCats"></div>
    <div class="nb-label">Note</div>
    <textarea class="nb-textarea" id="nbBody" placeholder="What's going on? (e.g. Lowboy #2 is down, 86 the salmon...)"></textarea>
    <div class="nb-label">Posted by</div>
    <select id="nbBy"><option value="">— Select name —</option></select>
    <div class="nb-err" id="nbErr"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" id="nbCancel">Cancel</button>
      <button class="modal-btn save" id="nbSave">Save Note</button>
    </div>
  </div>
</div>
<div class="nb-toast" id="nbToast">✓ Note saved</div>
<script>
(function(){
  var SBASE=SB,SKEY=SK;
  var CATS=[
    {key:'urgent',emoji:'🚨',label:'Urgent'},
    {key:'equipment',emoji:'🔧',label:'Equipment'},
    {key:'supplies',emoji:'📋',label:"Supplies & 86'd"},
    {key:'recipe',emoji:'🍳',label:'Recipe issue'},
    {key:'other',emoji:'💬',label:'Other'}
  ];
  var selCat='other',tt=null;
  var fab=document.getElementById('nbFab'),modal=document.getElementById('nbModal'),catsEl=document.getElementById('nbCats'),bodyEl=document.getElementById('nbBody'),byEl=document.getElementById('nbBy'),errEl=document.getElementById('nbErr'),saveBtn=document.getElementById('nbSave'),cancelBtn=document.getElementById('nbCancel'),toastEl=document.getElementById('nbToast');

  function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
  function nbApi(m,t,q,d,cb){var x=new XMLHttpRequest();x.open(m,SBASE+'/rest/v1/'+t+(q?'?'+q:''));x.setRequestHeader('apikey',SKEY);x.setRequestHeader('Authorization','Bearer '+SKEY);if(d){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Prefer','return=representation');}x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}if(cb)cb(r);};x.onerror=function(){if(cb)cb(null);};x.send(d?JSON.stringify(d):null);}

  function buildCats(){
    var h='';for(var i=0;i<CATS.length;i++)h+='<div class="nb-cat'+(CATS[i].key===selCat?' sel':'')+'" data-cat="'+CATS[i].key+'">'+CATS[i].emoji+' '+esc(CATS[i].label)+'</div>';
    catsEl.innerHTML=h;
    var opts=catsEl.querySelectorAll('.nb-cat');
    for(var j=0;j<opts.length;j++)opts[j].addEventListener('click',function(){selCat=this.getAttribute('data-cat');for(var k=0;k<opts.length;k++)opts[k].classList.toggle('sel',opts[k].getAttribute('data-cat')===selCat);});
  }
  function loadStaff(){
    nbApi('GET','staff','location=eq.Tempest&active=eq.true&order=shift.asc,sort_order.asc.nullslast,name.asc',null,function(r){
      var seen={};if(r&&r.length)for(var i=0;i<r.length;i++){var n=r[i].name;if(n&&!seen[n]){seen[n]=true;var o=document.createElement('option');o.value=n;o.textContent=n;byEl.appendChild(o);}}
    });
  }
  function openModal(){selCat='other';buildCats();bodyEl.value='';byEl.value='';hideErr();modal.classList.add('show');setTimeout(function(){bodyEl.focus();},100);}
  function closeModal(){modal.classList.remove('show');}
  function showErr(m){errEl.textContent=m;errEl.classList.add('show');}
  function hideErr(){errEl.classList.remove('show');}
  function toast(msg){toastEl.textContent='✓ '+msg;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('show');},1600);}
  function save(){
    var body=bodyEl.value.trim(),by=byEl.value;
    if(!body){showErr('Please enter a note.');bodyEl.focus();return;}
    hideErr();saveBtn.disabled=true;
    nbApi('POST','notes',null,{location:'Tempest',category:selCat,body:body,posted_by:by||null,status:'open'},function(r){
      saveBtn.disabled=false;
      if(r&&r.length){closeModal();toast('Note saved');}else{showErr('Could not save note. Please try again.');}
    });
  }
  fab.addEventListener('click',openModal);
  cancelBtn.addEventListener('click',closeModal);
  saveBtn.addEventListener('click',save);
  modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
  loadStaff();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script>
  (function(){
    var raw = localStorage.getItem('boxkitchen_auth');
    var ts = raw ? parseInt(raw, 10) : 0;
    var TTL = 30 * 24 * 60 * 60 * 1000; // 30 days
    if (!ts || isNaN(ts) || (Date.now() - ts) > TTL) {
      window.location.replace('index.html');
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tempest Order Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0f1115;--surface:#1a1d24;--surface2:#22262f;--border:#2a2d35;--accent:#e85d3a;--accent-dim:rgba(232,93,58,0.15);--green:#22c55e;--green-dim:rgba(34,197,94,0.12);--yellow:#f59e0b;--blue:#3b82f6;--purple:#a855f7;--red:#ef4444;--text:#e8e6e3;--muted:#8a8a8a;--dim:#555}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:144px}

  .header{position:sticky;top:0;z-index:100;background:rgba(15,17,21,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 20px 12px}
  .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .header h1{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900}
  .header h1 span{color:var(--accent)}
  .home-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 10px;margin-left:-10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:500;color:rgba(232,230,227,0.75);text-decoration:none;transition:color 0.15s}
  .home-link:hover,.home-link:active{color:var(--accent)}
  .mgr-toggle{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:var(--muted)}
  .mgr-switch{width:40px;height:22px;border-radius:11px;background:var(--border);position:relative;cursor:pointer;transition:background 0.2s}
  .mgr-switch.on{background:var(--accent)}
  .mgr-switch .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left 0.2s}
  .mgr-switch.on .knob{left:20px}
  .guide-toggle{display:flex;background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden}
  .guide-btn{flex:1;padding:9px;text-align:center;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;border:none;background:transparent;color:var(--muted);cursor:pointer}
  .guide-btn.active{background:var(--accent);color:#fff}

  .date-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border)}
  .date-display{font-size:0.9rem;font-weight:600}
  .delivery-info{font-size:0.75rem;color:var(--yellow);font-weight:600}

  .name-bar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
  .name-bar label{font-size:0.8rem;color:var(--muted);font-weight:600}
  .name-bar input{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none}
  .name-bar input:focus{border-color:var(--accent)}

  /* VENDOR SECTION */
  .vendor-section{border-bottom:1px solid var(--border)}
  .vendor-header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--surface);cursor:pointer}
  .vendor-header:active{background:var(--surface2)}
  .vendor-name{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
  .vendor-name.birite{color:var(--blue)}.vendor-name.dairy{color:var(--purple)}.vendor-name.schmitz{color:var(--accent)}.vendor-name.asia{color:var(--yellow)}.vendor-name.cooks{color:var(--green)}
  .vendor-right{display:flex;align-items:center;gap:8px}
  .vendor-count{font-size:0.72rem;color:var(--dim);background:var(--border);padding:2px 8px;border-radius:10px}
  .vendor-count.has{color:var(--green)}
  .chevron{font-size:0.65rem;color:var(--dim);transition:transform 0.2s}
  .vendor-section.open .chevron{transform:rotate(180deg)}
  .vendor-body{display:none}
  .vendor-section.open .vendor-body{display:block}

  /* CATEGORY HEADER */
  .cat-header{padding:8px 20px;background:rgba(232,93,58,0.08);border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
  .cat-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent)}

  /* ITEM ROW */
  .item-header{display:flex;align-items:center;padding:6px 20px;border-bottom:1px solid rgba(42,45,53,0.4);background:rgba(42,45,53,0.3)}
  .item-header span{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
  .ih-name{flex:1}.ih-par{width:50px;text-align:center}.ih-unit{width:42px;text-align:center}.ih-qty{width:58px;text-align:center}

  .item-row{display:flex;align-items:center;padding:8px 20px;border-bottom:1px solid rgba(42,45,53,0.3)}
  .item-row.has-qty{background:var(--green-dim)}
  .item-name{flex:1;font-size:0.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-par{width:50px;text-align:center;font-size:0.78rem;color:var(--muted);font-weight:600}
  .item-unit{width:42px;text-align:center;font-size:0.72rem;color:var(--dim)}
  .item-qty{width:58px}
  .qty-input{width:100%;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.85rem;text-align:center;outline:none}
  .qty-input:focus{border-color:var(--accent)}
  .qty-input.filled{border-color:var(--green);background:var(--green-dim)}
  .qty-input.locked{opacity:0.55;background:var(--bg);color:var(--muted);cursor:not-allowed;border-color:var(--border)}
  .qty-input.locked.filled{border-color:var(--border);background:var(--bg)}
  .lock-banner{margin:10px 20px;padding:10px 14px;background:var(--green-dim);border:1px solid var(--green);border-radius:8px;color:var(--green);font-size:0.85rem;font-weight:600;line-height:1.4}

  /* TODAY / PREVIOUS TOGGLE */
  .view-toggle{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
  .view-toggle button{flex:1;min-height:40px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;transition:background 0.15s,border-color 0.15s,color 0.15s}
  .view-toggle button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .prev-date-label{display:none;padding:10px 20px;background:rgba(232,93,58,0.06);border-bottom:1px solid var(--border);font-size:0.82rem;color:var(--text)}
  .prev-date-label.show{display:block}
  .prev-date-label .by{color:var(--muted);font-size:0.75rem;margin-left:6px}

  /* PREVIOUS ORDER CARDS */
  .prev-card{margin:14px 20px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
  .prev-card-head{padding:10px 14px;background:rgba(232,93,58,0.06);border-bottom:1px solid var(--border);font-size:0.85rem;font-weight:600;color:var(--text)}
  .prev-card-head .by{display:block;color:var(--muted);font-size:0.75rem;font-weight:500;margin-top:2px}
  .prev-vendor{padding:8px 14px 4px;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
  .prev-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;border-top:1px solid rgba(42,45,53,0.3);font-size:0.85rem}
  .prev-item .pi-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prev-item .pi-unit{color:var(--dim);font-size:0.72rem}
  .prev-item .pi-qty{font-weight:700;color:var(--accent);min-width:42px;text-align:right}
  .prev-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:0.9rem}

  /* MANAGER */
  .mgr-controls{display:none;flex-direction:column;gap:1px;margin-right:6px;flex-shrink:0}
  .manager-mode .mgr-controls{display:flex}
  .move-btn{width:20px;height:14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:0.55rem;cursor:pointer;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:0}
  .move-btn:active{background:var(--accent);color:#fff}
  /* DRAG-TO-REORDER (manager mode) */
  .drag-handle{display:flex;align-items:center;justify-content:center;width:22px;height:30px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .drag-handle:active{cursor:grabbing;color:var(--accent)}
  .drag-handle svg{display:block;pointer-events:none}
  .item-row.sortable-ghost{opacity:0.35}
  .item-row.sortable-chosen{background:var(--surface2)}
  .item-row.sortable-drag{background:var(--surface2);box-shadow:0 6px 20px rgba(0,0,0,0.5)}
  .delete-btn{display:none;width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--red);font-size:0.8rem;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;margin-left:4px}
  .manager-mode .delete-btn{display:flex}
  .shelf-btn{display:none;width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:0.8rem;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;margin-left:4px}
  .manager-mode .shelf-btn{display:flex}
  .manager-mode .item-name{cursor:pointer}
  .add-btn{display:none;padding:10px 20px;color:var(--accent);font-size:0.85rem;font-weight:600;cursor:pointer;background:transparent;border:none;font-family:'DM Sans',sans-serif;width:100%;text-align:left}
  .manager-mode .add-btn{display:block}
  .manager-mode .item-par{cursor:pointer}
  .item-par.mgr-edit{border-bottom:1px dashed var(--border)}
  .item-par .par-input{width:46px;font-size:0.85rem;background:var(--surface);border:1px solid var(--accent);border-radius:5px;color:var(--text);padding:3px 5px;font-family:'DM Sans',sans-serif;outline:none;text-align:center}
  .unit-select{width:100%;max-width:90px;font-size:0.8rem;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 4px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer}
  .unit-select:focus{border-color:var(--accent)}
  .manage-units-btn{display:none;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:600;padding:5px 9px;cursor:pointer;white-space:nowrap}
  .unit-list{max-height:50vh;overflow-y:auto;margin-bottom:12px}
  .unit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(42,45,53,0.4)}
  .unit-row input.unit-name{flex:1;margin:0;padding:7px 9px}
  .unit-row.retired input.unit-name{opacity:0.5;text-decoration:line-through}
  .unit-row .u-btn{padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .unit-row .u-btn.retire{color:var(--red)}
  .unit-row .u-btn.restore{color:var(--green)}
  .unit-add-row{display:flex;gap:8px;margin-bottom:6px}
  .unit-add-row input{flex:1;margin:0}
  .unit-add-row button{padding:8px 12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer}
  .shelf-vendor-hd{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 0 4px}
  .shelf-vendor-hd:first-child{margin-top:0}
  .shelf-moves{display:flex;flex-direction:column;gap:1px;flex-shrink:0}

  /* SUBMIT BAR */
  .submit-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 20px;background:rgba(15,17,21,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:12px;align-items:center;z-index:100}
  .submit-summary{flex:1;font-size:0.85rem;color:var(--muted)}
  .submit-summary strong{color:var(--text)}
  .submit-btn{padding:12px 28px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer}
  .submit-btn:active{opacity:0.8}
  .submit-btn:disabled{background:var(--border);color:var(--dim);cursor:default}

  /* MODAL */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;align-items:center;justify-content:center}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:90%;max-width:360px}
  .modal h3{font-size:1rem;margin-bottom:14px}
  .modal input,.modal select{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;margin-bottom:10px;outline:none}
  .modal input:focus{border-color:var(--accent)}
  .modal-btns{display:flex;gap:10px;margin-top:6px}
  .modal-btn{flex:1;padding:10px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer}
  .modal-btn.cancel{background:var(--border);color:var(--text)}
  .modal-btn.save{background:var(--accent);color:#fff}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:10px;font-size:0.85rem;font-weight:600;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
  .toast.show{opacity:1}
  .toast.success{background:var(--green);color:#fff}
  .toast.error{background:var(--red);color:#fff}

  .loading{display:flex;flex-direction:column;align-items:center;padding:80px 20px;color:var(--muted)}
  .spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* STAFF NOTE FAB + MODAL */
  .nb-fab{position:fixed;right:20px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:2rem;font-weight:300;line-height:1;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.45);z-index:250;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
  .nb-fab:active{transform:scale(0.94);opacity:0.9}
  .nb-label{display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:7px}
  .nb-cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .nb-cat{padding:9px 12px;min-height:44px;display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer}
  .nb-cat.sel{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
  .nb-textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;margin-bottom:10px;outline:none;resize:vertical;min-height:90px}
  .nb-textarea:focus{border-color:var(--accent)}
  .nb-err{display:none;color:var(--red);font-size:0.82rem;font-weight:600;margin-bottom:10px}
  .nb-err.show{display:block}
  .modal-btn:disabled{opacity:0.6;cursor:default}
  .nb-toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 24px;border-radius:10px;font-size:0.85rem;font-weight:600;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:400;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
  .nb-toast.show{opacity:1}
</style>
<script src="vendor/sortablejs-1.15.7.min.js"></script>
</head>
<body>
<div class="header">
  <div class="header-row">
    <a class="home-link" href="index.html">← Home</a>
    <h1>Tempest <span>Orders</span></h1>
    <div class="mgr-toggle"><span>Manager</span><div class="mgr-switch" id="mgrSwitch" onclick="toggleMgr()"><div class="knob"></div></div></div>
  </div>
  <div class="header-row" style="justify-content:flex-end;gap:8px;margin-bottom:0"><button class="manage-units-btn" id="manageShelvesBtn" onclick="openShelvesModal()" style="margin-top:6px">⚙ Manage shelves</button><button class="manage-units-btn" id="manageUnitsBtn" onclick="openUnitsModal()" style="margin-top:6px">⚙ Manage units</button></div>
  <div class="guide-toggle">
    <button class="guide-btn active" onclick="setGuide('birite')">BIRITE & DAIRY</button>
    <button class="guide-btn" onclick="setGuide('produce')">PRODUCE & PROTEIN</button>
  </div>
</div>
<div class="view-toggle">
  <button type="button" id="viewTodayBtn" class="active" onclick="setView('today')">Today</button>
  <button type="button" id="viewPrevBtn" onclick="setView('previous')">Previous</button>
</div>
<div class="date-bar">
  <div class="date-display" id="dateDisplay"></div>
  <div class="delivery-info" id="deliveryInfo"></div>
</div>
<div class="prev-date-label" id="prevDateLabel"></div>
<div class="name-bar" id="nameBar">
  <label>Filled by:</label>
  <input type="text" id="filledBy" placeholder="Your name">
</div>
<div id="appBody"><div class="loading"><div class="spinner"></div><p>Loading order guide...</p></div></div>
<div class="submit-bar">
  <div class="submit-summary" id="submitSummary">0 items to order</div>
  <button class="submit-btn" id="submitBtn" onclick="onSubmitClick()" disabled>Submit Order</button>
</div>
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>Add Order Item</h3>
    <input type="text" id="addItemName" placeholder="Item name">
    <select id="addItemUnit" onchange="onAddUnitChange()"></select>
    <input type="text" id="addItemPar" placeholder="Par level">
    <select id="addItemCat"><option value="">Select category...</option></select>
    <select id="addItemVendor" onchange="refreshCatDropdown()"></select>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeAdd()">Cancel</button><button class="modal-btn save" onclick="saveAdd()">Add</button></div>
  </div>
</div>

<div class="modal-bg" id="moveModal">
  <div class="modal">
    <h3>Move Item to Shelf</h3>
    <div id="moveItemName" style="color:var(--muted);font-size:0.85rem;margin-bottom:10px"></div>
    <select id="moveShelf"></select>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeMove()">Cancel</button><button class="modal-btn save" onclick="saveMove()">Move</button></div>
  </div>
</div>
<div class="modal-bg" id="unitsModal">
  <div class="modal">
    <h3>Manage Units</h3>
    <div class="unit-add-row"><input type="text" id="newUnitName" placeholder="New unit name" autocomplete="off"><button onclick="addUnit()">Add</button></div>
    <div class="unit-list" id="unitList"></div>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeUnitsModal()">Done</button></div>
  </div>
</div>
<div class="modal-bg" id="shelvesModal">
  <div class="modal">
    <h3>Manage Shelves</h3>
    <div class="unit-add-row"><select id="newShelfVendor" style="flex:0 0 auto;width:auto;min-width:104px;margin:0"></select><input type="text" id="newShelfName" placeholder="New shelf name" autocomplete="off"><button onclick="addShelf()">Add</button></div>
    <div class="unit-list" id="shelfList"></div>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeShelvesModal()">Done</button></div>
  </div>
</div>
<div class="modal-bg" id="unitAddModal">
  <div class="modal">
    <h3>New Unit</h3>
    <input type="text" id="otherUnitName" placeholder="Unit name (e.g. flat, sleeve)" autocomplete="off">
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closeOtherUnit()">Cancel</button><button class="modal-btn save" onclick="saveOtherUnit()">Add</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>

var guide='birite',items=[],mgr=false,todayStr='',st=null,quantities={};

// Managed "shelf" registry (order_categories). Drives section order + the add-item
// shelf picker. Loaded before the first render; if it fails, the guide falls back to
// today's first-seen grouping so ordering never breaks.
function loadCategories(cb){
  api('GET','order_categories','location=eq.Tempest&order=vendor.asc,sort_order.asc',null,function(rc){
    catByVendor={};catRegistryLoaded=false;
    if(Array.isArray(rc)){
      catRegistryLoaded=true;
      for(var i=0;i<rc.length;i++){var c=rc[i];if(!catByVendor[c.vendor])catByVendor[c.vendor]=[];catByVendor[c.vendor].push(c);}
    }
    if(cb)cb();
  });
}
function loadData(){

  loadCategories(function(){
  api('GET','order_items','location=eq.Tempest&active=eq.true&order=sort_order.asc',null,function(r){
    items=r||[];
    // Load the one OPEN order per guide (not date-scoped — survives midnight & reloads).
    api('GET','orders','location=eq.Tempest&status=eq.open',null,function(r2){
      var openByGuide={birite:null,produce:null};
      if(r2)for(var i=0;i<r2.length;i++){
        var g=r2[i].guide_name==='birite_dairy'?'birite':'produce';
        openByGuide[g]=r2[i];

      // post-submit view persists across reloads.
      api('GET','orders','location=eq.Tempest&status=eq.submitted&order=submitted_at.desc',null,function(r3){
        var subByGuide={birite:null,produce:null};
        if(r3)for(var j=0;j<r3.length;j++){
          var g2=r3[j].guide_name==='birite_dairy'?'birite':'produce';
          if(!subByGuide[g2]&&r3[j].submit_date===todayStr)subByGuide[g2]=r3[j];
        }
        // An open row is the live working draft; otherwise fall back to today's submitted.
        curOrder={birite:null,produce:null};quantities={};
        ['birite','produce'].forEach(function(g){
          var row=openByGuide[g]||subByGuide[g];
          if(!row)return;
          curOrder[g]=row;
          var qs=row.quantities||{};
          for(var k in qs){if(qs[k]!==''&&qs[k]!=null)quantities[k]=qs[k];}

      });
    });
  });
  });
  });

function renameUnit(uid,inp){
  var v=inp.value.trim(),u=unitMap[uid];if(!u||v===u.label)return;
  if(!v){inp.value=u.label;return;}
  for(var i=0;i<units.length;i++)if(units[i].id!==uid&&units[i].label.toLowerCase()===v.toLowerCase()){showToast('Name already in use','error');inp.value=u.label;return;}
  api('PATCH','order_units','id=eq.'+uid,{label:v},function(r){

        showToast('Renamed','success');renderUnitList();render();

function fillCatSelect(vendor,selected){
  var catSel=document.getElementById('addItemCat');
  catSel.innerHTML='<option value="">Select shelf...</option>';
  var list=(catByVendor[vendor]||[]).filter(function(c){return c.active;});
  if(list.length){
    for(var i=0;i<list.length;i++){
      var o=document.createElement('option');o.value=list[i].label;o.textContent=list[i].label;
      if(selected&&selected===list[i].label)o.selected=true;
      catSel.appendChild(o);
    }
    return;
  }
  // Fallback (registry empty/failed): offer existing item categories for this vendor.
  var seen={};
  for(var i=0;i<items.length;i++){
    if(items[i].vendor===vendor&&items[i].category&&!seen[items[i].category]){
      seen[items[i].category]=true;
      var o=document.createElement('option');o.value=items[i].category;o.textContent=items[i].category;
      if(selected&&selected===items[i].category)o.selected=true;
      catSel.appendChild(o);
    }
  }
}
function findShelf(cid){
  for(var v in catByVendor){var l=catByVendor[v];for(var i=0;i<l.length;i++)if(l[i].id===cid)return l[i];}
  return null;
}

      h+='<input class="unit-name" value="'+esc(c.label)+'" onblur="renameShelf('+c.id+',this)" onkeydown="if(event.key===\'Enter\')this.blur()">';

function moveShelf(cid,dir){
  var c=findShelf(cid);if(!c)return;
  var list=catByVendor[c.vendor]||[];
  var ci=-1;for(var i=0;i<list.length;i++)if(list[i].id===cid){ci=i;break;}
  var si=ci+dir;if(si<0||si>=list.length)return;
  var other=list[si],tmp=c.sort_order;
  c.sort_order=other.sort_order;other.sort_order=tmp;
  api('PATCH','order_categories','id=eq.'+c.id,{sort_order:c.sort_order},null);
  api('PATCH','order_categories','id=eq.'+other.id,{sort_order:other.sort_order},null);
  list.sort(function(a,b){return a.sort_order-b.sort_order;});
  renderShelfList();render();
}
function renameShelf(cid,inp){
  var c=findShelf(cid);if(!c)return;
  var v=inp.value.trim();
  if(!v||v===c.label){inp.value=c.label;return;}
  var list=catByVendor[c.vendor]||[];
  for(var i=0;i<list.length;i++)if(list[i].id!==cid&&list[i].label.toLowerCase()===v.toLowerCase()){showToast('Shelf name already in use','error');inp.value=c.label;return;}
  if(!confirm('Rename shelf "'+c.label+'" to "'+v+'"? Every item on it moves to the new name.')){inp.value=c.label;return;}
  var old=c.label;
  api('PATCH','order_categories','id=eq.'+cid,{label:v},function(r){
    if(!(r&&r.length)){showToast('Rename failed','error');inp.value=old;return;}
    c.label=v;
    // Cascade the new label onto every item on this (vendor, old-label) shelf.

// Persist the guide's in-progress quantities to its single OPEN order row.
function saveDraft(g){
  if(submitting[g]||isSubmitted(g))return;
  var gi=itemsInGuide(g),qs={},cnt=0;
  for(var i=0;i<gi.length;i++){var id=gi[i].id;if(quantities[id]){qs[String(id)]=quantities[id];cnt++;}}
  var body={quantities:qs,item_count:cnt,updated_at:new Date().toISOString()};
  if(curOrder[g]&&curOrder[g].id){
    api('PATCH','orders','id=eq.'+curOrder[g].id,body,function(r){
      if(Array.isArray(r)&&r.length)curOrder[g]=r[0];
    });
  }else{
    if(creatingDraft[g]){pendingSave[g]=true;return;}
    creatingDraft[g]=true;
    api('POST','orders',null,{guide_name:guideDbName(g),location:'Tempest',status:'open',quantities:qs,item_count:cnt},function(r,status){
      creatingDraft[g]=false;
      if(Array.isArray(r)&&r.length){curOrder[g]=r[0];if(pendingSave[g]){pendingSave[g]=false;saveDraft(g);}return;}
      // Another device already opened one — adopt it silently, then re-save our edits onto it.
      if(status===409){fetchOpenOrder(g,function(){pendingSave[g]=false;if(!submitting[g])saveDraft(g);});return;}
    });
  }
}

function submitOrder(){
  var g=guide;
  if(submitting[g])return;
  var name=document.getElementById('filledBy').value.trim();
  if(!name){showToast('Enter your name first','error');document.getElementById('filledBy').focus();return;}
  var gi=itemsInGuide(g),qs={},cnt=0;
  for(var i=0;i<gi.length;i++){var id=gi[i].id;if(quantities[id]){qs[String(id)]=quantities[id];cnt++;}}
  if(!cnt)return;
  if(!confirm('Submit order with '+cnt+' items?'))return;
  // Lock out autosave so a late debounced save can't write into the fresh order.
  submitting[g]=true;
  if(saveTimer[g]){clearTimeout(saveTimer[g]);saveTimer[g]=null;}
  pendingSave[g]=false;
  var btn=document.getElementById('submitBtn');btn.disabled=true;
  var now=new Date();
  var submitDate=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var payload={status:'submitted',submitted_by:name,submitted_at:now.toISOString(),submit_date:submitDate,item_count:cnt,quantities:qs};
  function fail(){submitting[g]=false;btn.disabled=false;showToast('Could not submit. Try again.','error');}
  function doPatch(){
    api('PATCH','orders','id=eq.'+curOrder[g].id,payload,function(r){
      if(!(Array.isArray(r)&&r.length)){fail();return;}
      // Keep the submitted order on screen: same row, now status=submitted.
      curOrder[g]=r[0];submitting[g]=false;
      showToast('Order submitted — '+cnt+' items','success');
      render();
    });
  }
  if(curOrder[g]&&curOrder[g].id){doPatch();}
  else{
    // No open row yet (autosave hadn't created one) — create, then submit it.
    api('POST','orders',null,{guide_name:guideDbName(g),location:'Tempest',status:'open',quantities:qs,item_count:cnt},function(r,status){
      if(Array.isArray(r)&&r.length){curOrder[g]=r[0];doPatch();}
      else if(status===409){fetchOpenOrder(g,function(){if(curOrder[g]&&curOrder[g].id)doPatch();else fail();});}
      else fail();
    });
  }
}

// ── DRAG-TO-REORDER (manager mode, replaces up/down arrows) ──
// One Sortable per shelf (.shelf-body = one vendor + one category), so items can
// never be dragged across shelves or vendors. Mirrors tempest_prep/line.
var sortables=[];
function initSortables(){
  for(var i=0;i<sortables.length;i++){try{sortables[i].destroy();}catch(e){}}
  sortables=[];
  if(!mgr)return;
  if(typeof Sortable==='undefined'){showToast('Drag unavailable — reload page','error');return;}
  var lists=document.querySelectorAll('.shelf-body');
  for(var i=0;i<lists.length;i++){
    (function(listEl){
      sortables.push(Sortable.create(listEl,{
        handle:'.drag-handle',
        draggable:'.item-row',
        animation:150,
        delay:0,
        ghostClass:'sortable-ghost',
        chosenClass:'sortable-chosen',
        dragClass:'sortable-drag',
        onEnd:function(evt){persistOrder(listEl,evt);}
      }));
    })(lists[i]);
  }
}

// Persist a drag: renumber the dragged shelf (one vendor + one category) with clean,
// unique, increasing sort_order values (10,20,30,...) so the reload order
// (order=sort_order.asc, then bucketed by category) is deterministic even if legacy
// rows carried duplicate/zero/tied values. PATCH only the changed order_items rows.
function persistOrder(listEl,evt){
  if(evt.oldIndex===evt.newIndex)return;
  var draggedId=parseInt(evt.item.getAttribute('data-id'),10);
  var dragItem=null;for(var i=0;i<items.length;i++)if(items[i].id===draggedId){dragItem=items[i];break;}
  if(!dragItem)return;
  var vend=dragItem.vendor,cat=dragItem.category||'Other';
  var snap={};for(var i=0;i<items.length;i++)snap[items[i].id]=items[i].sort_order;
  var rows=listEl.querySelectorAll('.item-row'),visIds=[];
  for(var i=0;i<rows.length;i++)visIds.push(parseInt(rows[i].getAttribute('data-id'),10));
  // FULL shelf = every item with this vendor+category, kept in the rendered order
  // (items[] order). Do NOT re-sort on raw sort_order: legacy ties/NULLs would
  // disagree with what's on screen and scramble the result.
  var group=[];for(var i=0;i<items.length;i++){var gi=items[i];if(gi.vendor!==vend)continue;if((gi.category||'Other')!==cat)continue;group.push(gi);}
  var dragged=null,rest=[];
  for(var i=0;i<group.length;i++){if(group[i].id===draggedId)dragged=group[i];else rest.push(group[i]);}
  if(!dragged)return;
  function idxOf(arr,id){for(var k=0;k<arr.length;k++)if(arr[k].id===id)return k;return -1;}
  var vi=visIds.indexOf(draggedId),at,newGroup;
  if(vi<=0){
    var nextId=visIds[1];
    at=nextId!=null?idxOf(rest,nextId):rest.length;if(at<0)at=rest.length;
  }else{
    var prevId=visIds[vi-1];at=idxOf(rest,prevId);at=at<0?rest.length:at+1;
  }
  newGroup=rest.slice(0,at).concat([dragged]).concat(rest.slice(at));
  var changed=[];
  for(var i=0;i<newGroup.length;i++){
    var nv=(i+1)*10;
    if(newGroup[i].sort_order!==nv){newGroup[i].sort_order=nv;changed.push(newGroup[i]);}
  }
  items.sort(function(a,b){return a.sort_order-b.sort_order;});
  render(); // optimistic
  if(changed.length===0)return;
  var pending=changed.length,failed=false;
  changed.forEach(function(it){
    api('PATCH','order_items','id=eq.'+it.id,{sort_order:it.sort_order},function(r){
      if(!r||!r.length)failed=true;
      if(--pending===0){
        if(failed){
          for(var j=0;j<items.length;j++)if(snap[items[j].id]!=null)items[j].sort_order=snap[items[j].id];
          items.sort(function(a,b){return a.sort_order-b.sort_order;});
          render();showToast('Could not save order','error');
        }else{showToast('Moved','success');}
      }
    });
  });
}

// ── MOVE ITEM TO ANOTHER SHELF (manager mode) ──
var moveItemId=null;
function openMove(id){
  var item=null;for(var i=0;i<items.length;i++)if(items[i].id===id){item=items[i];break;}
  if(!item)return;
  moveItemId=id;
  var cur=item.category||'Other';
  document.getElementById('moveItemName').textContent=item.name+' — now on "'+cur+'"';
  var sel=document.getElementById('moveShelf');sel.innerHTML='<option value="">Select shelf...</option>';
  var list=(catByVendor[item.vendor]||[]).filter(function(c){return c.active&&c.label!==cur;});
  if(list.length){
    for(var i=0;i<list.length;i++){var o=document.createElement('option');o.value=list[i].label;o.textContent=list[i].label;sel.appendChild(o);}
  }else{
    // Fallback (registry empty/failed): offer this vendor's other existing shelves.
    var seen={};
    for(var i=0;i<items.length;i++){
      if(items[i].vendor!==item.vendor)continue;
      var c=items[i].category||'Other';
      if(c===cur||seen[c])continue;
      seen[c]=true;var o2=document.createElement('option');o2.value=c;o2.textContent=c;sel.appendChild(o2);
    }
  }
  document.getElementById('moveModal').classList.add('show');
}
function closeMove(){document.getElementById('moveModal').classList.remove('show');moveItemId=null;}
function saveMove(){
  var id=moveItemId,cat=document.getElementById('moveShelf').value;
  if(!id||!cat)return;
  var item=null;for(var i=0;i<items.length;i++)if(items[i].id===id){item=items[i];break;}
  if(!item)return;
  // land at the end of the target shelf
  var mx=0;for(var i=0;i<items.length;i++){var t=items[i];if(t.vendor===item.vendor&&(t.category||'Other')===cat&&t.sort_order>mx)mx=t.sort_order;}
  api('PATCH','order_items','id=eq.'+id,{category:cat,sort_order:mx+10},function(r){
    if(r&&r.length){
      item.category=r[0].category;item.sort_order=r[0].sort_order;
      items.sort(function(a,b){return a.sort_order-b.sort_order;});
      showToast('Moved to '+cat,'success');render();
    }else{showToast('Move failed','error');}
    closeMove();
  });
}

(function(){

  function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
  function nbApi(m,t,q,d,cb){var x=new XMLHttpRequest();x.open(m,SBASE+'/rest/v1/'+t+(q?'?'+q:''));x.setRequestHeader('apikey',SKEY);x.setRequestHeader('Authorization','Bearer '+SKEY);if(d){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Prefer','return=representation');}x.onload=function(){var r=null;try{r=JSON.parse(x.responseText);}catch(e){}if(cb)cb(r);};x.onerror=function(){if(cb)cb(null);};x.send(d?JSON.stringify(d):null);}

  function buildCats(){
    var h='';for(var i=0;i<CATS.length;i++)h+='<div class="nb-cat'+(CATS[i].key===selCat?' sel':'')+'" data-cat="'+CATS[i].key+'">'+CATS[i].emoji+' '+esc(CATS[i].label)+'</div>';

  }
  function loadStaff(){
    nbApi('GET','staff','location=eq.Tempest&active=eq.true&order=name.asc',null,function(r){
      var seen={};if(r&&r.length)for(var i=0;i<r.length;i++){var n=r[i].name;if(n&&!seen[n]){seen[n]=true;var o=document.createElement('option');o.value=n;o.textContent=n;byEl.appendChild(o);}}

  function openModal(){selCat='other';buildCats();bodyEl.value='';byEl.value='';hideErr();modal.classList.add('show');setTimeout(function(){bodyEl.focus();},100);}
  function closeModal(){modal.classList.remove('show');}
  function showErr(m){errEl.textContent=m;errEl.classList.add('show');}
  function hideErr(){errEl.classList.remove('show');}
  function toast(msg){toastEl.textContent='✓ '+msg;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('show');},1600);}
  function save(){
    var body=bodyEl.value.trim(),by=byEl.value;
    if(!body){showErr('Please enter a note.');bodyEl.focus();return;}
    hideErr();saveBtn.disabled=true;
    nbApi('POST','notes',null,{location:'Tempest',category:selCat,body:body,posted_by:by||null,status:'open'},function(r){
      saveBtn.disabled=false;
      if(r&&r.length){closeModal();toast('Note saved');}else{showErr('Could not save note. Please try again.');}
    });
  }
  fab.addEventListener('click',openModal);
  cancelBtn.addEventListener('click',closeModal);
  saveBtn.addEventListener('click',save);
  modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
  loadStaff();
})();
</script>
</body>
</html>

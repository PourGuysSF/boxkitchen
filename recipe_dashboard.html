<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fbfaf6">
<script>
  (function(){
    var raw = localStorage.getItem('boxkitchen_auth');
    var ts = raw ? parseInt(raw, 10) : 0;
    var TTL = 30 * 24 * 60 * 60 * 1000; // 30 days
    if (!ts || isNaN(ts) || (Date.now() - ts) > TTL) {
      window.location.replace('index.html');
    }
  })();
</script>
<title>BoxKitchen — Recipe Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="assets/kitchen.css?v=2026-08-22">
<!-- All styling lives in assets/kitchen.css (see docs/page-restyle.md).
     Masthead and card-grid rules are scoped .rec-page, which is on <body>:
     this is the only desktop-first page and its header is a masthead, not
     the compact sticky header the phone pages share. -->
</head>
<body class="rec-page">
<div class="header">
  <a class="home-link" href="index.html">← Home</a>
  <div class="header-row">
    <div class="head-text">
      <h1>Box<span>Kitchen</span></h1>
      <p>Recipe Database — powered by Supabase</p>
    </div>
    <div class="mgr-toggle"><span>Manager</span><div class="mgr-switch" id="mgrSwitch" onclick="toggleMgr()"><div class="knob"></div></div></div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Connecting to database...</span>
  </div>
</div>
<div class="controls">
  <input type="text" class="search-box" id="searchBox" placeholder="Search recipes...">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('Tempest', this)">Tempest</button>
  <button class="filter-btn" onclick="setFilter('Showdown', this)">Showdown</button>
  <button class="filter-btn archived-toggle" id="archivedToggleBtn" onclick="toggleArchivedView()">Show archived</button>
  <span class="count" id="recipeCount"></span>
</div>
<div class="mgr-add-bar"><button class="mgr-add-btn" onclick="openRecipe('add')">+ Add Recipe</button></div>
<div class="grid" id="recipeGrid">
  <div class="loading"><div class="spinner"></div><p>Loading recipes from database...</p></div>
</div>
<!-- Manager PIN modal -->
<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>Enter Manager PIN</h3>
    <label>4-digit PIN</label>
    <input class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" autocomplete="off">
    <div class="modal-err" id="pinErr">Incorrect PIN</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePin()">Cancel</button>
      <button class="modal-btn save" onclick="submitPin()">Unlock</button>
    </div>
  </div>
</div>

<!-- Add/Edit Recipe modal -->
<div class="modal-bg" id="recipeModal">
  <div class="modal modal-lg">
    <h3 id="recipeModalTitle">Add Recipe</h3>
    <label>Name</label>
    <input type="text" id="recipeName" autocomplete="off" placeholder="Recipe name">
    <label>Category</label>
    <select id="recipeCategory" onchange="onRecipeCatChange()"></select>
    <input type="text" id="recipeCategoryNew" style="display:none;margin-top:8px" placeholder="New category name" autocomplete="off">
    <label>Station (optional)</label>
    <select id="recipeStation" onchange="onRecipeStnChange()"></select>
    <input type="text" id="recipeStationNew" style="display:none;margin-top:8px" placeholder="New station name" autocomplete="off">
    <label>Yield (optional)</label>
    <input type="text" id="recipeYield" autocomplete="off" placeholder="e.g. makes 6 qt">
    <div id="components"></div>
    <button type="button" class="add-comp-btn" onclick="addComponent()">+ Add component</button>
    <div class="modal-err" id="recipeErr"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeRecipe()">Cancel</button>
      <button class="modal-btn save" id="recipeSaveBtn" onclick="saveRecipe()">Save</button>
    </div>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-bg" id="deleteModal">
  <div class="modal">
    <h3>Delete recipe permanently</h3>
    <p style="font-size:0.9rem;color:var(--ink);margin-bottom:10px;">You are about to permanently delete <strong id="deleteRecipeName"></strong>.</p>
    <p style="font-size:0.83rem;color:var(--tomato);font-weight:600;margin-bottom:14px;">This cannot be undone.</p>
    <label>Type the recipe name to confirm</label>
    <input type="text" id="deleteConfirmInput" autocomplete="off" placeholder="Type the recipe name to confirm">
    <div class="modal-err" id="deleteErr"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeDelete()">Cancel</button>
      <button class="modal-btn danger" id="deleteConfirmBtn" onclick="confirmDelete()" disabled>Delete permanently</button>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://sxppuyarecqkgkrsrefc.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cHB1eWFyZWNxa2drcnNyZWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTA4MzAsImV4cCI6MjA5Mjk2NjgzMH0.GM8OfcR68_JjdPeQ3k7j6L3ulJFaeS1xnSLBcdtYXtU';
var MANAGER_PIN = '4316';
var STATION_OPTIONS = ['Saute', 'Grill', 'Salad', 'Prep', 'Pastry'];
var allRecipes = [];
var activeFilter = 'all';
var mgr = false;
var showArchived = false;
var editId = null;
var toastTimer = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function api(method, table, query, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, SUPABASE_URL + '/rest/v1/' + table + (query ? '?' + query : ''));
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  if (body) {
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Prefer', 'return=representation');
  }
  xhr.onload = function() {
    var r = null;
    try { r = JSON.parse(xhr.responseText); } catch (e) {}
    if (cb) cb(r, xhr.status);
  };
  xhr.onerror = function() { if (cb) cb(null, 0); };
  xhr.send(body ? JSON.stringify(body) : null);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = (type === 'success' ? '✓ ' : '⚠ ') + msg;
  t.className = 'toast show ' + (type || 'success');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.className = 'toast'; }, 2000);
}

function fetchRecipes() {
  api('GET', 'Recipes', 'select=*&order=name.asc', null, function(r, status) {
    if (status === 200 && r) {
      allRecipes = r;
      document.getElementById('statusDot').style.background = 'var(--ink)';
      document.getElementById('statusText').textContent = 'Connected — ' + allRecipes.length + ' recipes loaded';
      renderRecipes();
    } else {
      showError('HTTP ' + status);
    }
  });
}

function showError(msg) {
  document.getElementById('statusDot').style.background = 'var(--tomato)';
  document.getElementById('statusText').textContent = 'Connection failed';
  document.getElementById('recipeGrid').innerHTML = '<div class="empty-state"><h3>Could not connect</h3><p>' + esc(msg) + '</p></div>';
}

function formatIngredients(ing) {
  if (!ing) return '';
  var lines = ing.split(/\r?\n/);
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var item = lines[i].trim();
    if (!item) continue;
    if (/^—.+—$/.test(item)) {
      html += '<div style="padding:8px 0 4px;color:#e85d3a;font-weight:700;letter-spacing:1px;font-size:0.78rem;">' + esc(item) + '</div>';
    } else {
      html += '<div style="padding:2px 0;">' + esc(item) + '</div>';
    }
  }
  return html;
}

function formatMethod(method) {
  if (!method) return '';
  var lines = method.split(/\r?\n/);
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (/^—.+—$/.test(line)) {
      html += '<div class="step" style="color:#e85d3a;font-weight:700;letter-spacing:1px;font-size:0.78rem;margin-top:8px;">' + esc(line) + '</div>';
    } else {
      html += '<div class="step">' + esc(line) + '</div>';
    }
  }
  return html;
}

function renderRecipes() {
  var grid = document.getElementById('recipeGrid');
  var search = document.getElementById('searchBox').value.toLowerCase();
  var filtered = [];
  for (var i = 0; i < allRecipes.length; i++) {
    var r = allRecipes[i];
    var isArchived = r.status === 'archived';
    var showThis = mgr && showArchived ? isArchived : !isArchived;
    if (!showThis) continue;
    var matchFilter = activeFilter === 'all' || (r.location && r.location.toLowerCase() === activeFilter.toLowerCase());
    var matchSearch = !search ||
      (r.name && r.name.toLowerCase().indexOf(search) > -1) ||
      (r.category && r.category.toLowerCase().indexOf(search) > -1) ||
      (r.station && r.station.toLowerCase().indexOf(search) > -1) ||
      (r.ingredients && r.ingredients.toLowerCase().indexOf(search) > -1);
    if (matchFilter && matchSearch) filtered.push(r);
  }
  var label = mgr && showArchived ? 'archived recipe' : 'recipe';
  document.getElementById('recipeCount').textContent = filtered.length + ' ' + label + (filtered.length !== 1 ? 's' : '');
  if (filtered.length === 0) {
    var msg = mgr && showArchived
      ? '<div class="empty-state"><h3>No archived recipes</h3><p>Archived recipes will appear here.</p></div>'
      : '<div class="empty-state"><h3>No recipes found</h3><p>Try a different search or add a new recipe.</p></div>';
    grid.innerHTML = msg;
    return;
  }
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var r = filtered[i];
    var loc = (r.location || 'unknown').toLowerCase().replace(/\s+/g, '-');
    var isArchived = r.status === 'archived';
    html += '<div class="card' + (isArchived ? ' archived' : '') + '" onclick="toggleCard(this)">';
    html += '<div class="card-header">';
    html += '<div class="card-title">' + esc(r.name || 'Untitled') + '</div>';
    html += '<span class="location-tag ' + esc(loc) + '">' + esc(r.location || '') + '</span>';
    html += '</div>';
    if (isArchived) html += '<span class="location-tag archived" style="margin-bottom:12px;display:inline-block;">Archived</span> ';
    if (r.category) html += '<span class="card-category">' + esc(r.category) + '</span>';
    if (r.station) html += '<span class="card-station">' + esc(r.station) + '</span>';
    if (r.yield_text) html += '<div class="card-yield">' + esc(r.yield_text) + '</div>';
    if (r.ingredients) {
      html += '<div class="section-label">Ingredients</div>';
      html += '<div class="ingredients-preview">' + esc(r.ingredients.replace(/[\n\r]+/g, ', ')) + '</div>';
      html += '<div class="ingredients-full">' + formatIngredients(r.ingredients) + '</div>';
    }
    if (r.method) {
      html += '<div class="method-full">';
      html += '<div class="section-label">Method</div>';
      html += formatMethod(r.method);
      html += '</div>';
    }
    html += '<div class="expand-hint"><span>▼ tap to expand</span></div>';
    var archiveBtn;
    if (isArchived) {
      archiveBtn = '<button class="mgr-unarchive-btn" onclick="event.stopPropagation();unarchiveRecipe(' + r.id + ')">Unarchive</button>'
                 + '<button class="mgr-delete-btn" onclick="event.stopPropagation();openDelete(' + r.id + ')">Delete</button>';
    } else {
      archiveBtn = '<button class="mgr-archive-btn" onclick="event.stopPropagation();archiveRecipe(' + r.id + ')">Archive</button>';
    }
    html += '<div class="card-mgr-actions">'
      + '<button class="mgr-edit-btn" onclick="event.stopPropagation();openRecipe(\'edit\',' + r.id + ')">Edit</button>'
      + archiveBtn
      + '</div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

function toggleCard(card) {
  if (card.classList.contains('open')) card.classList.remove('open');
  else card.classList.add('open');
}

function setFilter(filter, btn) {
  activeFilter = filter;
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].id !== 'archivedToggleBtn') btns[i].classList.remove('active');
  }
  btn.classList.add('active');
  renderRecipes();
}

function toggleArchivedView() {
  showArchived = !showArchived;
  var btn = document.getElementById('archivedToggleBtn');
  if (showArchived) {
    btn.classList.add('active');
    btn.textContent = 'Showing archived';
  } else {
    btn.classList.remove('active');
    btn.textContent = 'Show archived';
  }
  renderRecipes();
}

// ── MANAGER MODE ──
function applyMgrClass() {
  if (mgr) document.body.classList.add('manager-mode');
  else document.body.classList.remove('manager-mode');
}

function toggleMgr() {
  if (mgr) {
    mgr = false;
    if (showArchived) toggleArchivedView();
    document.getElementById('mgrSwitch').classList.remove('on');
    applyMgrClass();
    renderRecipes();
    return;
  }
  if (sessionStorage.getItem('boxkitchen_mgr') === '1') {
    mgr = true;
    document.getElementById('mgrSwitch').classList.add('on');
    applyMgrClass();
    renderRecipes();
    return;
  }
  openPin();
}

function openPin() {
  var inp = document.getElementById('pinInput');
  inp.value = '';
  document.getElementById('pinErr').classList.remove('show');
  document.getElementById('pinModal').classList.add('show');
  setTimeout(function() { inp.focus(); }, 100);
}

function closePin() { document.getElementById('pinModal').classList.remove('show'); }

function submitPin() {
  var v = (document.getElementById('pinInput').value || '').trim();
  if (v === MANAGER_PIN) {
    sessionStorage.setItem('boxkitchen_mgr', '1');
    closePin();
    mgr = true;
    document.getElementById('mgrSwitch').classList.add('on');
    applyMgrClass();
    renderRecipes();
    showToast('Manager mode unlocked', 'success');
  } else {
    var e = document.getElementById('pinErr');
    e.classList.add('show');
    var inp = document.getElementById('pinInput');
    inp.value = '';
    inp.focus();
  }
}

// ── RECIPE FORM (Add/Edit) ──
function buildRecipeCategoryOptions(selectedCat) {
  var sel = document.getElementById('recipeCategory');
  var cats = [], seen = {};
  for (var i = 0; i < allRecipes.length; i++) {
    var c = allRecipes[i].category;
    if (c && !seen[c]) { seen[c] = true; cats.push(c); }
  }
  cats.sort();
  var h = '';
  for (var i = 0; i < cats.length; i++) h += '<option value="' + esc(cats[i]) + '">' + esc(cats[i]) + '</option>';
  h += '<option value="__other__">+ Other (type new)…</option>';
  sel.innerHTML = h;
  var nw = document.getElementById('recipeCategoryNew');
  nw.style.display = 'none'; nw.value = '';
  if (selectedCat) {
    var found = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === selectedCat) { sel.value = selectedCat; found = true; break; }
    }
    if (!found) { sel.value = '__other__'; nw.style.display = 'block'; nw.value = selectedCat; }
  } else if (cats.length) {
    sel.value = cats[0];
  } else {
    sel.value = '__other__'; nw.style.display = 'block';
  }
}

function buildStationOptions(selectedStn) {
  var sel = document.getElementById('recipeStation');
  var h = '<option value="">—</option>';
  for (var i = 0; i < STATION_OPTIONS.length; i++) h += '<option value="' + esc(STATION_OPTIONS[i]) + '">' + esc(STATION_OPTIONS[i]) + '</option>';
  h += '<option value="__other__">+ Other (type new)…</option>';
  sel.innerHTML = h;
  var nw = document.getElementById('recipeStationNew');
  nw.style.display = 'none'; nw.value = '';
  if (selectedStn) {
    var found = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === selectedStn) { sel.value = selectedStn; found = true; break; }
    }
    if (!found) { sel.value = '__other__'; nw.style.display = 'block'; nw.value = selectedStn; }
  } else {
    sel.value = '';
  }
}

function onRecipeCatChange() {
  var sel = document.getElementById('recipeCategory');
  var nw = document.getElementById('recipeCategoryNew');
  if (sel.value === '__other__') { nw.style.display = 'block'; setTimeout(function() { nw.focus(); }, 50); }
  else { nw.style.display = 'none'; }
}

function onRecipeStnChange() {
  var sel = document.getElementById('recipeStation');
  var nw = document.getElementById('recipeStationNew');
  if (sel.value === '__other__') { nw.style.display = 'block'; setTimeout(function() { nw.focus(); }, 50); }
  else { nw.style.display = 'none'; }
}

function componentBlockHTML(idx, name, ingredients, method) {
  return '<div class="comp-block' + (idx === 0 ? ' first' : '') + '">'
    + '<div class="comp-head">'
    +   '<label>Component name <span class="comp-opt">(optional for single recipes)</span></label>'
    +   '<button type="button" class="comp-remove" onclick="removeComponent(this)" style="display:none">✕</button>'
    + '</div>'
    + '<input type="text" class="comp-name" autocomplete="off" placeholder="e.g. Soup Base" value="' + esc(name || '') + '">'
    + '<label>Ingredients (one per line)</label>'
    + '<textarea class="comp-ingredients" rows="5" placeholder="2 tbsp olive oil\n1 onion, diced\n…">' + esc(ingredients || '') + '</textarea>'
    + '<label>Method (one step per line, no numbers)</label>'
    + '<textarea class="comp-method" rows="6" placeholder="Heat oil in a heavy pot.\nSweat onion until translucent.\n…">' + esc(method || '') + '</textarea>'
    + '</div>';
}

function refreshComponentRemoveButtons() {
  var blocks = document.querySelectorAll('#components .comp-block');
  for (var i = 0; i < blocks.length; i++) {
    var btn = blocks[i].querySelector('.comp-remove');
    if (btn) btn.style.display = blocks.length > 1 ? 'inline-block' : 'none';
  }
}

function addComponent() {
  var c = document.getElementById('components');
  var idx = c.querySelectorAll('.comp-block').length;
  c.insertAdjacentHTML('beforeend', componentBlockHTML(idx, '', '', ''));
  refreshComponentRemoveButtons();
}

function removeComponent(btn) {
  var block = btn.closest('.comp-block');
  if (block) block.parentNode.removeChild(block);
  refreshComponentRemoveButtons();
}

function openRecipe(mode, id) {
  editId = null;
  document.getElementById('recipeErr').classList.remove('show');
  var saveBtn = document.getElementById('recipeSaveBtn');
  saveBtn.disabled = false;
  var comps = document.getElementById('components');
  comps.innerHTML = '';
  if (mode === 'edit') {
    var r = null;
    for (var i = 0; i < allRecipes.length; i++) if (allRecipes[i].id === id) { r = allRecipes[i]; break; }
    if (!r) return;
    editId = id;
    document.getElementById('recipeModalTitle').textContent = 'Edit Recipe';
    document.getElementById('recipeName').value = r.name || '';
    buildRecipeCategoryOptions(r.category || '');
    buildStationOptions(r.station || '');
    document.getElementById('recipeYield').value = r.yield_text || '';
    // Edit mode: show raw stored text in a single block — preserves multi-component data faithfully.
    comps.insertAdjacentHTML('beforeend', componentBlockHTML(0, '', r.ingredients || '', r.method || ''));
  } else {
    document.getElementById('recipeModalTitle').textContent = 'Add Recipe';
    document.getElementById('recipeName').value = '';
    buildRecipeCategoryOptions('');
    buildStationOptions('');
    document.getElementById('recipeYield').value = '';
    comps.insertAdjacentHTML('beforeend', componentBlockHTML(0, '', '', ''));
  }
  refreshComponentRemoveButtons();
  document.getElementById('recipeModal').classList.add('show');
  setTimeout(function() { document.getElementById('recipeName').focus(); }, 100);
}

function closeRecipe() {
  document.getElementById('recipeModal').classList.remove('show');
  editId = null;
}

function numberMethod(text) {
  var lines = String(text || '').split(/\r?\n/);
  var out = [], n = 0;
  for (var i = 0; i < lines.length; i++) {
    var L = lines[i].trim();
    if (!L) continue;
    if (/^—.+—$/.test(L)) { out.push(L); n = 0; }
    else {
      // Strip any existing leading "N. " so editing a previously-numbered recipe doesn't double up.
      L = L.replace(/^\d+\.\s*/, '');
      n++;
      out.push(n + '. ' + L);
    }
  }
  return out.join('\n');
}

function buildCombined(comps) {
  // Single component, no name: write text as-is (re-number method only).
  if (comps.length === 1 && !comps[0].name) {
    return {
      ingredients: comps[0].ingredients.trim(),
      method: numberMethod(comps[0].method)
    };
  }
  var ings = [], meths = [];
  for (var i = 0; i < comps.length; i++) {
    var c = comps[i];
    var sub = '— ' + c.name.toUpperCase() + ' —';
    ings.push(sub + '\n' + c.ingredients.trim());
    meths.push(sub + '\n' + numberMethod(c.method));
  }
  return { ingredients: ings.join('\n\n'), method: meths.join('\n\n') };
}

function saveRecipe() {
  var err = document.getElementById('recipeErr');
  err.classList.remove('show');
  var name = (document.getElementById('recipeName').value || '').trim();
  var catSel = document.getElementById('recipeCategory');
  var cat = catSel.value;
  if (cat === '__other__') cat = (document.getElementById('recipeCategoryNew').value || '').trim();
  var stnSel = document.getElementById('recipeStation');
  var stn = stnSel.value;
  if (stn === '__other__') stn = (document.getElementById('recipeStationNew').value || '').trim();
  var yld = (document.getElementById('recipeYield').value || '').trim();

  var blocks = document.querySelectorAll('#components .comp-block');
  var comps = [];
  for (var i = 0; i < blocks.length; i++) {
    comps.push({
      name: (blocks[i].querySelector('.comp-name').value || '').trim(),
      ingredients: blocks[i].querySelector('.comp-ingredients').value || '',
      method: blocks[i].querySelector('.comp-method').value || ''
    });
  }

  if (!name) { err.textContent = 'Name is required'; err.classList.add('show'); return; }
  if (!cat) { err.textContent = 'Category is required'; err.classList.add('show'); return; }
  if (!comps.length) { err.textContent = 'At least one component is required'; err.classList.add('show'); return; }
  if (comps.length > 1) {
    for (var i = 0; i < comps.length; i++) {
      if (!comps[i].name) { err.textContent = 'Each component needs a name when there is more than one'; err.classList.add('show'); return; }
    }
  }
  var hasContent = false;
  for (var i = 0; i < comps.length; i++) {
    if (comps[i].ingredients.trim() || comps[i].method.trim()) { hasContent = true; break; }
  }
  if (!hasContent) { err.textContent = 'Add at least some ingredients or method'; err.classList.add('show'); return; }

  var combined = buildCombined(comps);
  var payload = {
    name: name,
    category: cat,
    station: stn || null,
    yield_text: yld || null,
    ingredients: combined.ingredients,
    method: combined.method
  };

  var btn = document.getElementById('recipeSaveBtn');
  btn.disabled = true;
  if (editId) {
    api('PATCH', 'Recipes', 'id=eq.' + editId, payload, function(r, status) {
      btn.disabled = false;
      if (r && r.length) { closeRecipe(); showToast('Recipe saved', 'success'); fetchRecipes(); }
      else { err.textContent = 'Save failed — try again'; err.classList.add('show'); }
    });
  } else {
    payload.location = 'Tempest';
    payload.status = 'active';
    api('POST', 'Recipes', null, payload, function(r, status) {
      btn.disabled = false;
      if (r && r.length) { closeRecipe(); showToast('Recipe added', 'success'); fetchRecipes(); }
      else { err.textContent = 'Add failed — try again'; err.classList.add('show'); }
    });
  }
}

function archiveRecipe(id) {
  if (!confirm('Archive this recipe? It will be hidden from the active list.')) return;
  api('PATCH', 'Recipes', 'id=eq.' + id, { status: 'archived' }, function(r) {
    if (r && r.length) { showToast('Recipe archived', 'success'); fetchRecipes(); }
    else { showToast('Archive failed — try again', 'error'); }
  });
}

function unarchiveRecipe(id) {
  if (!confirm('Restore this recipe to the active list?')) return;
  api('PATCH', 'Recipes', 'id=eq.' + id, { status: 'active' }, function(r) {
    if (r && r.length) { showToast('Recipe restored', 'success'); fetchRecipes(); }
    else { showToast('Restore failed — try again', 'error'); }
  });
}

function openDelete(id) {
  var r = null;
  for (var i = 0; i < allRecipes.length; i++) if (allRecipes[i].id === id) { r = allRecipes[i]; break; }
  if (!r) return;
  document.getElementById('deleteRecipeName').textContent = r.name || '(unnamed)';
  document.getElementById('deleteErr').classList.remove('show');
  var input = document.getElementById('deleteConfirmInput');
  input.value = '';
  input.dataset.target = r.name || '';
  input.dataset.recipeId = String(r.id);
  document.getElementById('deleteConfirmBtn').disabled = true;
  document.getElementById('deleteModal').classList.add('show');
  setTimeout(function() { input.focus(); }, 100);
}

function closeDelete() {
  document.getElementById('deleteModal').classList.remove('show');
  document.getElementById('deleteErr').classList.remove('show');
}

function onDeleteInputChange() {
  var input = document.getElementById('deleteConfirmInput');
  var match = input.value === input.dataset.target;
  document.getElementById('deleteConfirmBtn').disabled = !match;
}

function confirmDelete() {
  var input = document.getElementById('deleteConfirmInput');
  if (input.value !== input.dataset.target) return;
  var id = parseInt(input.dataset.recipeId, 10);
  if (!id) return;
  var btn = document.getElementById('deleteConfirmBtn');
  btn.disabled = true;
  api('DELETE', 'Recipes', 'id=eq.' + id, null, function(_, status) {
    if (status >= 200 && status < 300) {
      // Confirm the row is actually gone before claiming success — a delete
      // that matches 0 rows also returns 2xx (see the old notes-page bug).
      api('GET', 'Recipes', 'id=eq.' + id + '&select=id', null, function(chk) {
        if (chk && chk.length) {
          var err2 = document.getElementById('deleteErr');
          err2.textContent = "Delete didn't save — try again";
          err2.classList.add('show');
          showToast('Delete failed', 'error');
          btn.disabled = false;
          return;
        }
        closeDelete();
        showToast('Recipe deleted', 'success');
        fetchRecipes();
      });
    } else {
      var err = document.getElementById('deleteErr');
      err.textContent = 'Delete failed — try again';
      err.classList.add('show');
      showToast('Delete failed', 'error');
      btn.disabled = false;
    }
  });
}

document.getElementById('pinModal').addEventListener('click', function(e) { if (e.target === this) closePin(); });
document.getElementById('recipeModal').addEventListener('click', function(e) { if (e.target === this) closeRecipe(); });
document.getElementById('deleteModal').addEventListener('click', function(e) { if (e.target === this) closeDelete(); });
document.getElementById('pinInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); submitPin(); } });
document.getElementById('deleteConfirmInput').addEventListener('input', onDeleteInputChange);
document.getElementById('deleteConfirmInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !document.getElementById('deleteConfirmBtn').disabled) {
    e.preventDefault();
    confirmDelete();
  }
});
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('deleteModal').classList.contains('show')) closeDelete();
  else if (document.getElementById('recipeModal').classList.contains('show')) closeRecipe();
  else if (document.getElementById('pinModal').classList.contains('show')) closePin();
});
document.getElementById('searchBox').addEventListener('input', renderRecipes);

// Restore manager mode if already unlocked this session.
if (sessionStorage.getItem('boxkitchen_mgr') === '1') {
  mgr = true;
  document.getElementById('mgrSwitch').classList.add('on');
  applyMgrClass();
}

fetchRecipes();
</script>
</body>
</html>
